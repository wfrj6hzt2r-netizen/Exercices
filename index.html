                            { name: "Renforcement diagonal D2 (schéma de lancer)", dose: "3 × 12", tip: "Debout, élastique fixé en bas du côté opposé, main partant de la hanche opposée, paume tournée vers l'arrière. Tirez en diagonale vers le haut et vers l'extérieur en tournant la paume vers l'avant, comme pour dégainer une épée, puis revenez en freinant le retour." },
                            { name: "Renforcement combiné deltoïde-coiffe", dose: "3 × 12", tip: "Debout, un poids léger dans chaque main, épaules basses. Alternez élévations devant vous et sur le côté, jusqu'à hauteur d'épaule. Montez en 2 secondes, redescendez en 4 : c'est la descente freinée qui fait le travail ici." },
                            { name: "Renforcement lourd et lent des rotateurs", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout, coude collé au corps et fléchi à 90°, avec un élastique nettement plus résistant qu'aux stades précédents. Rotation vers l'extérieur en 3 secondes, retour en 3 secondes. La 8e répétition doit être difficile. C'est la progression de charge qui fait évoluer un tendon, pas la répétition à charge constante." }
                        ] },
                    { label: "Renforcement avancé & pliométrie", critere: "Vous enchaînez les exercices pliométriques sans douleur, et la force en rotation vers l'arrière paraît comparable des deux côtés.", exercises: [
                            { name: "Pompes pliométriques légères", dose: "3 × 8", tip: "En appui sur les genoux ou les pieds selon le niveau, poussez pour décoller légèrement les mains du sol, puis amortissez la réception. Exigeant : à réserver à une épaule déjà bien renforcée." },
                            { name: "Lancers de ballon lesté contre un mur", dose: "3 × 10", tip: "Debout face à un mur, lancez un ballon légèrement lesté avec un geste proche du tir en handball, rattrapez-le au rebond et enchaînez." },
                            { name: "Mouvement en chaîne complète (jambes-tronc-bras)", dose: "3 × 10", tip: "Debout, pieds largeur du bassin, un poids léger ou un élastique en main. Fléchissez légèrement les genoux, puis remontez en enchaînant sans temps mort sur une poussée du bras vers l'avant ou vers le haut. Dans un tir, l'épaule ne travaille jamais seule : l'énergie vient des jambes." },
                            { name: "Décélération du bras après lancer", dose: "3 × 10", tip: "Debout, élastique fixé devant vous à hauteur d'épaule, bras armé en arrière. Accompagnez le geste de lancer vers l'avant puis, surtout, freinez lentement la fin du mouvement contre la résistance. C'est le freinage, et non l'accélération, qui sollicite le plus la coiffe lors d'un tir." }
                        ] },
                    { label: "Retour au lancer / au handball", critere: "Vous lancez en montant progressivement d'abord la distance puis l'intensité, sans douleur pendant ni le lendemain et sans appréhension. C'est le volume de lancers, plus que la force, qui fait rechuter : la progression se compte en semaines.", exercises: [
                            { name: "Programme de lancer progressif", dose: "selon protocole", tip: "Reprise du geste de lancer à distance et intensité croissantes sur plusieurs séances, selon un protocole structuré plutôt qu'une reprise brutale à pleine intensité." },
                            { name: "Tirs en handball à intensité progressive", dose: "1 séance encadrée", tip: "Reprise du geste technique du tir, d'abord sans opposition ni vitesse maximale, puis en situation de jeu." },
                            { name: "Tests de force et de symétrie coiffe/scapula", dose: "bilan", tip: "Comparaison de la force entre les deux épaules et du contrôle de l'omoplate avant de valider une reprise complète en match, plutôt que de se fier uniquement au ressenti." },
                            { name: "Maintien du renforcement en saison", dose: "2 × par semaine", tip: "Poursuivez le travail excentrique des rotateurs et le contrôle scapulaire pendant toute la saison. Chez le lanceur, la charge de tirs s'accumule en permanence : l'entretien n'est pas optionnel, c'est la principale protection contre la récidive." }
                        ] }
                ] },
            { id: "capsulite", label: "Capsulite rétractile", groupe: "Raideur qui s'installe", desc: "Épaule progressivement raide et douloureuse sans traumatisme, qui bloque dans toutes les directions — y compris quand quelqu'un d'autre essaie de la bouger à votre place.", checkinKind: "phase", context: "La capsulite évolue en trois phases successives et longues : une phase douloureuse, une phase de raideur, puis une phase de récupération. L'ensemble s'étale souvent sur un à deux ans, parfois davantage. C'est long, et le dire fait partie du traitement : cette évolution est celle de la maladie, pas le signe que la rééducation échoue. Le point qui change tout est d'adapter le travail à la phase. Pendant la phase douloureuse, forcer l'amplitude entretient la douleur et n'accélère rien ; on cherche le confort. Pendant la phase de raideur, au contraire, c'est l'étirement maintenu et régulier qui fait gagner du terrain. Un diabète ou un trouble thyroïdien allonge souvent l'évolution — une raison de plus d'être patient, pas de forcer.", stages: [
                    { label: "Phase douloureuse", critere: "La douleur nocturne s'est calmée et vous dormez la plupart des nuits, la douleur au repos a nettement diminué, et c'est désormais la raideur qui vous gêne plus que la douleur.", sub: "souvent les 2 à 9 premiers mois", exercises: [
                            { name: "Pendulaire de Codman", dose: "3 × 1 min", tip: "Penché en avant, bras relâché dans le vide, laissez-le décrire de petits cercles en balançant le tronc plutôt qu'en tirant sur l'épaule. Le bras doit être passif : c'est le corps qui donne le mouvement." },
                            { name: "Mobilisation dans l'amplitude confortable", dose: "3 × 10", tip: "Levez et tournez le bras uniquement dans la zone qui ne réveille pas la douleur, en vous aidant de l'autre main. On entretient ce qui existe, on ne cherche pas à gagner : à cette phase, forcer entretient la douleur sans accélérer la récupération." },
                            { name: "Installation pour la nuit", dose: "chaque soir", tip: "Allongé sur le dos ou sur le côté non atteint, calez un coussin sous le bras douloureux pour qu'il repose légèrement écarté du corps. La douleur nocturne est la plainte principale de cette phase et se travaille par la position." },
                            { name: "Maintien de la mobilité du coude et de la nuque", dose: "2 × 10", tip: "Bougez régulièrement le coude, le poignet et la nuque. L'épaule immobilise le reste par réflexe, et cette raideur associée se règle facilement si on ne la laisse pas s'installer." }
                        ] },
                    { label: "Phase de raideur", critere: "Vous avez gagné en amplitude par rapport au mois précédent, notamment pour tourner le bras vers l'extérieur, et les étirements maintenus ne provoquent plus qu'une tension supportable qui s'efface en quelques minutes.", sub: "souvent entre 4 et 12 mois", exercises: [
                            { name: "Étirement maintenu en élévation", dose: "3 × 30 sec", tip: "Face à un mur, faites remonter les doigts le long de la paroi jusqu'à sentir une tension nette, puis tenez sans forcer. C'est la durée du maintien, répétée chaque jour, qui fait gagner de l'amplitude — pas l'intensité de la traction." },
                            { name: "Étirement en rotation externe", dose: "3 × 30 sec", tip: "Coude au corps fléchi à 90°, un bâton ou un manche dans les deux mains, poussez doucement l'avant-bras vers l'extérieur avec le bras sain. La rotation externe est la direction la plus touchée et celle qui revient le plus lentement." },
                            { name: "Étirement en rotation interne", dose: "3 × 30 sec", tip: "Main dans le dos, tirez doucement le poignet vers le haut avec une serviette tenue par l'autre main. Tension franche mais supportable, jamais de douleur vive." },
                            { name: "Répétition dans la journée", dose: "4 à 5 fois par jour", tip: "Mieux vaut cinq séances courtes qu'une longue. La capsule répond à la fréquence : c'est le paramètre qui compte le plus à cette phase." }
                        ] },
                    { label: "Phase de récupération", critere: "Vous levez le bras au-dessus de la tête et vous atteignez votre dos sans blocage, et vous constatez que l'amplitude revient d'elle-même entre deux séances.", sub: "souvent à partir de 12 mois", exercises: [
                            { name: "Poursuite des étirements", dose: "2 × 30 sec", tip: "Continuez sur les directions encore limitées, en particulier la rotation externe. Les derniers degrés sont les plus longs à récupérer." },
                            { name: "Renforcement des rotateurs à l'élastique", dose: "3 × 12", tip: "Coude au corps, élastique léger : tournez l'avant-bras vers l'extérieur puis vers l'intérieur. L'épaule a perdu de la force pendant les mois d'immobilité, et c'est le moment de la reconstruire." },
                            { name: "Renforcement des stabilisateurs de l'omoplate", dose: "3 × 12", tip: "Serrez les omoplates l'une vers l'autre, bras le long du corps ou à l'élastique, sans remonter les épaules vers les oreilles." },
                            { name: "Gestes du quotidien en hauteur", dose: "quotidien", tip: "Rangez, étendez, attrapez volontairement avec le bras concerné. C'est l'usage normal qui consolide les amplitudes reprises." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous utilisez votre bras sans y penser dans toutes les tâches du quotidien, la force est comparable des deux côtés, et les nuits sont calmes depuis plusieurs semaines.", sub: "quand l'amplitude est revenue", exercises: [
                            { name: "Renforcement complet de l'épaule", dose: "3 × 12", tip: "Élévations, rotations et travail des omoplates, charge progressive. On rattrape la force perdue pendant l'épisode." },
                            { name: "Reprise des activités et du sport", dose: "selon tolérance", tip: "Réintroduisez progressivement les gestes au-dessus de la tête et les activités que vous aviez abandonnées." },
                            { name: "Entretien de la mobilité", dose: "2 à 3 × par semaine", tip: "Quelques étirements d'entretien, en particulier en rotation externe. Une petite limitation résiduelle est fréquente et sans conséquence, mais l'entretien évite qu'elle s'installe." },
                            { name: "Surveillance de l'autre épaule", dose: "continu", tip: "L'atteinte de la seconde épaule n'est pas rare dans les années qui suivent. Au moindre signe de raideur progressive du côté opposé, consultez tôt : la prise en charge précoce raccourcit l'épisode." }
                        ] }
                ] }
        ] },
    { id: "coude", label: "Coude", injuries: [
            { id: "epicondylite", label: "Épicondylite", desc: "Douleur sur la face externe du coude, réveillée en serrant un objet, en tournant une poignée ou en soulevant une charge paume vers le bas.", context: "Malgré son nom en « -ite », il ne s'agit pas d'une inflammation mais d'une dégénérescence du tendon des muscles qui relèvent le poignet. Cela change tout : le repos seul soulage à court terme mais ne répare rien, alors que le renforcement progressif — en particulier excentrique — donne les meilleurs résultats à moyen terme. L'évolution est lente, souvent plusieurs mois, ce qui est normal et non un signe d'échec. Avant de commencer, un point à vérifier : si la douleur descend du cou vers le coude, ou si vous avez des fourmillements dans les doigts, l'origine peut être une racine nerveuse cervicale plutôt que le tendon lui-même — voyez alors les parcours de névralgie cervico-brachiale dans la zone Rachis cervical.", stages: [
                    { label: "Douleur & mobilité", critere: "Serrer la main de quelqu'un ou tenir un objet ne déclenche plus la douleur vive sur le côté externe du coude.", exercises: [
                            { name: "Mobilité active du poignet", dose: "3 × 15", tip: "Avant-bras posé sur une table, main dans le vide. Montez et descendez le poignet lentement sur toute l'amplitude possible, sans réveiller de douleur vive." },
                            { name: "Étirement des extenseurs", dose: "3 × 30 sec", tip: "Bras tendu devant vous, paume vers le bas. Avec l'autre main, fléchissez doucement le poignet vers le bas jusqu'à sentir une tension sur le dessus de l'avant-bras. Tension modérée, jamais douloureuse." },
                            { name: "Adaptation temporaire des gestes du quotidien", dose: "quotidien", tip: "Portez les objets paume vers le haut plutôt que vers le bas, et limitez temporairement les prises fortes prolongées (visser, porter un sac lourd à bout de bras). Réduire la contrainte quotidienne compte autant que les exercices." },
                            { name: "Étirements du nerf du bras (doux)", dose: "3 × 10", tip: "Bras tendu sur le côté, paume vers l'avant, inclinez doucement la tête du côté opposé puis revenez. Mouvement lent, amplitude confortable : on cherche un glissement du nerf, pas un étirement fort." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez le travail excentrique du poignet sans que la douleur dépasse 3/10 ni qu'elle augmente le lendemain.", exercises: [
                            { name: "Isométrique des extenseurs", dose: "5 × 45 sec", tip: "Avant-bras posé, poignet en extension contre une résistance fixe (votre autre main), sans que le poignet ne bouge. Maintien long volontairement : c'est la durée qui produit l'effet antalgique sur un tendon irrité." },
                            { name: "Excentrique des extenseurs", dose: "3 × 15", tip: "Avant-bras posé, petit haltère ou bouteille en main, paume vers le bas. Relevez le poignet avec l'aide de l'autre main, puis laissez-le redescendre lentement en 3-4 secondes en résistant. C'est cette descente freinée qui constitue le traitement." },
                            { name: "Renforcement de la préhension", dose: "3 × 12", tip: "Avant-bras posé sur une table, coude fléchi, paume vers le haut. Serrez une balle souple 5 secondes, puis relâchez complètement. Augmentez la fermeté de la balle au fil des semaines. La force de serrage est un bon indicateur de progression sur cette pathologie." },
                            { name: "Renforcement des muscles de l'épaule et de l'omoplate", dose: "3 × 12", tip: "Rétraction des omoplates et élévations légères. Un déficit de force plus haut dans le membre augmente les contraintes reportées sur le coude à chaque geste." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous serrez fermement sans douleur, et la force de poigne paraît comparable des deux côtés.", exercises: [
                            { name: "Excentrique progressif chargé", dose: "3 × 12", tip: "Avant-bras posé sur une table, paume vers le bas, poignet dans le vide, un petit haltère en main. Relevez le poignet avec l'aide de l'autre main, puis laissez-le redescendre seul en 4 secondes contre le poids. Augmentez la charge à chaque séance bien tolérée : la progression de charge est le moteur du traitement." },
                            { name: "Coordination prise-préhension", dose: "3 × 10", tip: "Saisissez et manipulez des objets de formes et de poids variés, en variant les prises. Réhabitue le coude à des sollicitations proches de la vie réelle plutôt qu'à un mouvement isolé." },
                            { name: "Coordination épaule-coude en charge", dose: "3 × 12", tip: "Réalisez un mouvement combiné (pousser, tirer, porter) en intégrant épaule et coude, plutôt qu'en isolant l'avant-bras. Le geste fonctionnel implique toujours toute la chaîne." },
                            { name: "Renforcement en rotation de l'avant-bras", dose: "3 × 12", tip: "Coude plié à 90° collé au corps, un petit poids ou un marteau tenu en main. Tournez lentement la paume vers le haut puis vers le bas, en contrôlant les deux sens." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez les gestes en cause — outils, clavier, raquette — sans réveil de la douleur le lendemain. Comptez plusieurs mois : la vitesse à laquelle la douleur disparaît ne dit rien de la solidité du tendon.", exercises: [
                            { name: "Geste raquette ou outil progressif", dose: "1 séance", tip: "Reprise technique du geste sportif ou professionnel, d'abord à faible intensité et sur peu de répétitions, en augmentant progressivement. Un ajustement de matériel ou de technique est souvent utile à ce stade." },
                            { name: "Charge fonctionnelle complète", dose: "3 × 10", tip: "Reproduisez la contrainte réelle de votre activité (porter, visser, frapper) à intensité croissante, en surveillant la douleur du lendemain." },
                            { name: "Reprise de l'activité spécifique", dose: "1 séance", tip: "Retour progressif sur plusieurs séances plutôt qu'une reprise brutale au volume habituel." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Poursuivez le travail excentrique plusieurs mois après la disparition de la douleur : la récidive est fréquente quand le renforcement s'arrête trop tôt." }
                        ] }
                ] },
            { id: "epitrochleite", label: "Épitrochléite", desc: "Douleur sur la face interne du coude, réveillée en fléchissant le poignet, en serrant fortement ou lors des gestes de lancer.", context: "C'est le pendant interne de l'épicondylite, touchant cette fois les muscles qui fléchissent le poignet. Même logique de prise en charge : il s'agit d'une dégénérescence tendineuse et non d'une inflammation, et c'est le renforcement progressif — notamment excentrique — qui fait la différence, pas le repos. L'évolution demande également plusieurs mois de patience. Avant de commencer, un point à vérifier : si la douleur descend du cou vers le coude, ou si vous avez des fourmillements dans les doigts, l'origine peut être une racine nerveuse cervicale plutôt que le tendon lui-même — voyez alors les parcours de névralgie cervico-brachiale dans la zone Rachis cervical.", stages: [
                    { label: "Douleur & mobilité", critere: "Serrer la main ou porter un sac ne déclenche plus la douleur vive sur le côté interne du coude.", exercises: [
                            { name: "Mobilité active du poignet", dose: "3 × 15", tip: "Avant-bras posé sur une table, main dans le vide. Montez et descendez le poignet lentement sur toute l'amplitude possible, sans douleur vive." },
                            { name: "Étirement des fléchisseurs", dose: "3 × 30 sec", tip: "Bras tendu devant vous, paume vers le haut. Avec l'autre main, tirez doucement les doigts vers le bas jusqu'à sentir une tension sur la face interne de l'avant-bras. Tension modérée uniquement." },
                            { name: "Adaptation temporaire des gestes du quotidien", dose: "quotidien", tip: "Limitez les prises fortes en flexion de poignet et les gestes de lancer répétés. Réduire la contrainte quotidienne est aussi important que les exercices eux-mêmes." },
                            { name: "Étirements du nerf du bras (doux)", dose: "3 × 10", tip: "Bras tendu sur le côté, paume vers l'avant, inclinez doucement la tête du côté opposé puis revenez. Mouvement lent, sans forcer." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez le travail excentrique des fléchisseurs du poignet sans dépasser 3/10 ni réveil le lendemain.", exercises: [
                            { name: "Isométrique des fléchisseurs", dose: "5 × 45 sec", tip: "Avant-bras posé, poignet en flexion contre une résistance fixe, sans que le poignet ne bouge. Maintien long volontairement : c'est la durée qui produit l'effet antalgique sur un tendon irrité." },
                            { name: "Excentrique des fléchisseurs", dose: "3 × 15", tip: "Avant-bras posé, petit haltère en main, paume vers le haut. Relevez le poignet avec l'aide de l'autre main, puis laissez-le redescendre lentement en 3-4 secondes en résistant. C'est la descente freinée qui traite le tendon." },
                            { name: "Renforcement de la préhension", dose: "3 × 12", tip: "Avant-bras posé sur une table, coude fléchi, paume vers le haut. Serrez une balle souple 5 secondes, relâchez complètement. Augmentez la fermeté de la balle au fil des semaines plutôt que le nombre de répétitions." },
                            { name: "Renforcement des muscles de l'épaule et de l'omoplate", dose: "3 × 12", tip: "Rétraction des omoplates et rotation externe légère. Chez le lanceur en particulier, un déficit à l'épaule augmente nettement les contraintes reportées sur le coude." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous serrez fermement sans douleur, et la force de poigne paraît comparable des deux côtés.", exercises: [
                            { name: "Excentrique progressif chargé", dose: "3 × 12", tip: "Avant-bras posé sur une table, paume vers le haut, poignet dans le vide, un petit haltère en main. Fléchissez le poignet avec l'aide de l'autre main, puis laissez-le redescendre seul en 4 secondes contre le poids. N'augmentez la charge que si la séance précédente n'a pas réveillé la douleur le lendemain." },
                            { name: "Coordination motrice fine", dose: "3 × 10", tip: "Gestes de précision et de manipulation d'objets variés, en augmentant progressivement l'exigence de force et de contrôle." },
                            { name: "Coordination épaule-coude en charge", dose: "3 × 12", tip: "Debout, élastique fixé devant vous. Tirez en combinant recul de l'omoplate, mouvement d'épaule et flexion du coude, en un seul geste fluide. Un coude douloureux vient souvent d'une épaule qui ne participe pas assez." },
                            { name: "Renforcement en rotation de l'avant-bras", dose: "3 × 12", tip: "Coude plié à 90° collé au corps, poids ou marteau en main. Tournez lentement la paume vers le haut puis vers le bas, en contrôlant les deux sens." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez les gestes en cause sans réveil de la douleur le lendemain. Comme pour le côté externe, comptez plusieurs mois plutôt que plusieurs semaines.", exercises: [
                            { name: "Geste spécifique progressif", dose: "1 séance", tip: "Reprise technique du geste de lancer ou du geste professionnel, à faible intensité d'abord, avec un nombre de répétitions limité." },
                            { name: "Charge fonctionnelle complète", dose: "3 × 10", tip: "Reproduction de la contrainte réelle de votre activité, à intensité croissante, en surveillant la douleur du lendemain." },
                            { name: "Reprise de l'activité spécifique", dose: "1 séance", tip: "Progressive sur plusieurs séances, sans revenir directement au volume habituel." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Poursuivez le travail excentrique plusieurs mois après la disparition de la douleur pour limiter le risque de récidive." }
                        ] }
                ] }
        ] },
    { id: "pubalgie", label: "Pubalgie", injuries: [
            { id: "adducteurs", label: "Tendinopathie des adducteurs", desc: "Douleur progressive à l'aine ou à l'intérieur de la cuisse, réveillée en frappant un ballon, en changeant de direction ou en serrant les jambes.", context: "C'est la forme la plus fréquente de pubalgie chez le footballeur. Le facteur de risque le mieux établi est un déficit de force des adducteurs, en particulier en rapport avec les abducteurs : le renforcement progressif des adducteurs — dont l'exercice de Copenhague est la référence — a montré une réduction nette des douleurs d'aine dans les études de prévention. Un test simple de suivi : la force de serrage d'un ballon entre les genoux doit progresser au fil des semaines.", stages: [
                    { label: "Douleur & mobilité", critere: "Serrer les genoux l'un contre l'autre ne déclenche plus de douleur vive à l'aine, et vous marchez sans gêne.", exercises: [
                            { name: "Isométrique des adducteurs (ballon entre les genoux)", dose: "5 × 30 sec", tip: "Allongé sur le dos, genoux fléchis, un ballon entre les genoux. Pressez progressivement sans douleur vive et maintenez. Sert aussi de test de suivi : la pression tolérée doit augmenter de semaine en semaine." },
                            { name: "Mobilité de hanche en abduction/adduction", dose: "3 × 15", tip: "Debout en appui sur un mur, écartez la jambe sur le côté puis ramenez-la vers l'axe du corps, mouvement lent et contrôlé sur l'amplitude confortable." },
                            { name: "Étirement doux des adducteurs", dose: "3 × 30 sec", tip: "Assis, plantes de pieds jointes, ou debout jambe tendue sur le côté. Tension légère uniquement à l'intérieur de la cuisse, jamais douloureuse à ce stade." },
                            { name: "Adaptation temporaire de la charge sportive", dose: "quotidien", tip: "Réduisez temporairement les frappes de balle et les changements de direction, qui sont les gestes les plus provocants, sans arrêter toute activité pour autant." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices d'adducteurs sans douleur ni réveil le lendemain, et serrer les genoux contre une résistance est indolore.", exercises: [
                            { name: "Adduction de hanche à l'élastique", dose: "4 × 12", tip: "Debout, élastique fixé à un point bas sur le côté et attaché à la cheville. Ramenez la jambe vers l'intérieur contre la résistance, buste stable, puis revenez lentement." },
                            { name: "Exercice de Copenhague (niveau débutant)", dose: "3 × 10", tip: "Allongé sur le côté, en appui sur l'avant-bras, genou de la jambe du dessus posé sur un banc bas. Montez le bassin en poussant sur ce genou, puis redescendez lentement. C'est l'exercice de référence sur cette pathologie ; progressez ensuite vers l'appui sur le pied plutôt que le genou." },
                            { name: "Renforcement des abducteurs", dose: "3 × 12", tip: "Allongé sur le côté ou debout à l'élastique, écartez la jambe contre résistance. C'est le rapport de force entre adducteurs et abducteurs qui compte, pas seulement la force brute des adducteurs." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds. Alignez chevilles, bassin et épaules, serrez les abdominaux sans creuser le bas du dos, et respirez normalement. Tronc et adducteurs travaillent ensemble pour stabiliser le bassin à chaque appui." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous courez et changez de direction en gardant le bassin stable, sans douleur à l'aine.", exercises: [
                            { name: "Fentes latérales contrôlées", dose: "3 × 10", tip: "Grand pas sur le côté, genou fléchi aligné avec le pied, l'autre jambe tendue, puis repoussez pour revenir au centre. Reproduit le mouvement latéral du terrain sous contrôle." },
                            { name: "Stabilité unipodale avec mouvement de jambe opposée", dose: "3 × 10", tip: "Debout sur une jambe, l'autre bouge activement d'avant en arrière ou latéralement, bassin stable et horizontal." },
                            { name: "Gainage dynamique avec rotation du tronc", dose: "3 × 10", tip: "En position de planche sur les avant-bras, tournez légèrement le bassin d'un côté puis de l'autre sans casser l'alignement du dos." },
                            { name: "Exercice de Copenhague progressif", dose: "3 × 8", tip: "Allongé sur le côté, en appui sur l'avant-bras, pied du dessus posé sur un banc ou une chaise. Décollez le bassin et la jambe du dessous jusqu'à aligner épaules, bassin et chevilles, puis redescendez lentement. L'appui sur le pied plutôt que sur le genou augmente nettement la charge : à n'introduire que si la version débutante passe sans douleur le lendemain." }
                        ] },
                    { label: "Retour au sport", critere: "Vous frappez dans un ballon, sprintez et changez de direction à pleine intensité sans douleur ni appréhension. Le serrement des genoux contre résistance doit être à la fois indolore et fort : c'est le repère le mieux établi pour cette localisation.", exercises: [
                            { name: "Changements de direction latéraux", dose: "4 × 15 m", tip: "Vitesse progressive, appuis stables, en surveillant la douleur du lendemain plutôt que celle du moment." },
                            { name: "Frappes de balle contrôlées", dose: "3 × 10", tip: "Reprise technique progressive : d'abord des passes courtes, puis des frappes plus longues, sans douleur à l'aine." },
                            { name: "Sprint et changements d'appui", dose: "4 × 20 m", tip: "Intensité croissante jusqu'à se rapprocher de celle du match." },
                            { name: "Maintien du renforcement des adducteurs", dose: "2 × par semaine", tip: "À poursuivre toute la saison en prévention : c'est l'une des mesures dont l'effet protecteur est le mieux démontré sur les douleurs d'aine du footballeur." }
                        ] }
                ] },
            { id: "paroi-abdominale", label: "Pubalgie inguinale (paroi abdominale)", desc: "Douleur à l'aine ou au bas-ventre, augmentée par la toux, les abdominaux, le sprint ou le redressement du buste.", context: "Cette forme concerne la paroi abdominale plutôt que les adducteurs, mais les deux coexistent souvent : le pubis est le point d'ancrage commun où s'opposent la traction des abdominaux vers le haut et celle des adducteurs vers le bas. La rééducation vise donc à rééquilibrer ces deux chaînes ensemble, plutôt qu'à traiter la paroi isolément. Une douleur nette à la toux ou à l'éternuement est un signe caractéristique à mentionner à votre médecin.", stages: [
                    { label: "Douleur & mobilité", critere: "Tousser ou se redresser du lit ne déclenche plus la douleur vive au pli de l'aine.", exercises: [
                            { name: "Gainage abdominal doux, maintenu", dose: "3 × 20 sec", tip: "Planche sur les avant-bras, genoux au sol si besoin, sans douleur à l'aine. Respiration régulière, sans bloquer le souffle." },
                            { name: "Mobilité du bassin en douceur", dose: "3 × 10", tip: "Allongé sur le dos, genoux pliés. Basculez doucement le bassin d'avant en arrière, en creusant puis en plaquant le bas du dos, sans réveiller la douleur à l'aine." },
                            { name: "Marche courte régulière", dose: "10 min", tip: "Allure confortable, plusieurs fois par jour plutôt qu'une seule séance longue." },
                            { name: "Isométrique des adducteurs à faible intensité", dose: "5 × 30 sec", tip: "Allongé sur le dos, genoux fléchis et pieds à plat, un ballon souple coincé entre les genoux. Serrez le ballon à intensité modérée et maintenez, sans bloquer la respiration ni décoller le bassin. Même dans la forme abdominale, les adducteurs se travaillent en parallèle : les deux chaînes se répondent au niveau du pubis." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez le gainage et le renforcement abdominal sans douleur ni réveil le lendemain.", exercises: [
                            { name: "Gainage abdominal progressif (planche modifiée)", dose: "3 × 30 sec", tip: "Sur les genoux puis sur les pieds selon la tolérance, en augmentant la durée d'une séance à l'autre, sans douleur inguinale." },
                            { name: "Renforcement des obliques", dose: "3 × 12", tip: "Allongé sur le dos ou sur le côté, contractez les muscles latéraux du ventre avec une légère rotation ou inclinaison du buste, sans bloquer la respiration. Arrêtez en cas de douleur à l'aine." },
                            { name: "Renforcement des adducteurs à l'élastique", dose: "3 × 15", tip: "Debout, élastique fixé sur le côté à hauteur de cheville et attaché à la cheville la plus éloignée. Ramenez la jambe vers l'intérieur en croisant légèrement devant l'autre, lentement, puis laissez-la revenir en freinant. Résistance légère au départ, augmentée progressivement." },
                            { name: "Renforcement du transverse abdominal", dose: "3 × 15", tip: "Allongé sur le dos, genoux pliés. Rentrez doucement le nombril comme pour resserrer une ceinture, sans bloquer la respiration ni contracter les fessiers. Maintenez quelques secondes puis relâchez." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous coordonnez abdominaux et adducteurs sur les exercices dynamiques sans douleur, et le bassin reste stable en course.", exercises: [
                            { name: "Gainage dynamique multidirectionnel", dose: "3 × 10", tip: "Enchaînez gainage de face en appui sur les avant-bras, puis gainage sur le côté droit, puis sur le côté gauche. Dans chaque position, ajoutez un léger mouvement de bras ou de jambe en gardant le bassin parfaitement immobile." },
                            { name: "Stabilité en fente contrôlée", dose: "3 × 10", tip: "Fente avant lente, genou aligné avec le pied, bassin stable et bien face à l'avant, sans rotation du tronc." },
                            { name: "Coordination abdomino-adducteurs en charge", dose: "3 × 10", tip: "Allongé sur le dos, ballon entre les genoux. Rentrez le nombril tout en pressant le ballon : ventre et adducteurs travaillent ensemble, exactement comme ils s'opposent au niveau du pubis dans le geste sportif." },
                            { name: "Gainage avec mouvement de jambe", dose: "3 × 10", tip: "En planche, levez alternativement une jambe tendue sans que le bassin ne bouge. Reproduit la contrainte de dissociation entre tronc et membres inférieurs propre à la course." }
                        ] },
                    { label: "Retour au sport", critere: "Vous sprintez, changez de direction et frappez sans douleur ni appréhension, et l'effort abdominal ou la toux ne réveillent plus rien.", exercises: [
                            { name: "Changements de direction progressifs", dose: "4 × 15 m", tip: "Vitesse croissante, appuis stables, en surveillant la douleur du lendemain." },
                            { name: "Frappes et appuis dynamiques", dose: "3 × 10", tip: "Reprise du geste sportif spécifique, à intensité progressive." },
                            { name: "Sprint et duels simulés", dose: "1 séance encadrée", tip: "Le sprint est particulièrement provocant sur cette pathologie : réintroduisez-le après les changements de direction, jamais en premier." },
                            { name: "Maintien du renforcement combiné", dose: "2 × par semaine", tip: "Poursuivez le travail associant tronc et adducteurs sur le long terme : c'est l'équilibre entre ces deux chaînes qui protège le pubis durablement." }
                        ] }
                ] }
        ] },
    { id: "cheville", label: "Cheville", injuries: [
            { id: "entorse-lat", label: "Entorse latérale", groupe: "La cheville elle-même", desc: "Cheville qui a tourné vers l'intérieur, gonflement rapide sur le côté externe, difficulté à poser le pied.", context: "L'entorse latérale est la blessure la plus fréquente en sport, et aussi la plus souvent mal rééduquée : jusqu'à un tiers des personnes gardent des symptômes ou refont une entorse dans l'année. Deux points font la différence sur ce risque de récidive : une mise en charge précoce plutôt qu'une immobilisation prolongée, et surtout un travail de proprioception poursuivi plusieurs semaines après la disparition de la douleur.", stages: [
                    { label: "Mobilité & œdème", critere: "Vous marchez sans boiter et sans appui, le gonflement a nettement diminué, et en fléchissant le genou vers l'avant, celui-ci avance au-dessus des orteils presque aussi loin que du côté sain.", exercises: [
                            { name: "Pompes de cheville", dose: "3 × 20", tip: "Allongé ou assis, jambe surélevée au-dessus du niveau du cœur si possible. Montez et descendez la pointe du pied de façon répétée et rythmée : la contraction du mollet agit comme une pompe et aide à évacuer le gonflement." },
                            { name: "Mobilité en flexion dorsale", dose: "3 × 15", tip: "Debout face à un mur, pied concerné en avant, avancez le genou vers le mur en gardant le talon collé au sol, puis revenez. Récupérer cette amplitude est prioritaire : un déficit persistant modifie la marche et favorise la récidive." },
                            { name: "Alphabet avec le pied", dose: "2 × l'alphabet", tip: "Assis ou allongé, jambe surélevée. Dessinez lentement les lettres de l'alphabet avec le gros orteil : cela mobilise la cheville dans toutes les directions sans mise en charge." },
                            { name: "Marche avec appui selon tolérance", dose: "quotidien", tip: "Reposez le pied et marchez dès que la douleur le permet, en vous aidant de cannes si besoin. La mise en charge précoce donne de meilleurs résultats qu'une immobilisation prolongée, qui enraidit la cheville et retarde la récupération." }
                        ] },
                    { label: "Renforcement", critere: "Vous montez sur la pointe d'un seul pied 15 fois de suite du côté blessé, et pousser le pied vers l'extérieur contre une résistance ne réveille plus la douleur.", exercises: [
                            { name: "Renforcement à l'élastique 4 directions", dose: "3 × 15", tip: "Assis, élastique autour de l'avant-pied fixé à un point stable. Travaillez successivement les 4 directions : pointe vers le bas, pointe vers vous, pied vers l'intérieur, pied vers l'extérieur. Mouvement lent et contrôlé." },
                            { name: "Renforcement des éverseurs", dose: "3 × 15", tip: "Élastique fixé du côté interne, poussez le pied vers l'extérieur contre la résistance. Ce sont ces muscles qui freinent le mouvement de torsion vers l'intérieur : ils sont la protection active la plus directe contre une nouvelle entorse." },
                            { name: "Mollets contre résistance légère", dose: "3 × 15", tip: "Debout, en appui si besoin, montez sur la pointe des pieds lentement puis redescendez sans à-coup. Passez sur une seule jambe dès que c'est bien toléré." },
                            { name: "Renforcement des muscles intrinsèques du pied", dose: "3 × 15", tip: "Pied à plat au sol, creusez la voûte plantaire en rapprochant la base des orteils du talon, sans les recroqueviller. Un pied plus fort contribue à la stabilité de l'ensemble." }
                        ] },
                    { label: "Proprioception", critere: "Vous tenez 30 secondes en équilibre sur la jambe blessée sans poser l'autre pied, et vous sautillez sur ce seul pied sans douleur — c'est le repère d'entrée pour reprendre la course.", exercises: [
                            { name: "Équilibre unipodal (sol stable)", dose: "3 × 30 sec", tip: "Debout sur la jambe concernée, l'autre légèrement fléchie, à proximité d'un appui. Yeux ouverts d'abord, puis fermés une fois stable. C'est l'exercice dont l'effet sur la réduction du risque de récidive est le mieux documenté." },
                            { name: "Plateau proprioceptif ou coussin instable", dose: "3 × 45 sec", tip: "Genou légèrement fléchi, regard droit devant, sur une surface instable. Cherchez à limiter les oscillations plutôt qu'à tenir coûte que coûte." },
                            { name: "Perturbations externes légères", dose: "3 × 10", tip: "En équilibre sur une jambe, faites-vous pousser légèrement et de façon imprévisible sur les épaules, ou rattrapez une balle. Reproduit les déséquilibres imprévus qui provoquent les entorses en situation réelle." },
                            { name: "Sauts contrôlés courts", dose: "3 × 8", tip: "Petits sauts avec réception stable et silencieuse, genou fléchi et aligné avec le pied. Progressez seulement si l'équilibre statique est déjà bien maîtrisé." }
                        ] },
                    { label: "Retour au sport", critere: "Vous sautez sur une jambe aussi loin du côté blessé que du côté sain, à moins de 10 % près, et vous enchaînez sauts latéraux et changements de direction sans appréhension ni sensation d'instabilité. Aucun seuil chiffré ne fait consensus pour la cheville : ces repères éclairent la décision, ils ne la remplacent pas.", exercises: [
                            { name: "Sauts multidirectionnels", dose: "3 × 10", tip: "Avant-arrière puis latéraux, en contrôlant la réception à chaque saut. Le contrôle prime sur la hauteur ou la distance." },
                            { name: "Changements de direction", dose: "4 × 15 m", tip: "Pivot franc puis relance, vitesse progressive d'une série à l'autre, en restant sur terrain stable au départ." },
                            { name: "Course avec pivots sur terrain irrégulier", dose: "3 × 30 m", tip: "Réintroduit les conditions qui provoquent habituellement l'entorse. À placer en dernier, une fois les appuis sur sol stable bien maîtrisés." },
                            { name: "Maintien de la proprioception d'entretien", dose: "2 × par semaine", tip: "Poursuivez l'équilibre unipodal plusieurs semaines après la reprise : c'est l'arrêt précoce de ce travail qui explique une grande partie des récidives, souvent survenues alors que la douleur avait disparu." }
                        ] }
                ] },
            { id: "instabilite-cheville", label: "Instabilité chronique de cheville", groupe: "La cheville elle-même", desc: "Sensation répétée de « dérobement » ou de cheville qui « lâche », souvent après une ou plusieurs entorses mal rééduquées, parfois sans douleur marquée entre les épisodes.", context: "L'instabilité chronique associe presque toujours deux composantes : une laxité mécanique du ligament, et surtout un déficit de contrôle nerveux et musculaire — c'est cette seconde composante qui répond le mieux à la rééducation. Le travail proprioceptif est l'intervention dont l'effet sur la réduction des récidives est le mieux démontré, et il doit être poursuivi plusieurs semaines après la disparition des symptômes.", stages: [
                    { label: "Mobilité & activation", critere: "La cheville bouge librement et vous marchez sans appréhension sur terrain plat.", exercises: [
                            { name: "Mobilité en flexion dorsale", dose: "3 × 15", tip: "Genou vers l'avant, talon au sol, mobilisez la cheville sur l'amplitude confortable. Un déficit de flexion dorsale est fréquent après des entorses répétées." },
                            { name: "Isométrique 4 directions", dose: "5 × 10 sec chaque direction", tip: "Assis, poussez le pied contre une résistance fixe (mur, main) dans les 4 directions (flexion, extension, inversion, éversion), sans bouger la cheville." },
                            { name: "Automassage et mobilisation des péroniers", dose: "2 × 1 min", tip: "Massage doux le long du bord externe de la jambe, du genou vers la cheville, pour entretenir la mobilité des tissus fréquemment sollicités après une entorse." },
                            { name: "Alphabet avec le pied", dose: "2 × l'alphabet", tip: "Assis ou allongé, dessinez les lettres de l'alphabet avec le gros orteil, pour mobiliser la cheville dans toutes les directions." }
                        ] },
                    { label: "Renforcement", critere: "Vous montez sur la pointe d'un seul pied 15 fois de suite, et pousser le pied vers l'extérieur contre résistance est fort et indolore.", exercises: [
                            { name: "Renforcement à l'élastique 4 directions", dose: "4 × 15", tip: "Flexion, extension, inversion, éversion contre résistance élastique. Base du renforcement après entorse à répétition, en particulier les éverseurs (péroniers), souvent déficitaires." },
                            { name: "Renforcement des éverseurs en charge", dose: "3 × 15 chaque côté", tip: "Debout, élastique autour de l'avant-pied fixé du côté interne. Poussez le pied vers l'extérieur contre la résistance : ce sont ces muscles qui limitent le risque de retourner la cheville vers l'intérieur." },
                            { name: "Renforcement du mollet", dose: "3 × 15", tip: "Debout, mains en appui léger sur un mur. Montez sur la pointe des deux pieds en 2 secondes, marquez un temps en haut, puis redescendez en 3 secondes. Passez sur une seule jambe quand la version à deux pieds devient facile." },
                            { name: "Renforcement des intrinsèques du pied", dose: "3 × 15", tip: "Assis puis debout, pied à plat au sol. Rapprochez la base du gros orteil du talon pour creuser la voûte, sans recroqueviller les orteils ni décoller le talon. Tenez quelques secondes, relâchez. Un pied plus fort contribue à la stabilité globale de la cheville." }
                        ] },
                    { label: "Proprioception", critere: "Vous tenez 30 secondes en équilibre sur la jambe concernée sans poser l'autre pied, y compris sur un coussin instable sans vous rattraper.", exercises: [
                            { name: "Équilibre unipodal yeux ouverts puis fermés", dose: "4 × 30 sec chaque côté", tip: "Debout sur la jambe instable, à proximité d'un appui. C'est l'exercice le mieux documenté pour réduire le risque de récidive après entorse." },
                            { name: "Plateau proprioceptif ou coussin instable", dose: "4 × 45 sec chaque côté", tip: "Debout sur un plateau ou un coussin, genou légèrement fléchi, regard fixé droit devant. Cherchez à limiter les oscillations plutôt qu'à tenir à tout prix, avec un appui à portée de main." },
                            { name: "Perturbations externes légères", dose: "3 × 10", tip: "En équilibre unipodal, un proche vous pousse légèrement et de façon imprévisible sur les épaules ou lance une balle à rattraper : reproduit les situations qui provoquent le dérobement en pratique." },
                            { name: "Sauts contrôlés avec réception stable", dose: "3 × 8 chaque côté", tip: "Petit saut, réception sur une jambe, stabilisation immédiate sans dérobement. Progressez seulement si l'équilibre statique est bien maîtrisé." }
                        ] },
                    { label: "Retour au sport", critere: "Vous enchaînez sauts latéraux et changements de direction sur terrain irrégulier sans que la cheville se dérobe ni que l'appréhension revienne. Le travail de proprioception se poursuit ensuite durablement : c'est son arrêt précoce qui explique une bonne part des récidives.", exercises: [
                            { name: "Sauts multidirectionnels", dose: "4 × 10", tip: "Sauts enchaînés vers l'avant puis l'arrière, puis d'un côté à l'autre. Marquez un temps d'arrêt stable à chaque réception avant d'enchaîner." },
                            { name: "Changements de direction", dose: "4 × 15 m", tip: "Course, arrêt, pivot franc puis relance. Montez la vitesse d'une série à l'autre, et passez du sol régulier au terrain irrégulier seulement quand les appuis sont sûrs." },
                            { name: "Course avec pivots sur terrain irrégulier", dose: "3 × 30 m", tip: "Course avec changements de direction sur herbe, sentier ou sol irrégulier. Ce sont les conditions qui provoquent habituellement le dérobement : elles se réintroduisent en dernier, et progressivement." },
                            { name: "Test fonctionnel de confiance", dose: "bilan", tip: "Un ressenti de stabilité franche sur les gestes de pivot et de réception, sans appréhension, est un repère utile avant la reprise complète du sport." }
                        ] }
                ] },
            { id: "achille", label: "Tendinopathie du corps du tendon", groupe: "Le tendon d'Achille", desc: "Douleur et raideur du tendon lui-même, 2 à 6 cm au-dessus du talon, maximales aux premiers pas du matin ; la zone douloureuse se déplace quand vous bougez la cheville.", context: "Le tendon d'Achille répond au renforcement progressif, pas au repos : l'arrêt complet le fragilise. Les protocoles de renforcement excentrique et de renforcement lourd et lent donnent des résultats comparables et nettement supérieurs à l'abstention. Comptez 6 à 12 semaines avant des résultats nets — la patience fait partie du traitement. La raideur des premiers pas du matin est le meilleur indicateur de suivi au quotidien.", stages: [
                    { label: "Douleur & charge", critere: "Vous tenez les 5 × 45 secondes d'isométrie sans que la douleur dépasse 3/10, et la raideur des premiers pas du matin ne s'aggrave pas d'un jour sur l'autre.", exercises: [
                            { name: "Isométrique du mollet en charge", dose: "5 × 45 sec", tip: "Debout sur une marche, montez à mi-hauteur sur la pointe et maintenez la position. Maintien long volontairement : c'est la durée qui produit l'effet antalgique recherché sur un tendon irrité, souvent perceptible dès les premières séances." },
                            { name: "Isométrique genou fléchi (soléaire)", dose: "5 × 30 sec", tip: "Debout, avant-pied sur une marche, talon dans le vide, genou fléchi à environ 30° et maintenu fléchi tout du long. Montez sur la pointe et tenez sans bouger. La flexion du genou déplace le travail sur le soléaire, le muscle profond du mollet — très sollicité à la course et souvent négligé dans la rééducation." },
                            { name: "Mobilité de cheville douce", dose: "3 × 15", tip: "Assis, mobilisez la cheville en flexion-extension sur l'amplitude confortable, sans mise en tension forte du tendon à ce stade." },
                            { name: "Suivi de la raideur matinale", dose: "chaque matin", tip: "Notez la raideur des premiers pas au réveil. C'est le marqueur le plus fiable de la tolérance à la charge de la veille : en hausse, réduisez ; stable ou en baisse, poursuivez." }
                        ] },
                    { label: "Renforcement excentrique", critere: "Vous enchaînez les 3 × 15 en excentrique sans dépasser 3/10, la douleur est redescendue sous 3/10 le lendemain matin, et vous montez sur la pointe d'un seul pied 20 fois de suite sans à-coup.", exercises: [
                            { name: "Montée-descente sur step (excentrique)", dose: "3 × 15", tip: "À réaliser deux fois par jour, et à poursuivre environ 12 semaines : c'est cette régularité, plus que l'intensité d'une séance, qui fait céder la douleur. Montez sur les deux pieds, puis descendez lentement sur un seul, talon sous le niveau de la marche. C'est la descente freinée qui constitue le cœur du protocole, pas la montée." },
                            { name: "Montée sur pointe lente et lestée", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout sur une marche, avant-pied en appui. Montez en 3 secondes, descendez en 3 secondes, avec du poids (sac à dos chargé) pour que la 8e répétition soit difficile. Alternative au protocole excentrique, d'efficacité comparable." },
                            { name: "Renforcement mollet genou fléchi", dose: "3 × 15", tip: "Debout, appui léger des mains sur un mur, genou fléchi à environ 30° et maintenu fléchi tout du long. Montez sur la pointe du pied lentement, puis redescendez en 3 secondes. Genou tendu et genou fléchi sollicitent deux muscles différents : les deux variantes sont nécessaires." },
                            { name: "Renforcement de la chaîne postérieure", dose: "3 × 12", tip: "Hanche en charnière : debout, jambes presque tendues, poussez les fesses vers l'arrière en penchant le buste, dos neutre, puis redressez-vous. Un déficit de force des fessiers et ischio-jambiers augmente la charge reportée sur le mollet." }
                        ] },
                    { label: "Charge dynamique", critere: "Vous faites 3 × 15 sautillements sur une seule jambe sans que la douleur dépasse 3/10 ni qu'elle augmente le lendemain, et la raideur du matin a disparu ou ne dure que quelques instants.", exercises: [
                            { name: "Sautillements légers sur place", dose: "3 × 20", tip: "Petits rebonds sur l'avant-pied, contact au sol le plus bref possible, sans écraser le talon. Réintroduit la fonction élastique du tendon, indispensable avant toute reprise de course." },
                            { name: "Sautillements unipodaux", dose: "3 × 15", tip: "Debout sur une jambe, appui léger d'une main si besoin, poids sur l'avant-pied. Petits rebonds sur place, amplitude réduite, contact au sol bref et silencieux. À n'introduire que si la version sur deux pieds passe sans réveil de la douleur le lendemain." },
                            { name: "Marche rapide en côte", dose: "10 min", tip: "Sollicite le tendon en amplitude, à intensité modérée. Surveillez la raideur du lendemain matin plutôt que la sensation pendant l'effort." },
                            { name: "Équilibre unipodal dynamique", dose: "3 × 30 sec", tip: "Debout sur une jambe, ajoutez un léger mouvement de bras ou de tête une fois la position stable maîtrisée." }
                        ] },
                    { label: "Retour au sport", critere: "Vous montez sur la pointe autant de fois du côté blessé que du côté sain, à deux ou trois répétitions près, vous courez sans douleur pendant et le lendemain, et cela tient depuis deux à trois semaines. La reprise complète se décide avec votre kinésithérapeute.", exercises: [
                            { name: "Course progressive fractionnée", dose: "selon plan", tip: "Alternance marche/course d'abord, puis course continue, en augmentant d'environ 10 % de volume par semaine. Terrain plat et souple au départ." },
                            { name: "Pliométrie spécifique", dose: "3 × 10", tip: "Rebonds courts et réactifs, en cherchant un temps de contact au sol minimal. Le tendon doit retrouver sa capacité à restituer l'énergie." },
                            { name: "Sprints et changements de direction", dose: "4 × 20 m", tip: "Intensité progressive, à réintroduire après la course continue. Les côtes et le travail de vitesse sont les contraintes les plus fortes : gardez-les pour la fin." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 à 3 × par semaine", tip: "Poursuivez la montée sur pointe lestée plusieurs mois après la reprise. L'arrêt du renforcement dès la disparition de la douleur est la cause la plus fréquente de rechute." }
                        ] }
                ] },
            { id: "achille-insertion", label: "Enthésopathie d'Achille (insertion)", groupe: "Le tendon d'Achille", desc: "Douleur juste au contact de l'os du talon, là où le tendon s'attache, souvent aggravée par les chaussures montantes.", context: "À cet endroit, le tendon s'enroule sur l'os du talon : toute position où le pied remonte vers le tibia le comprime contre l'os. C'est la raison pour laquelle le protocole classique — laisser descendre le talon dans le vide sur une marche — peut entretenir le problème ici, alors qu'il fonctionne bien sur le corps du tendon. Le travail se fait donc sans jamais descendre le talon sous l'horizontale, les étirements du mollet sont mis de côté au profit du massage, et une talonnette de 5 à 10 mm limite la contrainte à la marche. Comptez plusieurs mois. Une bosse osseuse à l'arrière du talon ou une bursite associée peut justifier un avis complémentaire.", stages: [
                    { label: "Décharge & isométrie", critere: "Les premiers pas du matin sont moins raides qu'au début, et la marche courte avec talonnette ne réveille plus la douleur vive au contact de l'os.", exercises: [
                            { name: "Isométrique du mollet, talon au sol", dose: "5 × 45 sec", tip: "Debout, pieds à plat, montez très légèrement sur la pointe et tenez sans jamais laisser le talon descendre sous l'horizontale. À cette localisation, c'est la remontée du pied vers le tibia qui comprime le tendon contre l'os : on ne va jamais la chercher." },
                            { name: "Talonnette et adaptation du chaussage", dose: "quotidien", tip: "Placez une talonnette de 5 à 10 mm dans vos deux chaussures, et laissez de côté les modèles à contrefort rigide qui appuient sur la zone douloureuse. C'est une mesure de décompression temporaire, qui se retire ensuite par paliers." },
                            { name: "Massage du mollet", dose: "2 × 2 min", tip: "Massez le corps du mollet et le tendon sans étirer. Ici l'étirement du mollet comprime le tendon contre l'os au lieu de le soulager : il est volontairement remplacé par le massage." },
                            { name: "Suivi de la raideur matinale", dose: "chaque matin", tip: "Notez combien de temps dure la raideur aux premiers pas. C'est le meilleur indicateur de suivi au quotidien : c'est sa diminution d'une semaine sur l'autre qui dit que la charge est juste." }
                        ] },
                    { label: "Renforcement en amplitude limitée", critere: "Vous tenez les 4 × 8 lestés au sol sans que la douleur dépasse 3/10 ni qu'elle augmente le lendemain matin, et cela depuis trois à quatre semaines au moins.", exercises: [
                            { name: "Montée sur pointe au sol, lente et lestée", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout au sol, montez sur la pointe en 3 secondes et redescendez en 3 secondes jusqu'au sol, sans jamais laisser le talon aller plus bas. Charge suffisante pour que la 8e répétition soit difficile." },
                            { name: "Montée sur pointe genou fléchi", dose: "4 × 8", tip: "Même mouvement, genou fléchi à environ 30° pour solliciter le soléaire. Toujours sans descendre le talon sous le niveau du sol." },
                            { name: "Excentrique unipodal jusqu'au sol", dose: "3 × 12", tip: "Montez sur la pointe avec les deux pieds, puis redescendez lentement sur le seul pied douloureux en vous arrêtant dès que le talon touche le sol. C'est la version modifiée du protocole classique : la descente s'arrête au sol, elle ne va pas dans le vide." },
                            { name: "Renforcement de la chaîne postérieure", dose: "3 × 12", tip: "Pont fessier et hanche en charnière. Un déficit en amont reporte de la charge sur le tendon à chaque appui." }
                        ] },
                    { label: "Charge dynamique sans compression", critere: "Vous sautillez et montez les marches sans réveil de la douleur le lendemain, et vous avez réduit la talonnette d'au moins la moitié sans que la raideur matinale remonte.", exercises: [
                            { name: "Sautillements sur l'avant du pied", dose: "3 × 20", tip: "Sautillements courts en restant sur l'avant du pied, sans laisser le talon s'écraser au sol. Faible amplitude, rythme régulier." },
                            { name: "Montées de marche en poussée", dose: "3 × 12", tip: "Montez sur une marche en poussant sur l'avant du pied. On travaille la poussée, pas la descente du talon dans le vide." },
                            { name: "Marche rapide en terrain plat", dose: "15 min", tip: "Terrain plat de préférence : la montée oblige le pied à remonter vers le tibia et comprime l'insertion. Les côtes viendront plus tard." },
                            { name: "Réduction progressive de la talonnette", dose: "chaque semaine", tip: "Diminuez l'épaisseur par paliers en surveillant la raideur du matin. Si elle remonte, revenez au palier précédent une semaine de plus." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous avez repris course ou marche longue sans talonnette, côtes et escaliers compris, sans que la raideur matinale remonte. Comptez plusieurs mois : à cette localisation, la patience fait partie du traitement.", exercises: [
                            { name: "Reprise progressive de la course ou de la marche longue", dose: "selon plan", tip: "Augmentez d'environ 10 % par semaine, en terrain plat d'abord, et un seul paramètre à la fois." },
                            { name: "Réintroduction des côtes et des escaliers", dose: "à partir de la semaine 10", tip: "Ce sont les situations où le pied remonte le plus vers le tibia, donc celles qui compriment le plus l'insertion : elles reviennent en dernier et progressivement." },
                            { name: "Maintien du renforcement lourd et lent", dose: "2 à 3 × par semaine", tip: "À poursuivre plusieurs mois après la disparition de la douleur : c'est l'arrêt précoce qui explique une bonne part des récidives." },
                            { name: "Suivi de la raideur après les sorties", dose: "chaque matin", tip: "Elle reste le juge : si elle remonte après une sortie, la charge était trop forte." }
                        ] }
                ] },
            { id: "achille-paratenonite", label: "Paraténonite d'Achille", groupe: "Le tendon d'Achille", desc: "Gonflement et sensation de craquement autour du tendon, avec une zone douloureuse qui ne se déplace pas quand vous bougez la cheville.", context: "Ici c'est la gaine qui entoure le tendon qui est irritée, et non le tendon lui-même. Un repère simple permet de faire la différence : bougez la cheville de haut en bas en observant la zone gonflée ou douloureuse. Si elle se déplace avec le tendon, c'est le tendon ; si elle reste au même endroit, c'est la gaine. La prise en charge est moins codifiée que pour le corps du tendon, et les avis divergent davantage : on commence par réduire les frottements — volume d'entraînement, surfaces, chaussage — avant de reprendre la charge progressivement. L'évolution est souvent plus rapide que celle d'une tendinopathie du tendon lui-même. Une rougeur, une chaleur marquée ou de la fièvre justifient un avis médical avant tout exercice.", stages: [
                    { label: "Réduction des frottements", critere: "Le gonflement et la sensation de craquement ont nettement diminué, et la marche quotidienne ne les réveille plus.", exercises: [
                            { name: "Réduction du volume et changement de surface", dose: "quotidien", tip: "Réduisez franchement le kilométrage et privilégiez les surfaces souples. C'est la répétition du frottement qui entretient l'irritation, davantage que l'intensité de chaque séance." },
                            { name: "Adaptation du chaussage", dose: "quotidien", tip: "Laissez de côté les chaussures dont le contrefort frotte sur la zone, et vérifiez que le laçage ne comprime pas l'arrière de la cheville." },
                            { name: "Isométrique du mollet", dose: "5 × 30 sec", tip: "Debout en appui léger, montez sur la pointe et tenez la position sans bouger. Le maintien entretient la force sans imposer de mouvement répété à la gaine." },
                            { name: "Mobilité douce de cheville", dose: "3 × 15", tip: "Montez et descendez la pointe du pied lentement, sans forcer en fin d'amplitude, pour entretenir la mobilité sans provoquer de frottement." }
                        ] },
                    { label: "Reprise de charge progressive", critere: "Vous tenez le renforcement des deux côtés sans réapparition du gonflement le lendemain.", exercises: [
                            { name: "Montée sur pointe bipodale", dose: "3 × 15", tip: "Debout, montez sur la pointe des deux pieds et redescendez lentement. Mouvement contrôlé, sans à-coup." },
                            { name: "Montée sur pointe genou fléchi", dose: "3 × 15", tip: "Même mouvement genou fléchi à 30°, pour solliciter le soléaire." },
                            { name: "Renforcement de la chaîne postérieure", dose: "3 × 12", tip: "Pont fessier et hanche en charnière, pour répartir la charge en amont de la cheville." },
                            { name: "Suivi du gonflement", dose: "chaque soir", tip: "Comparez l'arrière des deux chevilles en fin de journée. La réapparition du gonflement est ici le signal d'alerte, avant même la douleur." }
                        ] },
                    { label: "Charge dynamique", critere: "Vous trottinez 15 minutes sans réapparition du gonflement ni du craquement le lendemain, et la montée sur pointe sur un seul pied est indolore.", exercises: [
                            { name: "Montée sur pointe unipodale", dose: "3 × 15", tip: "Sur un seul pied, en appui léger si besoin. Montez et redescendez lentement, sans à-coup." },
                            { name: "Sautillements légers", dose: "3 × 20", tip: "Sautillements courts sur place, chevilles souples, en restant sur l'avant du pied." },
                            { name: "Marche rapide puis trottinement", dose: "15 min", tip: "Alternez marche rapide et trottinement léger sur surface souple, en augmentant la part de course d'une séance à l'autre." },
                            { name: "Renforcement lourd et lent", dose: "4 × 8", tip: "Montée sur pointe lestée, 3 secondes à la montée et 3 à la descente, la 8e répétition difficile. La gaine calmée, le tendon a besoin d'être chargé." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous avez retrouvé votre volume habituel sans réapparition du gonflement, et changer de surface ou de chaussures ne le déclenche plus. Si le gonflement revient dès que le volume augmente, c'est le volume qu'il faut ajuster, pas le renforcement.", exercises: [
                            { name: "Reprise progressive de la course", dose: "selon plan", tip: "Augmentez d'environ 10 % par semaine, en surveillant le gonflement du soir plutôt que la douleur du moment." },
                            { name: "Progression des surfaces", dose: "selon plan", tip: "Souple d'abord, puis dur, puis irrégulier. Un seul changement à la fois." },
                            { name: "Maintien du renforcement", dose: "2 × par semaine", tip: "À poursuivre plusieurs semaines après la disparition des symptômes." },
                            { name: "Surveillance des reprises de volume", dose: "chaque semaine", tip: "Notez votre kilométrage. Cette atteinte étant liée au frottement répété, c'est la quantité qui la fait revenir." }
                        ] }
                ] }
        ] },
    { id: "pied", label: "Pied", injuries: [
            { id: "morton", label: "Névrome de Morton", groupe: "Douleur de l'avant-pied", desc: "Douleur à type de décharge électrique ou de brûlure entre les orteils (souvent 3e et 4e), parfois une sensation de « caillou dans la chaussure », aggravée par les chaussures étroites ou à talon.", context: "Malgré son nom, ce n'est pas une tumeur mais un épaississement du tissu autour d'un nerf, irrité par la compression entre les têtes des métatarsiens. Le facteur mécanique dominant est le chaussage : un bout étroit ou un talon haut resserre l'avant-pied et entretient directement la compression. C'est pourquoi l'adaptation des chaussures est ici au moins aussi déterminante que les exercices.", stages: [
                    { label: "Décharge & mobilité", critere: "Le changement de chaussage et la décharge de l'avant-pied ont fait disparaître la sensation de brûlure ou de caillou sous les orteils à la marche courte.", exercises: [
                            { name: "Adaptation temporaire du chaussage", dose: "quotidien", tip: "Privilégiez des chaussures à bout large et talon bas le temps de la phase douloureuse : la compression latérale de l'avant-pied est le principal facteur d'irritation du nerf." },
                            { name: "Mobilisation douce des orteils", dose: "3 × 10", tip: "Assis, écartez et mobilisez doucement les orteils à la main, dans toutes les directions, sans forcer sur la zone douloureuse." },
                            { name: "Automassage de la voûte plantaire", dose: "2 × 1 min", tip: "Faites rouler une balle ferme sous la voûte plantaire, pression modérée, en évitant d'appuyer directement sur la zone la plus sensible entre les orteils." },
                            { name: "Isométrique des muscles intrinsèques du pied", dose: "5 × 10 sec", tip: "Assis, pied à plat, creusez doucement la voûte plantaire en rapprochant la base des orteils du talon, sans les recroqueviller." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices des muscles du pied sans réveiller la douleur entre les orteils.", exercises: [
                            { name: "Renforcement des intrinsèques (short foot)", dose: "3 × 15", tip: "Debout ou assis, pied à plat, essayez de raccourcir le pied en rapprochant l'avant-pied du talon sans crisper les orteils. Un pied plus fort répartit mieux les charges sur l'avant-pied." },
                            { name: "Écartement actif des orteils", dose: "3 × 12", tip: "Assis, essayez d'écarter activement les orteils les uns des autres, puis relâchez. Renforce le contrôle de l'avant-pied et peut réduire la compression inter-métatarsienne." },
                            { name: "Renforcement du mollet", dose: "3 × 15", tip: "Debout, montée sur la pointe des pieds, lente et contrôlée. Un mollet plus fort réduit le temps d'appui prolongé sur l'avant-pied à la marche." },
                            { name: "Mobilité de cheville", dose: "3 × 15", tip: "Assis, mobilisez la cheville en flexion-extension sur l'amplitude confortable : une cheville raide augmente la charge transmise à l'avant-pied." }
                        ] },
                    { label: "Charge fonctionnelle", critere: "Vous marchez longuement en chaussures adaptées sans réapparition de la brûlure.", exercises: [
                            { name: "Marche progressive avec chaussage adapté", dose: "15 min", tip: "Augmentez progressivement la durée de marche, en restant sous le seuil de la douleur à type de décharge." },
                            { name: "Équilibre unipodal", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, à proximité d'un appui si besoin. Sollicite le contrôle de l'avant-pied en charge." },
                            { name: "Montée sur pointe unipodale", dose: "3 × 10 chaque côté", tip: "Debout sur une jambe, montée lente sur la pointe du pied. Vérifiez que la douleur ne réapparaît pas à l'appui sur l'avant-pied." },
                            { name: "Marche sur terrain varié", dose: "10 min", tip: "Réintroduisez prudemment des surfaces irrégulières, qui sollicitent différemment l'avant-pied qu'une surface plane et dure." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez vos activités debout et votre chaussage habituel sans réveil des symptômes. Si la sensation revient dès que vous quittez les chaussures larges, c'est à réévaluer plutôt qu'à supporter.", exercises: [
                            { name: "Reprise progressive de l'activité debout prolongée", dose: "selon tolérance", tip: "Augmentez progressivement le temps passé debout ou en marche, en surveillant la réapparition de la sensation de décharge électrique." },
                            { name: "Maintien du renforcement des intrinsèques", dose: "2 à 3 × par semaine", tip: "Ce renforcement se poursuit sur le long terme, en particulier si le chaussage habituel reste contraignant pour l'avant-pied." },
                            { name: "Choix durable du chaussage", dose: "quotidien", tip: "Un bout large et un talon modéré restent recommandés au long cours, y compris une fois les symptômes calmés, pour limiter la récidive." },
                            { name: "Validation fonctionnelle", dose: "bilan", tip: "Une marche prolongée et une montée sur pointe sans décharge électrique sont de bons repères avant de reprendre une activité complète." }
                        ] }
                ] },
            { id: "fasciite-pied", label: "Fasciite plantaire", groupe: "Douleur du talon", desc: "Douleur sous le talon ou le long de la voûte plantaire, très vive aux premiers pas du matin ou après être resté assis, puis atténuée en marchant avant de revenir en fin de journée.", context: "L'appellation en « -ite » est trompeuse : il s'agit d'une dégénérescence du fascia plantaire, pas d'une inflammation, ce qui explique que le repos et les anti-inflammatoires seuls soulagent sans régler le fond. Le renforcement en charge lente avec l'avant-pied surélevé a montré de meilleurs résultats à moyen terme que les seuls étirements. Les facteurs favorisants les plus fréquents sont la station debout prolongée, une augmentation rapide d'activité, un chaussage trop plat et un manque de souplesse du mollet. La douleur des premiers pas du matin reste le repère de suivi le plus utile — et l'évolution demande souvent plusieurs mois. Un repère pour ne pas se tromper de problème : si la douleur siège au centre du talon plutôt que sur son bord interne, qu'elle est pire pieds nus sur sol dur et qu'elle ne donne pas cette douleur vive des premiers pas du matin, il s'agit probablement du coussinet adipeux, dont le parcours est distinct — les étirements y sont inutiles, voire gênants.", stages: [
                    { label: "Douleur & décharge", critere: "Les premiers pas du matin restent douloureux mais moins longtemps qu'au début, et la marche courte ne provoque plus de douleur vive au talon.", exercises: [
                            { name: "Étirement spécifique du fascia plantaire", dose: "3 × 10 chaque matin", tip: "Assis, jambe croisée sur l'autre genou. Attrapez les orteils et tirez-les vers vous jusqu'à sentir la tension sous le pied, maintenez quelques secondes puis relâchez. Réalisé avant même de poser le pied au sol le matin, cet étirement réduit nettement la douleur des premiers pas." },
                            { name: "Isométrique du mollet", dose: "5 × 45 sec", tip: "Debout, en appui si besoin, montez à mi-hauteur sur la pointe des pieds et maintenez. Maintien long volontairement : le mollet et le fascia plantaire forment une chaîne continue, et la tension du mollet se répercute directement sous le pied." },
                            { name: "Automassage plantaire", dose: "2 × 1 min", tip: "Faites rouler une balle ferme, ou une bouteille d'eau fraîche, sous la voûte plantaire. Pression modérée, sans chercher à écraser le point le plus douloureux sous le talon." },
                            { name: "Adaptation temporaire du chaussage et de la station debout", dose: "quotidien", tip: "Évitez la marche pieds nus sur sol dur et les chaussures totalement plates le temps de la phase douloureuse ; fractionnez les longues stations debout. Réduire la contrainte quotidienne compte autant que les exercices." }
                        ] },
                    { label: "Renforcement en charge", critere: "Vous tenez le renforcement en charge sans que la douleur dépasse 3/10 ni qu'elle augmente le lendemain.", exercises: [
                            { name: "Montée sur pointe avec orteils surélevés", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout sur une marche, une serviette roulée sous les orteils pour les maintenir relevés. Montez en 3 secondes, descendez en 3 secondes, avec du poids dans un sac à dos pour que la 8e répétition soit difficile. C'est l'exercice clé : la position des orteils met le fascia en tension pendant l'effort, ce qui le fait travailler et non seulement s'étirer." },
                            { name: "Montée sur pointe genou fléchi", dose: "4 × 8", tip: "Debout, appui léger sur un mur, genou fléchi à environ 30° et maintenu fléchi pendant tout le mouvement. Montez sur la pointe du pied puis redescendez lentement. La flexion du genou déplace le travail sur le soléaire, très sollicité lors de la marche prolongée." },
                            { name: "Renforcement des muscles intrinsèques du pied", dose: "3 × 15", tip: "Pied à plat au sol, creusez la voûte plantaire en rapprochant la base des orteils du talon, sans recroqueviller les orteils. Un pied dont la musculature propre est plus forte soulage la charge supportée par le fascia." },
                            { name: "Étirement du mollet, genou tendu puis fléchi", dose: "3 × 30 sec chaque position", tip: "Debout face à un mur, jambe arrière tendue talon au sol, puis dans un second temps genou arrière légèrement fléchi. Un manque de souplesse du mollet est l'un des facteurs favorisants les mieux identifiés." }
                        ] },
                    { label: "Charge fonctionnelle", critere: "Vous marchez longuement et montez les escaliers sans douleur au talon, et la raideur du matin ne dure plus que quelques pas.", exercises: [
                            { name: "Sautillements bipodaux", dose: "4 × 20", tip: "Rebonds souples sur l'avant-pied, réception silencieuse, voûte plantaire maintenue active. Réintroduit progressivement la contrainte élastique du fascia." },
                            { name: "Équilibre unipodal avec voûte active", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, à proximité d'un appui. Maintenez la voûte plantaire légèrement creusée pendant tout l'exercice, plutôt que de laisser le pied s'affaisser." },
                            { name: "Marche progressive", dose: "15-20 min", tip: "Augmentez la durée de marche graduellement, chaussures bien amorties, en surveillant la douleur des premiers pas du lendemain matin plutôt que la sensation du moment." },
                            { name: "Poursuite du renforcement lourd", dose: "3 × par semaine", tip: "L'exercice avec orteils surélevés reste la base du traitement pendant tout ce stade : c'est l'élément le mieux documenté sur cette pathologie." }
                        ] },
                    { label: "Retour à l'activité", critere: "La douleur des premiers pas du matin a disparu, et vous reprenez course ou station debout prolongée sans réveil le lendemain. Comme pour le tendon d'Achille, comptez plusieurs mois : la raideur matinale reste le meilleur indicateur de suivi.", exercises: [
                            { name: "Reprise de la station debout prolongée", dose: "selon tolérance", tip: "Augmentez progressivement le temps passé debout ou en marche, en particulier si votre travail l'impose, et fractionnez encore quelques semaines." },
                            { name: "Suivi de la douleur des premiers pas", dose: "chaque matin", tip: "C'est le repère le plus fiable : tant qu'elle diminue ou reste stable, la progression est bonne. Si elle augmente, revenez au palier précédent plutôt que de forcer." },
                            { name: "Maintien de l'exercice orteils surélevés", dose: "2 à 3 × par semaine", tip: "À poursuivre plusieurs mois après la disparition des symptômes : son arrêt précoce est une cause fréquente de rechute." },
                            { name: "Réintroduction progressive du sport et des sols durs", dose: "1 séance", tip: "La course, les sauts et les surfaces dures augmentent fortement la tension sur le fascia : réintroduisez-les en dernier, après la marche prolongée bien tolérée." }
                        ] }
                ] },
