                    { name: "Ouverture du haut du dos sur un rouleau", dose: "3 × 30 sec", tip: "Allongé sur le dos, un coussin roulé sous le haut du dos en travers, bras détendus sur les côtés. Respire calmement.", pourquoi: "Tu ouvres doucement la zone qui s'est arrondie, dans le sens opposé à celui où elle s'est installée." },
                    { name: "Étirement des pectoraux", dose: "3 × 30 sec", tip: "Dans l'encadrement d'une porte, avant-bras contre le montant, avance d'un pas jusqu'à sentir tirer devant l'épaule.", pourquoi: "L'avant de tes épaules s'est raccourci et te tire vers l'avant. En l'étirant, tu rends le redressement moins fatigant." },
                    { name: "Renforcement doux du haut du dos", dose: "3 × 12", tip: "Allongé sur le ventre, front au sol, décolle légèrement les bras en serrant les omoplates, puis redescends.", pourquoi: "Ce sont ces muscles qui te redressent toute la journée. Plus ils sont endurants, moins ton dos fatigue." }
                ] },
            { critere: "Tu tiens le renforcement sans que ton dos chauffe, et tu es plus souple qu'il y a un mois quand tu lèves les bras au-dessus de la tête.", exercises: [
                    { name: "Extension du haut du dos", dose: "3 × 12", tip: "Assis sur une chaise à dossier bas, mains derrière la tête, ouvre doucement la poitrine vers le plafond.", pourquoi: "Tu travailles le mouvement inverse de celui que tu fais toute la journée en cours." },
                    { name: "Renforcement du haut du dos à l'élastique", dose: "3 × 12", tip: "Élastique tenu à deux mains devant toi, écarte les bras en serrant les omoplates.", pourquoi: "Tu construis l'endurance des muscles qui te tiennent droit sans que tu y penses." },
                    { name: "Étirement de l'arrière des cuisses", dose: "3 × 30 sec", tip: "Assis, une jambe tendue, penche-toi vers le pied en gardant le dos droit.", pourquoi: "Des cuisses raides tirent sur ton bassin et arrondissent le dos quand tu t'assieds. Les assouplir aide en haut." },
                    { name: "Gainage sur les coudes", dose: "3 × 20 sec", tip: "En appui sur les avant-bras et la pointe des pieds, coudes sous les épaules. Le corps forme une ligne droite de la tête aux talons, ventre serré : ni dos creusé, ni fesses en l'air. Si tu ne tiens pas, pose les genoux au sol.", pourquoi: "Un tronc solide sert de socle : sans lui, le haut du dos travaille tout seul." }
                ] },
            { critere: "Tu tiens une position redressée sans y penser en permanence, et tu peux porter ton sac et faire du sport sans que ça tire.", exercises: [
                    { name: "Extension sur rouleau, amplitude progressive", dose: "3 × 45 sec", tip: "Allongé sur le dos, un rouleau ou une serviette roulée en travers du haut du dos, mains derrière la nuque. Laisse le buste s'ouvrir vers l'arrière, un peu plus loin chaque semaine, sans forcer et sans creuser le bas du dos.", pourquoi: "Les gains de souplesse sont lents mais durables si tu les fais souvent." },
                    { name: "Renforcement complet du dos", dose: "3 × 15", tip: "Sur le ventre, décolle bras et haut du buste ensemble, sans forcer sur la nuque.", pourquoi: "Tu passes de l'entretien à la vraie force : c'est ce qui te tiendra sans effort conscient." },
                    { name: "Travail avec charge légère", dose: "3 × 12", tip: "Tirage à l'élastique ou avec une petite charge, coudes qui filent vers l'arrière.", pourquoi: "Un dos musclé fatigue beaucoup moins vite en fin de journée." },
                    { name: "Sport porté ou en extension", dose: "2 × par semaine", tip: "Natation, en particulier le dos crawlé, ou tout sport où tu ouvres la poitrine.", pourquoi: "C'est le complément idéal : tu travailles ton dos sans t'en rendre compte et sans impact." }

                    { name: "Suivi médical régulier", dose: "selon le médecin", tip: "Continue les contrôles prévus, même si tu n'as plus mal.", pourquoi: "Tant que tu grandis, la forme de ton dos peut encore évoluer : c'est au médecin de la surveiller." }
                ] }

    {
        id: "spondylolyse",
        label: "Spondylolyse",

        desc: "Une douleur en bas du dos, souvent d'un seul côté, qui arrive quand tu te cambres en arrière, quand tu smashes, tu sautes ou tu fais des extensions.",
        context: "En bas de ta colonne, une petite partie de l'os peut s'irriter puis se fissurer quand tu répètes beaucoup de mouvements de cambrure. C'est fréquent en gymnastique, au volley, au tennis, en danse et à la perche. La bonne nouvelle : bien pris tôt, ça se répare. La condition, c'est de mettre de côté pendant plusieurs semaines les mouvements qui cambrent — c'est le seul moment de ce programme où on te demande vraiment d'arrêter quelque chose, et ce n'est pas négociable. Le reste du temps, tu continues à bouger et à te muscler autrement.",
        parent: "La spondylolyse de l'adolescent sportif est le diagnostic à évoquer devant toute lombalgie de plus de quelques semaines chez un jeune pratiquant un sport en hyperextension. Contrairement au reste de la section, l'arrêt des contraintes en hyperextension est ici réellement indiqué : la littérature retient au moins trois mois, la durée exacte revenant au médecin selon le stade lésionnel. Deux points méritent d'être connus. D'abord, le pronostic fonctionnel est bon : 80 à 90 % des jeunes reprennent leur sport dans les six mois sous traitement conservateur. Ensuite, et c'est contre-intuitif, l'objectif n'est pas la consolidation osseuse visible à l'imagerie — toutes les lésions ne consolident pas, et la consolidation n'est corrélée ni à la qualité de vie ni au retour au sport. Le corset, lui, n'a pas montré de supériorité en méta-analyse. La rééducation privilégie le gainage en position neutre et le renforcement des fessiers, en évitant l'extension lombaire.",
        drapeaux: ["Une douleur qui te réveille la nuit, ou qui descend dans les jambes avec des fourmillements.", "Une difficulté à uriner ou à te retenir, ou une insensibilité entre les cuisses : va aux urgences sans attendre."],
        stages: [
            { critere: "Tu passes une journée d'école et tu marches sans douleur, et tu as bien mis de côté tous les mouvements de cambrure comme ton médecin te l'a demandé.", exercises: [
                    { name: "Éviter les cambrures", dose: "tous les jours", tip: "Mets vraiment de côté les extensions, les smashes, les sauts et les acrobaties. C'est en général autour de trois mois, mais c'est ton médecin qui fixe la durée selon ce que montrent les examens.", pourquoi: "C'est le seul endroit de ce programme où arrêter est utile : la zone irritée ne peut se réparer que si tu arrêtes de la solliciter en cambrure." },
                    { name: "Bascule du bassin", dose: "3 × 15", tip: "Allongé sur le dos, genoux pliés, plaque doucement le bas du dos contre le sol puis relâche.", pourquoi: "Tu apprends à trouver la position neutre de ton dos, celle qui ne pince pas la zone irritée." },
                    { name: "Gainage sur les coudes", dose: "3 × 20 sec", tip: "En appui sur les avant-bras et la pointe des pieds, coudes sous les épaules. Ventre serré, corps bien aligné, sans creuser le bas du dos. Pose les genoux au sol si tu n'arrives pas à tenir les 20 secondes sans cambrer.", pourquoi: "Un tronc solide en position neutre protège la zone. C'est le renforcement autorisé pendant cette période." },
                    { name: "Continuer à bouger autrement", dose: "20 min", tip: "Marche, vélo, natation en crawl. Tu gardes ta condition sans cambrer.", pourquoi: "Arrêter tout le sport n'aide pas la réparation et te ferait perdre plusieurs mois de forme." }
                ] },
            { critere: "Tu tiens le gainage sans douleur, et les gestes du quotidien ne réveillent plus rien en bas du dos.", exercises: [
                    { name: "Gainage de face et de côté", dose: "3 × 30 sec", tip: "Alterne l'appui sur les coudes et sur un côté, en gardant le corps bien aligné.", pourquoi: "Tu construis une ceinture autour de ta colonne, ce qui lui évite de bouger là où c'est fragile." },
                    { name: "Pont fessier", dose: "3 × 12", tip: "Sur le dos, genoux pliés, lève les fesses en serrant, sans cambrer en haut du mouvement.", pourquoi: "Des fessiers forts font le travail à la place de ton bas du dos quand tu cours et sautes." },
                    { name: "Étirement de l'avant de la hanche", dose: "3 × 30 sec", tip: "Fente avant, genou arrière au sol, avance doucement le bassin sans cambrer.", pourquoi: "Quand l'avant de la hanche est court, il tire ton bassin et te fait cambrer sans que tu t'en rendes compte." },
                    { name: "Étirement de l'arrière des cuisses", dose: "3 × 30 sec", tip: "Assis, une jambe tendue, penche-toi en gardant le dos droit.", pourquoi: "Des cuisses raides forcent ton dos à compenser à chaque mouvement." }
                ] },
            { critere: "Ton médecin t'a autorisé à recommencer à te cambrer doucement, et les premiers mouvements ne réveillent aucune douleur.", exercises: [
                    { name: "Hanche en charnière", dose: "3 × 12", tip: "Debout, genoux à peine fléchis, pousse les fesses en arrière en gardant le dos droit, puis redresse-toi.", pourquoi: "Tu apprends à te pencher avec les hanches plutôt qu'avec le dos : c'est le geste qui protège le plus au quotidien." },
                    { name: "Gainage dynamique", dose: "3 × 10", tip: "En position de gainage, lève un bras puis l'autre sans que le bassin tourne.", pourquoi: "Tu apprends à garder ton dos immobile pendant que tes bras et tes jambes bougent — exactement ce que demande ton sport." },
                    { name: "Retour progressif à l'extension", dose: "3 × 8", tip: "Reviens petit à petit à la cambrure, d'abord debout et sans élan, uniquement si ton médecin t'a donné le feu vert.", pourquoi: "La zone s'est réparée, mais elle a besoin de réapprendre à travailler doucement avant de reprendre les gestes rapides." },
                    { name: "Renforcement complet des jambes", dose: "3 × 12", tip: "Squats : pieds écartés comme tes épaules, descends comme pour t'asseoir sur une chaise, dos droit et ventre serré, puis remonte. Fentes : un grand pas en avant, le genou arrière descend vers le sol, puis repousse. Dans les deux, le bas du dos ne se cambre jamais.", pourquoi: "Des jambes fortes amortissent les réceptions à ta place, ce qui décharge ton bas du dos." }
                ] },
            { critere: "Tu as repris tous les gestes de ton sport, cambrures comprises, sans douleur. Garde le gainage : c'est lui qui évitera que ça recommence.", exercises: [
                    { name: "Retour au geste de ton sport", dose: "selon ton plan", tip: "Smashes, extensions, acrobaties : remets-les un par un, en augmentant le nombre avant l'intensité.", pourquoi: "C'est la répétition qui avait irrité la zone : elle se réapprivoise progressivement." },
                    { name: "Gainage d'entretien", dose: "3 × par semaine", tip: "Garde le gainage de face et de côté, même quand tu n'as plus mal.", pourquoi: "C'est ta ceinture de protection. Si tu l'arrêtes, la douleur a de bonnes chances de revenir." },
                    { name: "Étirements d'entretien", dose: "3 × par semaine", tip: "Avant de la hanche : en fente, genou arrière au sol, avance doucement le bassin sans cambrer. Arrière des cuisses : assis, une jambe tendue, penche-toi vers le pied en gardant le dos droit. Trente secondes de chaque côté.", pourquoi: "Tant que tu grandis, ces muscles se raccourcissent et te font cambrer davantage." },
                    { name: "Surveiller la charge d'entraînement", dose: "chaque semaine", tip: "Évite d'augmenter brutalement le volume, surtout en début de saison.", pourquoi: "Les rechutes arrivent presque toujours après une grosse augmentation d'un coup." }
                ] }
        ],

    {
        id: "coude-lanceur",
        label: "Ostéochondrite du coude",
        alias: "La douleur au coude quand tu lances",
        desc: "Une douleur sur le côté du coude quand tu lances, quand tu sers au tennis ou quand tu prends appui sur les bras en gymnastique.",
        context: "Dans ton coude, une petite zone d'os et de cartilage est encore en construction. Quand tu lances ou que tu prends appui très souvent, elle se fait comprimer à chaque geste et finit par s'irriter. C'est un problème à prendre au sérieux : contrairement à la bosse sous le genou, ici la zone peut s'abîmer durablement si tu continues à lancer malgré la douleur. La bonne nouvelle, c'est qu'en arrêtant tôt les lancers, ça récupère très bien. Le nombre de lancers compte plus que ta technique : c'est la quantité qu'il faut surveiller.",
        parent: "L'ostéochondrite du condyle huméral touche le jeune lanceur ou gymnaste, typiquement entre 11 et 16 ans, et c'est la seule atteinte de cette section où poursuivre l'activité peut laisser des séquelles articulaires. Le repos des contraintes en compression est indiqué : la littérature retient quatre à six semaines sans lancer, parfois deux à trois mois. Un avis médical avec imagerie s'impose devant toute douleur latérale persistante, tout blocage ou tout épanchement ; en cas de traitement chirurgical, le retour au sport se situe autour de six mois. La prévention repose sur des quotas de lancers : les recommandations les mieux établies viennent du baseball, où la limite est fixée autour de 70 lancers par jour entre 8 et 12 ans. Le principe transfère aux autres sports de lancer — c'est le nombre de gestes, plus que la technique, qui fait la lésion.",
        drapeaux: ["Un coude qui se bloque, qui craque en restant coincé, ou que tu n'arrives plus à tendre complètement.", "Un coude gonflé, ou une douleur qui persiste alors que tu ne lances plus depuis plusieurs semaines."],
        stages: [
            { critere: "Tu tends et plies complètement ton coude sans douleur, et les gestes du quotidien ne réveillent plus rien.", exercises: [
                    { name: "Arrêter les lancers et les appuis", dose: "plusieurs semaines", tip: "Arrête complètement les lancers, les services et les appuis sur les bras. C'est en général quatre à six semaines, parfois deux à trois mois si ça a traîné — ton médecin te dira selon les examens.", pourquoi: "C'est l'exception de ce programme : ici, continuer à lancer malgré la douleur peut abîmer l'articulation pour de bon." },
                    { name: "Mobilité douce du coude", dose: "3 × 15", tip: "Plie et tends ton coude lentement sur toute l'amplitude possible, sans forcer.", pourquoi: "Tu gardes ton articulation souple pendant qu'elle se répare, sans lui imposer de compression." },
                    { name: "Contraction sans bouger", dose: "5 × 20 sec", tip: "Pousse ta main contre le mur ou contre l'autre main, coude légèrement fléchi, sans bouger.", pourquoi: "Tu entretiens tes muscles sans écraser la zone abîmée." },
                    { name: "Garder les jambes et le tronc actifs", dose: "3 × par semaine", tip: "Cours, fais du vélo, du gainage, du travail de jambes.", pourquoi: "Tu ne perds pas ta condition physique pendant que ton coude récupère : tu reviendras beaucoup plus vite." }
                ] },
            { critere: "Ton médecin t'a autorisé à reprendre le renforcement, et tu n'as plus mal du tout au repos comme en bougeant.", exercises: [
                    { name: "Renforcement du poignet", dose: "3 × 15", tip: "Avant-bras posé, une petite charge en main, monte et descends le poignet lentement.", pourquoi: "Des avant-bras forts absorbent une partie des contraintes avant qu'elles n'arrivent au coude." },
                    { name: "Renforcement de l'épaule", dose: "3 × 15", tip: "Élastique accroché à hauteur de ton coude, coude collé au corps et plié à angle droit. Ouvre l'avant-bras vers l'extérieur sans décoller le coude, puis reviens lentement. Fais ensuite l'inverse, en ramenant l'avant-bras vers ton ventre.", pourquoi: "Un lanceur qui a une épaule faible compense avec le coude. C'est souvent là que le problème a commencé." },
                    { name: "Stabilisateurs de l'omoplate", dose: "3 × 12", tip: "Serre les omoplates l'une vers l'autre à l'élastique, sans monter les épaules.", pourquoi: "Ton omoplate est la base de ton bras : si elle bouge mal, ton coude encaisse à sa place." },
                    { name: "Gainage et jambes", dose: "3 × par semaine", tip: "Garde le gainage sur les coudes, les squats et le vélo pendant que ton coude se répare : rien de tout cela ne le sollicite.", pourquoi: "Un lancer part des jambes. Plus elles sont fortes, moins ton bras force." }
                ] },
            { critere: "Tu fais tout le renforcement sans douleur, et ton médecin t'a donné le feu vert pour recommencer à lancer doucement.", exercises: [
                    { name: "Reprise comptée des lancers", dose: "20 lancers, à mi-distance", tip: "Recommence par un petit nombre de lancers courts et sans forcer. Compte-les vraiment.", pourquoi: "C'est le nombre de lancers qui compte le plus, avant la distance et avant la force. Compter, c'est le traitement." },
                    { name: "Augmentation par paliers", dose: "+10 lancers par semaine", tip: "Ajoute quelques lancers chaque semaine, seulement si tu n'as pas eu mal après la séance précédente.", pourquoi: "Ton articulation s'adapte lentement. Une grosse séance d'un coup annule des semaines de progrès." },
                    { name: "Renforcement maintenu", dose: "3 × par semaine", tip: "Continue épaule, omoplate et poignet pendant toute la reprise.", pourquoi: "C'est ce qui fait que la charge passe dans les muscles plutôt que dans l'articulation." },
                    { name: "Suivi de la douleur du lendemain", dose: "après chaque séance", tip: "Si ton coude te fait mal le lendemain, tu es allé trop vite : reviens au palier précédent.", pourquoi: "La douleur du lendemain est le seul juge fiable. Celle du moment ment souvent." }
                ] },
            { critere: "Tu as retrouvé ton volume de lancers habituel sans douleur pendant ni le lendemain. Garde un quota : c'est le nombre de lancers, plus que ta technique, qui fait revenir le problème.", exercises: [

                    { name: "Respecter un quota de lancers", dose: "à chaque entraînement", tip: "Fixe avec ton entraîneur un nombre maximum de lancers par séance et par semaine, et tiens-t'y même quand tu te sens bien. Au baseball, où c'est le mieux étudié, la limite tourne autour de 70 lancers par jour entre 8 et 12 ans.", pourquoi: "C'est la mesure de prévention la plus efficace connue pour les jeunes lanceurs." },

                    { name: "Repos dans l'année", dose: "plusieurs semaines", tip: "Prévois une période sans lancer dans l'année, même sans douleur.", pourquoi: "Un coude de jeune lanceur a besoin de vraies coupures pour tenir dans la durée." }
                ] }
        ],

    {
        id: "nocturnes",
        label: "Douleurs de croissance",
        alias: "Les jambes qui font mal le soir",
        desc: "Des douleurs dans les deux jambes, le soir ou la nuit, qui réveillent parfois, mais qui ont complètement disparu le matin au réveil.",

    }))),

        haystack: normalizeSearch([r.label, r.alias, r.desc, "course a pied coureur running", (SEARCH_SYNONYMS[r.id] || []).join(" ")].join(" ")),
    })),
    ...PREVENTION_CATEGORIES.flatMap((cat) => Object.entries(cat.data).map(([subId, sub]) => ({
        id: `prev:${cat.id}:${subId}`,
        kind: "prevention",
        categoryId: cat.id,
        subId,
        label: `${cat.title} — ${sub.label}`,
        sub: cat.detail,

function searchEntries(query) {
    const q = normalizeSearch(query);
    if (q.length < 2)
        return [];
    const tokens = q.split(" ").filter(Boolean);
    return SEARCH_INDEX.map((entry) => {
        if (!tokens.every((t) => entry.haystack.includes(t)))
            return null;
        // On remonte en premier ce qui correspond au libellé lui-même, puis au début du libellé.
        const label = normalizeSearch(entry.label);
        let score = 0;
        if (label.startsWith(q))
            score = 3;
        else if (label.includes(q))
            score = 2;
        else if (tokens.every((t) => label.includes(t)))
            score = 1;
        return { entry, score };
    })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score || a.entry.label.localeCompare(b.entry.label))
        .map((r) => r.entry);
}

                border: done || running ? "1px solid transparent" : `1px solid ${BORDURE}`,
                color: done ? ACCENT_FORT : running ? "#FFFFFF" : INK_DOUX,
            } },
            React.createElement("span", null, done ? "✓" : running ? "⏸" : "▶"),
            // Chiffres à chasse fixe plutôt qu'une police à chasse fixe : le décompte ne
            // tressaute pas, et il reste dans la voix typographique du reste de l'application.
            React.createElement("span", { style: { fontVariantNumeric: "tabular-nums" } }, done ? "Terminé" : formatMMSS(remaining))),
        (running || remaining !== seconds) && !done && (React.createElement("button", { onClick: () => { setRunning(false); echeance.current = null; sonne.current = false; setRemaining(seconds); }, className: "text-[11px] underline underline-offset-2", style: { color: INK_DOUX } }, "R\u00E9initialiser"))));
}

// --- Persistance locale : la progression reste sur l'appareil du patient ---
// Aucune donnée ne quitte le téléphone : pas de serveur, pas de compte.
// Tout est encapsulé dans des try/catch car le stockage peut être refusé
// (navigation privée, aperçu restreint, réglages du navigateur) — dans ce cas
// l'application continue de fonctionner, simplement sans mémoire d'une fois sur l'autre.
const STORAGE_KEY = "kine-exercices-v1";

// La version 1 repérait un exercice par sa position : « 1-2 » pour le 3e exercice du 2e
// stade. Toute retouche du contenu décalait alors les cases cochées des patients. On
// s'appuie désormais sur le nom de l'exercice, vérifié unique à l'intérieur d'un parcours.
function slug(txt) {

        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}
const idExercice = (ex) => slug(ex.name);
// Clés de rangement. Elles ne contiennent plus aucun indice de position.
const cleParcours = (pathId, injuryId) => `${pathId}:${injuryId}`;
const cleCroissance = (croissanceId, stageIdx) => {
    const ph = CROISSANCE_PHASES[stageIdx];
    return `croissance:${croissanceId}:${slug(ph && ph.label)}`;
};
const cleCoureur = (runnerPathId, stageIdx) => {
    const l = RUNNER_STAGE_LABELS[stageIdx];
    return `runner:${runnerPathId}:${slug(l && l.label)}`;
};
const clePrevention = (cat, sub) => `prevention:${cat}:${sub}`;
// Inventaire des identifiants valides, par clé de rangement : sert à écarter d'une
// sauvegarde les exercices qui n'existent plus, sans toucher aux autres.
function inventaireIds() {
    const inv = {};
    PATHOLOGIES.forEach((z) => z.injuries.forEach((i) => {
        const ids = [];
        i.stages.forEach((s) => s.exercises.forEach((e) => ids.push(idExercice(e))));
        inv[cleParcours(z.id, i.id)] = new Set(ids);
    }));
    RUNNER_DATA.forEach((p) => p.stages.forEach((s, si) => {
        inv[cleCoureur(p.id, si)] = new Set(s.exercises.map(idExercice));
    }));
    PREVENTION_CATEGORIES.forEach((c) => {
        Object.keys(c.data).forEach((sub) => {
            inv[clePrevention(c.id, sub)] = new Set(c.data[sub].exercises.map(idExercice));
        });
    });
    CROISSANCE_DATA.forEach((c) => c.stages.forEach((st, si) => {
        inv[cleCroissance(c.id, si)] = new Set(st.exercises.map(idExercice));
    }));
    return inv;
}
// Reprise d'une sauvegarde au format positionnel : on retraduit chaque position en nom
// d'exercice avec le contenu actuel. Ce qui ne se retrouve plus est simplement abandonné.
function migrerDepuisPositions(done) {
    const out = {};
    const garder = (cle, ids) => { if (ids.length) out[cle] = ids; };
    Object.keys(done || {}).forEach((cle) => {
        const anciens = done[cle] || [];
        if (cle.indexOf("runner:") === 0) {
            const [, pathId, idxTexte] = cle.split(":");
            const p = RUNNER_DATA.find((x) => x.id === pathId);
            const s = p && p.stages[Number(idxTexte)];
            if (!s)
                return;
            garder(cleCoureur(pathId, Number(idxTexte)), anciens
                .map((id) => s.exercises[Number(String(id).replace("r-", ""))])
                .filter(Boolean).map(idExercice));
            return;
        }
        if (cle.indexOf("prevention:") === 0) {
            const [, cat, sub] = cle.split(":");
            const c = PREVENTION_CATEGORIES.find((x) => x.id === cat);
            const liste = c && c.data[sub] && c.data[sub].exercises;
            if (!liste)
                return;
            garder(cle, anciens
                .map((id) => liste[Number(String(id).replace("p-", ""))])
                .filter(Boolean).map(idExercice));
            return;
        }
        const [pathId, injuryId] = cle.split(":");
        const z = PATHOLOGIES.find((x) => x.id === pathId);
        const i = z && z.injuries.find((x) => x.id === injuryId);
        if (!i)
            return;
        garder(cle, anciens.map((id) => {
            const [si, ei] = String(id).split("-").map(Number);

// Nettoyage à chaque lecture : on conserve tout ce qui existe encore, on écarte le reste.
// --- Charges notées ------------------------------------------------------------------
// La dose affichée est fixe, alors que la progressivité de charge est le moteur du
// renforcement : « 4 × 8 avec la 8e difficile » n'a pas le même contenu en semaine 1 et
// en semaine 5. Le patient note ce qu'il a réellement fait, et retrouve la fois d'avant.
const CHARGES_MAX = 6; // on ne garde que les dernières notes par exercice
function noterCharge(charges, cle, exId, date, valeur) {
    const copie = Object.assign({}, charges);
    const liste = (copie[cle] && copie[cle][exId] ? copie[cle][exId] : []).filter((n) => n.d !== date);
    const suite = valeur ? [{ d: date, v: valeur }].concat(liste) : liste;
    copie[cle] = Object.assign({}, copie[cle]);
    if (suite.length)
        copie[cle][exId] = suite.slice(0, CHARGES_MAX);
    else
        delete copie[cle][exId];
    return copie;
}
function chargeDuJour(charges, cle, exId, date) {
    const l = (charges[cle] && charges[cle][exId]) || [];
    const t = l.find((n) => n.d === date);
    return t ? t.v : "";
}
// Le patient note ses charges mais ne voyait jamais le chemin parcouru : seule la dernière
// valeur s'affichait. Or c'est l'écart entre la première et la dernière qui donne envie de
// continuer, et qui dit au kinésithérapeute que la progression a bien eu lieu.
function progressionCharge(charges, cle, exId) {
    const l = (charges[cle] && charges[cle][exId]) || [];
    if (l.length < 2)
        return null;
    return { depuis: l[l.length - 1], vers: l[0] };
}
function chargePrecedente(charges, cle, exId, date) {
    const l = (charges[cle] && charges[cle][exId]) || [];
    return l.find((n) => n.d !== date) || null;
}
// Une dose « quotidien » ou « selon plan » ne se note pas : seuls les exercices réellement
// dosés reçoivent le champ, pour ne pas encombrer les consignes qui n'en sont pas.
function doseNotable(dose) {
    // « 4 × 8 » ou « 5 × 45 sec » : oui. « 3 × par semaine » est une fréquence, pas une
    // charge, et « quotidien » ou « selon plan » sont des consignes : on les écarte.
    return /\d+\s*[×x]\s*\d+/.test(String(dose || ""));
}
function jjmm(d) {
    const p = String(d || "").split("-");

}
function elaguer(done) {
    const inv = inventaireIds();

    Object.keys(done || {}).forEach((cle) => {
        const connus = inv[cle];
        if (!connus)
            return;
        const gardes = (done[cle] || []).filter((id) => connus.has(id));

            return false;
        const probe = "__probe__";
        window.localStorage.setItem(probe, "1");
        window.localStorage.removeItem(probe);
        return true;
    }
    catch (e) {
        return false;
    }

function readStore() {

            return null;

        // Sauvegarde d'avant les identifiants stables : on retraduit les positions une fois
        // pour toutes. Un patient qui revient après une mise à jour garde sa progression.

            data.done = migrerDepuisPositions(data.done);
        // Puis, à chaque lecture, on écarte les exercices qui ne sont plus au programme et
        // on conserve tous les autres. C'est ce qui rend les retouches de contenu inoffensives.
        const tri = elaguer(data.done);
        data.done = tri.done;
        // Passage aux séances datées. Les coches trouvées sont celles de la dernière séance :
        // on les crédite au jour enregistré, ou à aujourd'hui si la date est inconnue.
        if (!data.version || data.version < 3) {
            const jour = data.jour || aujourdHui();

                const n = (data.done[cle] || []).length;
                if (n)

            data.jour = jour;

            if (!inv[cle])

<script>
// Enregistrement du service worker : c'est lui qui garde le programme disponible sans réseau.
// Tout est enveloppé : un navigateur qui ne le gère pas, ou un enregistrement refusé (mode

(function () {

    // ses cases cochées du jour. On propose, il choisit.
    var deja = false;

        barre.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));"
