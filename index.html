// Le pictogramme se décidait sur le seul nom de l'exercice. Or la position vit dans la
// consigne : « Abduction de hanche en charge » ne dit pas qu'elle se fait debout, mais son
// texte si — et le dessin montrait quelqu'un allongé. Les règles reçoivent donc aussi la
// consigne ; celles qui n'en ont pas besoin l'ignorent, et se lisent comme avant.
// Chaque dessin qui montre une posture la déclare ici. Ceux qui n'en montrent pas — une main,
// une chaussure, deux flèches opposées — n'y figurent pas et ne sont jamais remis en cause.
const POSTURE_DESSIN = {
    "prone-extension": "ventre", plank: "ventre",
    "seated-flexion": "assis", "etirement-assis": "assis", "seated-hip-iso": "assis",
    "seated-rotators": "assis", "seated-leg": "assis", bike: "assis",
    "side-lying": "allonge", bridge: "allonge", "lying-mobilise": "allonge",
    "supine-core": "allonge", "four-point": "quatre",
    "etirement-debout": "debout", step: "debout", calf: "debout", "standing-abduction": "debout",
    "hip-rotation": "debout", squat: "debout", lunge: "debout", "hip-hinge": "debout",
    balance: "debout", jump: "debout", run: "debout",
};
// Quand la consigne installe le patient autrement que le dessin, on cherche le même geste
// dans la bonne posture. Faute de quoi, mieux vaut le pictogramme neutre qu'une position que
// le texte contredit : le patient regarde le dessin avant de lire.
const DESSIN_AUTRE_POSTURE = {
    "etirement-debout": { assis: "etirement-assis", allonge: "lying-mobilise", quatre: "four-point" },
    "lying-mobilise": { assis: "seated-leg", debout: "trunk" },
    "hip-hinge": { allonge: "lying-mobilise", ventre: "prone-extension" },
    squat: { assis: "seated-leg" },
    "side-lying": { debout: "standing-abduction" },
    balance: { allonge: "lying-mobilise", quatre: "four-point" },
    plank: { allonge: "supine-core", quatre: "four-point" },
    "seated-flexion": { allonge: "lying-mobilise" },
    "prone-extension": { debout: "trunk" },
    bridge: { assis: "seated-leg", debout: "standing-abduction" },
    "etirement-assis": { debout: "etirement-debout", allonge: "lying-mobilise" },
};
// La consigne ouvre presque toujours en installant le patient : « Assis au bord d'un lit… »,
// « Debout, élastique au-dessus des chevilles… ». C'est ce début-là qui fait foi.
function postureDecrite(tip) {
    const t = normalizeSearch(tip || "").slice(0, 110);
    // Le ventre et les quatre pattes se déclarent avant tout : « allongé sur le ventre »
    // commence par « allongé » sans être pour autant la même posture que sur le dos.
    if (/sur le ventre|a plat ventre|\bplanche\b/.test(t))
        return "ventre";
    if (/a quatre pattes/.test(t))
        return "quatre";
    const trouves = [];
    const noter = (cle, re) => { const m = t.match(re); if (m) trouves.push([m.index, cle]); };
    noter("allonge", /sur le dos|\ballonge\b|\bcouche\b|semi allonge/);
    // « sur le côté » est le plus souvent une direction — « grand pas sur le côté », « bras
    // levé sur le côté ». Ce n'est une posture que dit explicitement, ou en tête de consigne.
    const couche = t.match(/(allonge|couche)e? sur le cote/);
    const brut = t.match(/^sur le cote/);
    if (couche)
        trouves.push([couche.index, "allonge"]);
    else if (brut)
        trouves.push([0, "allonge"]);
    noter("debout", /\bdebout\b/);
    noter("assis", /\bassis\b|\bassise\b/);
    if (!trouves.length)
        return null;
    trouves.sort((a, b) => a[0] - b[0]);
    return trouves[0][1];
}
function getExerciseIcon(name, tip) {
    const n = (name || "").toLowerCase();
    const t = (tip || "").toLowerCase();
    const match = POSES.find((p) => p.test(n, t));
    // Repli neutre plutôt qu'une icône de mouvement, pour ne jamais suggérer un geste erroné
    if (!match)
        return PoseAdvice;
    const montree = POSTURE_DESSIN[match.key];
    const decrite = postureDecrite(tip);
    if (!montree || !decrite || montree === decrite)
        return match.icon;
    const remplacant = (DESSIN_AUTRE_POSTURE[match.key] || {})[decrite];
    if (remplacant) {
        const pose = POSES.find((p) => p.key === remplacant);
        if (pose)
            return pose.icon;
    }
    return PoseAdvice;
}

                            { name: "Isométrique du muscle lésé à faible intensité", dose: "5 × 10 sec", tip: "Allongé ou assis, articulation immobile, membre calé contre un mur ou contre votre main. Contractez le muscle concerné sans que rien ne bouge, à environ un tiers de votre force. Le maintien est court volontairement : sur un muscle récemment lésé, on réactive sans fatiguer." }
                        ] },
                    { label: "Renforcement progressif", critere: "Vous contractez le muscle contre résistance sans douleur, et la force paraît comparable des deux côtés sur les mêmes exercices.", exercises: [
                            { name: "Isométrique du muscle lésé", dose: "5 × 30 sec", tip: "Allongé ou assis, articulation immobile, membre calé contre un mur ou contre votre main. Contractez le muscle lésé sans que rien ne bouge, à environ deux tiers de votre force, et tenez. Montez progressivement l'intensité et la durée d'une séance à l'autre, tant que le lendemain reste calme." },
                            { name: "Renforcement à l'élastique", dose: "3 × 15", tip: "Élastique fixé à un point stable et attaché à la cheville. Réalisez le mouvement de jambe concerné contre la résistance, lentement et de façon contrôlée, en augmentant la résistance au fil des séances." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds, chevilles, bassin et épaules alignés. Serrez les abdominaux sans creuser le bas du dos et respirez normalement. Un tronc stable réduit les compensations qui surchargent le muscle en cours de cicatrisation." },
                            { name: "Renforcement de la chaîne postérieure", dose: "3 × 12", tip: "Pont fessier si la lésion est haute, hanche en charnière si elle est basse : debout, genoux à peine fléchis, poussez les fesses vers l'arrière en gardant le dos neutre, puis redressez-vous. Ajoutez de la charge quand 12 répétitions deviennent faciles." }
                        ] },
                    { label: "Charge dynamique", critere: "Vous trottinez puis accélérez à mi-vitesse sans appréhension, et rien ne se réveille le lendemain.", exercises: [
                            { name: "Renforcement excentrique léger", dose: "3 × 8", tip: "Debout, freinez la descente d'un squat en 4 secondes puis remontez normalement. Si les ischio-jambiers sont concernés, préférez la variante Nordic : à genoux, chevilles bloquées par un partenaire ou sous un meuble, laissez le buste basculer vers l'avant le plus lentement possible. Le travail excentrique est l'élément le mieux documenté pour réduire le risque de récidive." },
                            { name: "Course continue légère", dose: "10-15 min", tip: "Allure modérée, terrain plat, en restant strictement sous le seuil de douleur. Arrêtez à la moindre sensation de tiraillement." },
                            { name: "Sauts légers sur place", dose: "3 × 10", tip: "Debout, pieds largeur du bassin. Petits sauts sur place, hauteur minimale, contact au sol bref et souple. Il s'agit de réhabituer le muscle à des contraintes rapides, pas de produire de la performance." },
                            { name: "Foulées bondissantes courtes", dose: "3 × 15 m", tip: "Course exagérément bondissante sur une courte distance, en cherchant l'amplitude plutôt que la vitesse. Réintroduit la contrainte d'étirement rapide propre à la course." }
                        ] },
                    { label: "Retour au sport", critere: "Vous atteignez votre vitesse maximale sans appréhension, l'étirement rapide jambe tendue ne réveille aucune gêne, et vous avez enchaîné plusieurs séances complètes sur le terrain. L'appréhension au sprint est le meilleur signal qu'il reste du chemin : elle compte autant que la douleur.", exercises: [
                            { name: "Sprints progressifs", dose: "4 × 30 m", tip: "Augmentez l'intensité série après série, sans atteindre le sprint maximal d'emblée. La vitesse maximale est la contrainte la plus provocante : gardez-la pour la fin." },
                            { name: "Changements de direction", dose: "4 × 15 m", tip: "Placez deux repères à une quinzaine de mètres et enchaînez course, freinage, changement de direction. Montez l'intensité d'une série à l'autre jusqu'à approcher celle du match, en gardant des appuis stables et le genou aligné." },
                            { name: "Gestes spécifiques du sport", dose: "1 séance", tip: "Passes, tirs ou appuis selon la discipline, réintroduits progressivement sur plusieurs séances." },
                            { name: "Maintien du travail excentrique", dose: "1 à 2 × par semaine", tip: "À poursuivre sur le long terme après la reprise : c'est la mesure préventive la mieux établie contre la récidive de lésion musculaire." }
                        ] }
                ] },
            { id: "lca", label: "Ligaments croisés", groupe: "Après une opération", desc: "Après reconstruction du ligament croisé antérieur.", context: "La reconstruction du LCA est l'une des rééducations les plus longues et les plus codifiées. Deux principes structurent tout le parcours : la récupération de l'extension complète est prioritaire dès les premiers jours, car un genou qui ne se tend plus complètement expose à des complications durables ; et la décision de reprise du sport ne se prend pas sur un délai mais sur des critères objectifs, notamment une symétrie de force et de saut supérieure à environ 90 % entre les deux jambes. Reprendre trop tôt est le principal facteur de re-rupture.", surgical: true, stages: [
                    { label: "Immédiat post-opératoire", critere: "Votre genou se tend complètement, aussi droit que l'autre, et vous levez la jambe tendue sans qu'elle fléchisse au départ. Le gonflement a nettement diminué.", sub: "0 à 2 semaines", exercises: [
                            { name: "Contrôle de la douleur et de l'œdème", dose: "plusieurs fois par jour", tip: "Glace et surélévation du membre, selon les consignes reçues à la sortie du bloc." },
                            { name: "Récupération de l'extension complète", dose: "3 × 2 min", tip: "Allongé sur le dos ou assis, talon posé sur un coussin de sorte que le mollet soit dans le vide. Laissez le genou se tendre sous le poids de la jambe, cuisse totalement relâchée, et restez ainsi sans forcer. C'est l'objectif prioritaire de cette phase : un genou qui ne récupère pas son extension complète expose à des complications durables." },
                            { name: "Activation du quadriceps", dose: "5 × 10 contractions", tip: "Assis, jambe opérée tendue devant vous, regard posé sur la cuisse. Contractez l'avant de la cuisse comme pour écraser le genou vers le sol, en vérifiant des yeux que la rotule remonte, puis relâchez complètement. La contraction volontaire est souvent inhibée après la chirurgie : le retour visuel aide beaucoup à la retrouver." },
                            { name: "Mobilisation de la rotule", dose: "3 × 1 min", tip: "Assis, jambe tendue et cuisse totalement relâchée. Saisissez la rotule entre le pouce et l'index, et faites-la glisser doucement de haut en bas puis de gauche à droite. Sans relâchement du quadriceps, elle ne bougera pas." }
                        ] },
                    { label: "Cicatrisation & mobilité", critere: "Vous marchez sans cannes et sans boiter, votre genou plie assez pour faire un tour de pédalier complet sans à-coup, et il ne regonfle plus en fin de journée.", sub: "2 à 6 semaines", exercises: [
                            { name: "Flexion active assistée du genou", dose: "3 × 15", tip: "Assis au bord d'un lit, laissez la jambe opérée descendre sous son propre poids, puis accompagnez la flexion avec l'autre jambe placée devant le tibia. Gagnez quelques degrés par séance, sans jamais dépasser la limite indiquée par le chirurgien." },
                            { name: "Sevrage progressif des cannes", dose: "selon consignes", tip: "La reprise d'un appui complet se fait selon le protocole du chirurgien, pas sur simple ressenti." },
                            { name: "Mobilisation active-assistée", dose: "3 × 15", tip: "Flexion-extension aidée par les mains ou une serviette, amplitude progressive." },
                            { name: "Vélo sans résistance", dose: "10-15 min", tip: "Vélo d'appartement, selle haute au départ, résistance nulle. Commencez par des demi-tours de pédale d'avant en arrière si le tour complet ne passe pas encore, puis enchaînez dès que l'amplitude le permet." }
                        ] },
                    { label: "Renforcement initial", critere: "Vous descendez en squat sur deux jambes sans reporter le poids sur la jambe saine, vous tenez 30 secondes en équilibre sur la jambe opérée, et le genou ne gonfle pas le lendemain.", sub: "6 à 12 semaines", exercises: [
                            { name: "Squats partiels contrôlés (0-60°)", dose: "3 × 12", tip: "Debout, pieds largeur du bassin. Descendez jusqu'à un demi-squat seulement — genoux à 60° environ, pas plus — puis remontez. Genoux alignés avec les pieds, talons au sol tout au long." },
                            { name: "Presse à deux jambes progressive", dose: "3 × 12", tip: "Sur une presse, les deux pieds à plat, écartés de la largeur du bassin. Poussez et revenez lentement, en restant dans l'amplitude autorisée par votre chirurgien. Augmentez la charge avant d'augmenter l'amplitude." },
                            { name: "Chaîne postérieure (pont, ischio-jambiers)", dose: "3 × 12", tip: "Pont fessier puis, quand il est facile, hanche en charnière : debout, genoux à peine fléchis, poussez les fesses vers l'arrière en gardant le dos droit. Les ischio-jambiers freinent le tibia vers l'avant et déchargent le greffon." },
                            { name: "Renforcement du mollet", dose: "3 × 15", tip: "Debout, mains en appui léger sur un mur. Montez sur la pointe des deux pieds en 2 secondes, marquez un temps en haut, puis redescendez en 3 secondes sans laisser le talon tomber." }
                        ] },
                    { label: "Renforcement avancé & proprioception", critere: "Vous faites 10 squats sur la seule jambe opérée, genou aligné avec le pied et sans qu'il parte vers l'intérieur, sans douleur ni gonflement le lendemain. La reprise de course se décide avec votre kinésithérapeute, qui vérifie votre force.", sub: "3 à 4 mois", exercises: [
                            { name: "Squats unipodaux sur surface instable", dose: "3 × 10", tip: "Debout sur une jambe sur un coussin épais, mains sur les hanches. Descendez d'un quart de squat en gardant le genou aligné avec le pied et le bassin horizontal, puis remontez. À n'aborder que si l'équilibre unipodal simple est acquis." },
                            { name: "Presse à une jambe chargée", dose: "3 × 12", tip: "Sur une presse, une seule jambe à la fois. Poussez en 2 secondes, revenez en 3 secondes, sans jamais tendre complètement le genou en fin de course. Faites toujours la jambe saine en premier, elle donne le repère." },
                            { name: "Équilibre dynamique avec perturbations", dose: "3 × 10", tip: "En équilibre sur une jambe, demandez à quelqu'un de vous pousser légèrement et sans prévenir, à l'épaule ou au bassin. À défaut, faites rebondir un ballon contre un mur tout en tenant la position." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds. Alignez chevilles, bassin et épaules, serrez les abdominaux sans creuser le bas du dos, et continuez à respirer normalement pendant tout le maintien." }
                        ] },
                    { label: "Course & réathlétisation", critere: "Vous courez 20 à 30 minutes en terrain plat sans douleur ni gonflement, et vous réceptionnez un saut sur une jambe en restant stable, genou aligné avec le pied.", sub: "4 à 6 mois", exercises: [
                            { name: "Reprise progressive de la course", dose: "selon plan de reprise", tip: "Protocole alternant marche et course, volume croissant semaine après semaine." },
                            { name: "Réception de saut stabilisée", dose: "3 × 8", tip: "Depuis une marche basse, laissez-vous tomber sur les deux pieds et figez la réception 2 secondes : genoux fléchis, alignés avec les pieds, bassin horizontal. C'est l'immobilité à l'arrivée qui est travaillée, pas le saut." },
                            { name: "Pliométrie légère (sauts bipodaux)", dose: "3 × 10", tip: "Debout, pieds largeur du bassin. Petits sauts sur place sur les deux pieds, sans chercher la hauteur. La réception doit être silencieuse : un bruit sec signale que l'amortissement se fait mal." },
                            { name: "Renforcement excentrique du quadriceps", dose: "3 × 12", tip: "Debout ou à la presse, sur la jambe opérée. Freinez la descente en 3 secondes, puis remontez normalement, en vous aidant de l'autre jambe si besoin. C'est la phase freinée qui compte : c'est elle qui redonne au quadriceps sa capacité à encaisser." }
                        ] },
                    { label: "Retour au sport", critere: "Le feu vert repose sur des tests chiffrés que réalise votre kinésithérapeute : force du quadriceps et sauts à au moins 90 % de la jambe saine, sur une batterie de tests et non un seul. S'y ajoutent le délai depuis l'opération — rarement moins de neuf mois pour les sports de pivot — et le fait de vous sentir prêt, qui pèse autant que les chiffres.", sub: "6 à 9 mois et plus", exercises: [
                            { name: "Tests de saut unipodal", dose: "protocole en cabinet", tip: "La reprise du sport se discute sur une symétrie de performance généralement supérieure à 90 % entre les deux jambes, pas seulement sur un délai." },
                            { name: "Pliométrie sport-spécifique", dose: "4 × 8", tip: "Enchaînez les appuis de votre sport — pas chassés, appuis en zigzag, sauts avec changement de direction — à vitesse croissante d'une série à l'autre. À ce stade le geste doit être surveillé : c'est là que se produisent la plupart des récidives." },
                            { name: "Gestes de contact ou de duel simulés", dose: "1 séance encadrée", tip: "Réintroduction progressive, idéalement en présence du kinésithérapeute ou du préparateur physique." },
                            { name: "Validation fonctionnelle avant reprise en match", dose: "bilan", tip: "Ne pas se fier uniquement aux sensations : un bilan objectif est recommandé avant la reprise en compétition." }
                        ] }
                ] },
            { id: "menisque-suture", label: "Ménisque — suture (réparation)", groupe: "Après une opération", desc: "Après réparation chirurgicale du ménisque : appui et flexion limités pendant plusieurs semaines.", context: "Après une suture, le ménisque doit cicatriser : c'est ce qui impose des consignes strictes d'appui et de flexion pendant plusieurs semaines, et une reprise sensiblement plus lente qu'après une méniscectomie. Deux gestes sont particulièrement à risque tant que la cicatrisation n'est pas acquise : la flexion profonde en charge — accroupissement, squat complet — et le pivot pied au sol. Les délais indiqués ici sont des ordres de grandeur courants : le protocole de votre chirurgien prime sur toute indication générale.", surgical: true, stages: [
                    { label: "Protection de la suture", critere: "Le genou se tend complètement, le gonflement est maîtrisé, et vous respectez sans écart les consignes d'appui et d'amplitude fixées par votre chirurgien — ici c'est la suture qui commande, pas la douleur.", sub: "0 à 4 semaines", exercises: [
                            { name: "Contrôle de la douleur et de l'œdème", dose: "plusieurs fois par jour", tip: "Glace une quinzaine de minutes plusieurs fois par jour, jambe surélevée au-dessus du niveau du cœur. C'est surtout utile les premiers jours, quand le gonflement limite à lui seul la contraction du quadriceps." },
                            { name: "Isométrique quadriceps à 0°", dose: "5 × 10 sec", tip: "Allongé sur le dos, jambe opérée tendue, un coussin roulé sous la cheville. Écrasez le genou vers le lit en contractant l'avant de la cuisse, tenez, puis relâchez complètement. La rotule doit remonter légèrement." },
                            { name: "Flexion limitée à 90°", dose: "3 × 10", tip: "Assis au bord d'un lit, jambe soutenue par l'autre. Pliez le genou jusqu'à l'angle droit, pas au-delà, puis retendez. Cette limite n'est pas une précaution de confort : au-delà de 90°, le ménisque se comprime et la suture est mise en tension." },
                            { name: "Appui protégé selon les consignes", dose: "selon consignes chirurgicales", tip: "La mise en charge après suture est souvent partielle et sous attelle pendant plusieurs semaines. Respectez à la lettre le poids autorisé et le port de l'attelle : c'est la contrainte qui conditionne toute la suite." }
                        ] },
                    { label: "Récupération de la mobilité", critere: "Vous retrouvez la flexion autorisée sans douleur en fin de course, vous marchez sans cannes et sans boiter, et le genou ne regonfle plus en fin de journée.", sub: "4 à 8 semaines", exercises: [
                            { name: "Récupération progressive de la flexion", dose: "3 × 15", tip: "Assis au bord d'un lit, laissez la jambe descendre sous son propre poids, puis aidez-vous de l'autre jambe pour accompagner la flexion. Progressez de quelques degrés par séance, sans jamais forcer dans la douleur." },
                            { name: "Sevrage progressif des cannes", dose: "selon consignes", tip: "Le passage à l'appui complet se fait selon le protocole du chirurgien, pas sur simple ressenti. Lâchez d'abord une canne, gardez l'autre du côté opéré quelques jours, puis abandonnez-la quand la marche est sans boiterie." },
                            { name: "Vélo sans résistance", dose: "10-15 min", tip: "Vélo d'appartement, selle haute, résistance nulle. Commencez par des demi-tours de pédale d'avant en arrière si le tour complet ne passe pas encore. Le pédalage doit rester totalement indolore." },
                            { name: "Mobilisation active-assistée", dose: "3 × 15", tip: "Assis au bord d'un lit ou allongé. Pliez et tendez le genou en vous aidant des mains sous la cuisse ou d'une serviette passée sous le mollet, lentement, en gagnant quelques degrés de séance en séance." }
                        ] },
                    { label: "Renforcement en amplitude limitée", critere: "Vous faites vos squats dans l'amplitude autorisée sans douleur ni blocage, et le genou reste sec le lendemain.", sub: "2 à 4 mois", exercises: [
                            { name: "Squats contrôlés en amplitude limitée", dose: "3 × 12", tip: "Debout, dos éventuellement contre un mur. Descendez jusqu'à l'amplitude autorisée seulement, marquez un temps, puis remontez. Gagnez quelques degrés par semaine plutôt que d'un coup : c'est la profondeur, pas la charge, qui sollicite la suture." },
                            { name: "Presse à une jambe (amplitude progressive)", dose: "3 × 12", tip: "Sur une presse, une seule jambe. Commencez sur une amplitude courte et une charge légère, puis augmentez d'abord la charge, ensuite l'amplitude. Mouvement lent dans les deux sens." },
                            { name: "Renforcement de la chaîne postérieure", dose: "3 × 12", tip: "Pont fessier puis hanche en charnière. Une chaîne postérieure forte reprend une part du travail à chaque pas et allège d'autant l'appui sur le ménisque." },
                            { name: "Renforcement du mollet", dose: "3 × 15", tip: "Debout, mains en appui léger sur un mur. Montez sur la pointe des deux pieds en 2 secondes, marquez un temps en haut, puis redescendez en 3 secondes sans laisser le talon tomber." }
                        ] },
                    { label: "Renforcement avancé & proprioception", critere: "Vous tenez 30 secondes en équilibre sur la jambe opérée, vous faites 10 squats sur cette seule jambe genou aligné avec le pied, et l'accroupissement ne provoque ni blocage ni douleur au fond.", sub: "4 à 5 mois", exercises: [
                            { name: "Équilibre unipodal sur surface instable", dose: "3 × 30 sec", tip: "Debout sur une jambe, sur un coussin ou un plateau, genou légèrement fléchi et aligné avec le pied. Cherchez à limiter les oscillations plutôt qu'à tenir coûte que coûte, un appui à portée de main." },
                            { name: "Réintroduction progressive de la flexion profonde", dose: "3 × 10", tip: "Debout, descendez un peu plus bas qu'aux séances précédentes, en gagnant quelques degrés par semaine. C'est ici que l'accroupissement se réapprend : progressivement, et seulement avec l'accord du chirurgien." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds. Alignez chevilles, bassin et épaules, serrez les abdominaux sans creuser le bas du dos, et continuez à respirer normalement pendant tout le maintien." },
                            { name: "Renforcement excentrique du quadriceps", dose: "3 × 12", tip: "Debout ou à la presse, sur la jambe opérée. Freinez la descente en 3 secondes, puis remontez normalement, en vous aidant de l'autre jambe si besoin. C'est la phase freinée qui redonne au quadriceps sa capacité à encaisser." }
                        ] },
                    { label: "Course & réathlétisation", critere: "Vous courez 20 à 30 minutes sans douleur ni gonflement, et vous réceptionnez un saut sur une jambe en restant stable.", sub: "5 à 7 mois", exercises: [
                            { name: "Reprise progressive de la course", dose: "selon plan de reprise", tip: "Alternance marche / course d'abord, sur sol régulier, puis course continue. Augmentez le volume avant la vitesse, et une seule variable à la fois d'une semaine à l'autre." },
                            { name: "Pliométrie légère", dose: "3 × 10", tip: "Debout, pieds largeur du bassin. Enchaînez de petits sauts sur place, sans chercher la hauteur : l'objectif est d'amortir chaque réception genoux légèrement fléchis, avec un contact au sol silencieux." },
                            { name: "Fentes profondes contrôlées", dose: "3 × 10", tip: "Debout, un grand pas en avant, descendez le genou arrière vers le sol en gardant le buste droit, puis remontez en poussant sur la jambe avant. À n'aborder que si la flexion complète est autorisée." },
                            { name: "Squats sautés légers", dose: "3 × 8", tip: "Depuis un demi-squat, sautez et amortissez la réception genoux fléchis. Arrêtez immédiatement en cas de sensation d'accrochage ou de blocage : ce n'est pas une douleur d'effort." }
                        ] },
                    { label: "Retour au sport avec pivots", critere: "Les pivots et l'accroupissement complet en charge ne réveillent ni douleur ni blocage, la force est comparable des deux côtés, et le délai fixé par votre chirurgien est écoulé. Une suture méniscale demande plus de patience qu'une ablation : le délai prime sur la sensation.", sub: "6 à 9 mois", exercises: [
                            { name: "Rotation contrôlée du genou en charge", dose: "3 × 10", tip: "Debout en appui sur la jambe opérée, genou légèrement fléchi, pied fixe au sol. Tournez lentement le bassin d'un côté puis de l'autre, sur une faible amplitude. Le pivot pied bloqué est le geste le plus à risque pour un ménisque suturé : il se réintroduit en dernier, et lentement." },
                            { name: "Pivots et changements de direction progressifs", dose: "4 × 10", tip: "Course sur quelques mètres, arrêt franc, pivot, relance dans une autre direction. Commencez lentement sur sol stable, augmentez la vitesse d'une série à l'autre, et gardez le genou aligné à chaque appui." },
                            { name: "Sauts avec réception et pivot", dose: "3 × 8", tip: "Saut vers l'avant, réception sur une jambe, puis pivot immédiat d'un quart de tour. Figez brièvement à la réception avant de pivoter. À faire sous surveillance à ce stade." },
                            { name: "Tests de saut unipodal", dose: "protocole en cabinet", tip: "Série de sauts unipodaux mesurés (saut en longueur, triple saut, saut latéral), réalisés sur chaque jambe et comparés. On vise généralement au moins 90 % de la performance du côté sain avant de valider une reprise." }
                        ] }
                ] },
            { id: "menisque-ablation", label: "Ménisque — méniscectomie ou lésion non opérée", groupe: "Après une opération", desc: "Après ablation partielle du ménisque, ou lésion prise en charge sans chirurgie.", context: "Ici rien n'a besoin de cicatriser : la partie lésée a été retirée, ou bien elle n'a pas été opérée. La progression se règle donc sur les symptômes et non sur un calendrier, et elle est nettement plus rapide qu'après une suture. Un point mérite d'être connu : pour une lésion dégénérative sans blocage vrai, la rééducation seule donne des résultats comparables à l'arthroscopie — ne pas être opéré n'est pas un pis-aller. En revanche, un genou qui se bloque franchement ou qui reste coincé en flexion justifie un avis chirurgical.", stages: [
                    { label: "Douleur & mobilité", critere: "Le genou se tend et plie sans blocage ni accrochage, et le gonflement a disparu.", sub: "Genou encore gonflé ou douloureux", exercises: [
                            { name: "Contrôle de la douleur et de l'œdème", dose: "plusieurs fois par jour", tip: "Glace une quinzaine de minutes plusieurs fois par jour, jambe surélevée. Un genou gonflé inhibe la contraction du quadriceps : faire baisser l'épanchement est le préalable au renforcement." },
                            { name: "Isométrique quadriceps à 0°", dose: "5 × 10 sec", tip: "Allongé sur le dos, jambe tendue, un coussin roulé sous la cheville. Écrasez le genou vers le lit en contractant l'avant de la cuisse, tenez, puis relâchez complètement. La rotule doit remonter légèrement." },
                            { name: "Mobilité active du genou", dose: "3 × 15", tip: "Assis au bord d'un lit, jambe pendante. Tendez le genou puis laissez-le se replier sous son propre poids, lentement, sur toute l'amplitude indolore. Récupérer l'extension complète est prioritaire sur la flexion." },

                    { label: "Renforcement", critere: "Vous montez et descendez un escalier sans douleur, et vous tenez le squat partiel sans que le genou proteste le lendemain.", sub: "Douleur qui s'apaise, mobilité qui revient", exercises: [

                            { name: "Presse à une jambe (amplitude progressive)", dose: "3 × 12", tip: "Sur une presse, une seule jambe. Commencez sur une amplitude courte et une charge légère, puis augmentez d'abord la charge, ensuite l'amplitude. Mouvement lent dans les deux sens." },

                    { label: "Contrôle moteur & charge dynamique", critere: "Vous descendez d'une marche sur une seule jambe genou aligné, et vous vous accroupissez sans douleur au fond ni sensation de blocage.", sub: "Peu de douleur au quotidien", exercises: [

            { id: "arthrose-genou", label: "Arthrose", groupe: "Usure de l'articulation", desc: "Usure progressive du cartilage, douleur mécanique à l'effort ou raideur qui évolue avec le temps plutôt qu'après un traumatisme précis.", context: "Contrairement à une idée très répandue, bouger n'use pas davantage une articulation arthrosique : l'exercice est aujourd'hui le traitement de première intention recommandé, avant les médicaments et bien avant la chirurgie. Le renforcement du quadriceps est le levier le plus efficace sur la douleur et la fonction. L'intensité des douleurs et l'aspect des radiographies sont par ailleurs souvent mal corrélés : un genou très arthrosique à l'image peut fonctionner correctement s'il est bien musclé.", checkinKind: "binary", stages: [

                            { name: "Pompes de cheville", dose: "3 × 15", tip: "Allongé ou assis, jambe surélevée. Montez et descendez la pointe du pied de façon répétée et rythmée : cela favorise la circulation et soulage l'articulation." },
                            { name: "Isométrique quadriceps doux", dose: "5 × 10 sec", tip: "Assis ou allongé, jambe tendue. Contractez doucement le muscle à l'avant de la cuisse, sans bouger la jambe, à faible intensité — cela entretient la force sans mobiliser le genou." },
                            { name: "Mobilisation de la rotule", dose: "2 × 1 min", tip: "Assis, jambe tendue et détendue. Mobilisez doucement la rotule du bout des doigts, dans toutes les directions, pour entretenir sa mobilité." },
                            { name: "Étirement quadriceps doux", dose: "3 × 20 sec", tip: "Debout en appui, ou allongé sur le côté, ramenez doucement le talon vers la fesse jusqu'à sentir une tension légère à l'avant de la cuisse. Tension douce uniquement." },
                            { name: "Vélo sans résistance", dose: "5-10 min", tip: "Favorise la mobilité de l'articulation sans la charger. Réglez la selle pour que le genou reste peu fléchi en bas du pédalage." }

                    { label: "Renforcement musculaire", critere: "Vous vous levez d'une chaise sans vous aider des bras, vous montez un étage sans douleur marquée, et vous marchez plus loin qu'il y a un mois. Il n'y a pas de fin à atteindre ici : c'est l'entretien du renforcement qui préserve les gains.", sub: "Non, peu ou pas de douleur", exercises: [

                            { name: "Équilibre unipodal", dose: "3 × 30 sec", tip: "Debout sur une jambe, l'autre légèrement fléchie devant vous, à proximité d'un appui si besoin. Restez stable, yeux ouverts puis fermés si bien toléré." }

                stageGuidance: [

            { id: "femoro-patellaire-genou", label: "Syndrome fémoro-patellaire", groupe: "Par répétition ou surcharge", desc: "Douleur diffuse à l'avant du genou, autour ou derrière la rotule, typiquement déclenchée par les escaliers (surtout la descente), la position assise prolongée jambes pliées, ou l'accroupissement.", context: "L'élément le mieux établi ici est que le renforcement combiné hanche et genou donne de meilleurs résultats que le renforcement du genou seul, en particulier sur la douleur à court terme. Les exercices se réalisent dans une amplitude qui reste sous le seuil douloureux : on augmente la charge avant d'augmenter l'amplitude. Le terme ancien de « chondromalacie » est aujourd'hui abandonné, car la douleur n'est pas corrélée à l'état du cartilage.", stages: [

                            { name: "Squat mural maintenu (amplitude non douloureuse)", dose: "5 × 30 sec", tip: "Dos contre un mur, genoux fléchis à un angle où vous ne ressentez pas de douleur (souvent autour de 30-45°). Maintenez la position sans chercher à descendre plus bas." },
                            { name: "Isométrique des abducteurs de hanche", dose: "5 × 30 sec chaque côté", tip: "Allongé sur le côté, jambe du dessus tendue et légèrement levée, maintenue. Un déficit de contrôle de la hanche est l'un des facteurs les mieux documentés dans ce syndrome." },
                            { name: "Adaptation des positions du quotidien", dose: "quotidien", tip: "Limitez temporairement la position assise prolongée genoux très pliés et la descente d'escaliers rapide : ce sont les deux situations qui chargent le plus l'arrière de la rotule." }

                    { label: "Renforcement", critere: "Vous tenez les exercices de fessiers et de quadriceps sans douleur, et vous montez un escalier sans gêne à l'avant du genou.", exercises: [
                            { name: "Squat lent en amplitude non douloureuse", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout, pieds largeur du bassin, pointes légèrement ouvertes. Descendez en 3 secondes jusqu'à l'angle juste avant l'apparition de la douleur, marquez un temps, remontez en 3 secondes. Ajoutez de la charge plutôt que de l'amplitude : c'est la profondeur qui comprime la rotule." },
                            { name: "Abduction de hanche en charge", dose: "4 × 10 chaque côté", tip: "Debout ou allongé sur le côté, élastique ou poids à la cheville. Mouvement lent, bassin stable — combiner renforcement de hanche et de genou donne de meilleurs résultats que le genou seul." },
                            { name: "Presse ou fente en amplitude limitée", dose: "4 × 8", tip: "Sur une presse, pied à plat au milieu du plateau, ou en fente avant. Restez sur une amplitude courte au départ, genou aligné avec le pied du début à la fin. Augmentez la charge d'abord, l'amplitude ensuite." },

                    { label: "Contrôle moteur", critere: "Vous descendez d'une marche sur une seule jambe sans que le genou parte vers l'intérieur, et sans douleur. C'est l'alignement qui compte ici, plus que la force pure.", exercises: [

                            { name: "Équilibre unipodal avec contrôle du genou", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, veillez à ce que le genou reste aligné avec le pied, sans partir vers l'intérieur." },

                            { name: "Fentes contrôlées", dose: "3 × 10 chaque côté", tip: "Debout, un grand pas en avant, mains sur les hanches. Descendez le genou arrière vers le sol en gardant le buste droit, puis remontez en poussant sur la jambe avant. Contrôlez surtout la remontée, et vérifiez que le genou avant ne part pas vers l'intérieur." }

                    { label: "Retour à l'activité", critere: "Vous reprenez course ou vélo sans douleur pendant ni le lendemain, et la position assise prolongée ne réveille plus rien.", exercises: [

            { id: "ptg", label: "Prothèse totale de genou", groupe: "Après une opération", desc: "Rééducation après pose d'une prothèse de genou, étape par étape selon le délai depuis l'opération.", surgical: true, context: "Ce parcours a une priorité qui domine tout le reste dans les premières semaines : récupérer l'extension complète. Un genou prothétique qui ne se tend pas complètement le restera, et modifiera durablement la marche — c'est la séquelle la plus fréquente et la plus évitable. La flexion vient ensuite, et elle se travaille tôt : si elle stagne sous 90° vers la sixième semaine, il faut le signaler rapidement à votre chirurgien, car la fenêtre pour agir est limitée. Le gonflement et la sensation de chaleur persistent souvent plusieurs mois : c'est habituel après cette intervention, et ce n'est pas un signe d'échec.", stages: [

                            { name: "Activation du quadriceps", dose: "5 × 10", tip: "Jambe tendue, contractez la cuisse comme pour écraser un coussin sous le genou et tenez 5 secondes. Le quadriceps s'inhibe très vite après cette chirurgie, et c'est le premier à réveiller." },

                    { label: "Mobilité et marche", critere: "Vous pliez le genou à 100° ou plus, il se tend complètement, et vous marchez à l'intérieur sans canne sans boiter franchement.", sub: "2 à 6 semaines", exercises: [

                            { name: "Vélo d'appartement sans résistance", dose: "10 min", tip: "Selle haute au début, en faisant des demi-tours de pédalier si le tour complet ne passe pas encore. C'est le meilleur outil pour gagner de la flexion sans forcer." },

                            { name: "Abduction de hanche à l'élastique", dose: "3 × 15", tip: "Debout, élastique placé juste au-dessus des chevilles. Écartez la jambe sur le côté contre la résistance, en gardant le buste stable, puis revenez lentement." },
                            { name: "Pont fessier", dose: "3 × 12", tip: "Allongé sur le dos, genoux pliés. Levez le bassin en gainant les abdominaux et en serrant les fessiers, puis redescendez lentement." },
                            { name: "Renforcement fessiers léger (coquille)", dose: "3 × 12", tip: "Allongé sur le côté, jambes légèrement pliées l'une sur l'autre. Levez le genou du dessus vers le plafond en gardant les pieds joints, sans faire rouler le bassin vers l'arrière." },
                            { name: "Squat fonctionnel (assis-debout)", dose: "3 × 12", tip: "Debout devant une chaise, descendez lentement jusqu'à effleurer l'assise, puis repoussez pour vous relever, sans vous laisser tomber." },
                            { name: "Montée sur step", dose: "3 × 10 chaque jambe", tip: "Face à une marche ou un step bas, montez en poussant sur une jambe, sans élan, puis redescendez lentement du même côté." },
                            { name: "Équilibre unipodal", dose: "3 × 30 sec", tip: "Debout sur une jambe, l'autre légèrement fléchie devant vous, à proximité d'un appui si besoin. Restez stable, yeux ouverts puis fermés si bien toléré." }
                        ] }
                ],
                stageGuidance: [
                    { freq: "Idéalement chaque jour, en douceur", duration: "Ces exercices doivent apaiser la douleur, jamais l'augmenter. Repassez en renforcement dès que l'articulation se calme." },
                    { freq: "2 à 3 fois par semaine", duration: "Un rythme régulier, sans épuiser l'articulation, permet de construire la force progressivement." },
                ] },
            { id: "moyen-fessier", label: "Tendinopathie du moyen fessier", groupe: "Par répétition ou surcharge", desc: "Douleur sur le côté de la hanche, au niveau de l'os saillant, plus marquée en position allongée sur ce côté, en montant les escaliers ou en appui prolongé sur une jambe.", context: "Le mécanisme clé est la compression du tendon contre l'os saillant de la hanche, et non un simple frottement. Cela explique que certaines positions très banales — croiser les jambes, dormir sur le côté douloureux, se tenir debout en appui sur une hanche — entretiennent les symptômes plus que l'activité elle-même. La prise en charge combine donc l'adaptation de ces positions et un renforcement progressif en évitant les amplitudes qui compriment.", stages: [
                    { label: "Douleur & décharge", critere: "Vous dormez sans être réveillé par la douleur sur le côté de la hanche, et rester debout en appui sur une jambe ne la réveille plus. Vous avez pris l'habitude d'éviter les positions qui compriment le tendon : jambes croisées, appui sur une hanche.", exercises: [
                            { name: "Isométrique des abducteurs en position neutre", dose: "5 × 30 sec", tip: "Allongé sur le dos, genoux pliés, un élastique passé autour des cuisses juste au-dessus des genoux. Écartez les genoux vers l'extérieur contre l'élastique et tenez la poussée, sans bouger le bassin. Les deux côtés travaillent en même temps. Hanche en position neutre, jamais ramenée vers l'intérieur : c'est ce qui évite de comprimer le tendon contre l'os, contrairement à la position allongée sur le côté à ce stade." },
                            { name: "Isométrique des fessiers (pont maintenu)", dose: "5 × 30 sec", tip: "Allongé sur le dos, genoux pliés, pieds à plat. Serrez les fessiers d'abord, puis montez le bassin jusqu'à aligner genoux, hanches et épaules. Tenez sans creuser le bas du dos : c'est le fessier qui doit brûler, pas les lombaires." },
                            { name: "Adaptation des positions du quotidien", dose: "quotidien", tip: "Évitez pour l'instant de croiser les jambes, de dormir sur le côté douloureux sans coussin entre les genoux, et de rester longtemps en appui sur une seule hanche « hanchée » vers l'extérieur : ces positions compriment le tendon contre l'os et entretiennent la douleur." },
                            { name: "Marche courte à allure modérée", dose: "10 min", tip: "Allure régulière plutôt que très lente : une allure trop lente accentue le temps passé en position de compression à chaque appui." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices d'abduction sans douleur, et monter un escalier ne réveille plus le côté de la hanche.", exercises: [
                            { name: "Abduction de hanche en charge, lente", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout, élastique au-dessus des chevilles. Écartez la jambe sur le côté en 3 secondes, revenez en 3 secondes, sans jamais ramener la jambe au-delà de l'axe du corps (pas d'adduction complète, qui comprime le tendon)." },
                            { name: "Pont fessier unipodal", dose: "4 × 8 chaque côté", tip: "Allongé sur le dos, un pied au sol, l'autre jambe tendue vers le plafond. Montez le bassin en gardant les deux hanches à la même hauteur. C'est la bascule du bassin, et non la hauteur atteinte, qui indique la limite." },
                            { name: "Step-up latéral contrôlé", dose: "4 × 8 chaque côté", tip: "De profil à une marche basse, montez en poussant sur la jambe la plus proche de la marche, puis redescendez lentement, sans laisser le bassin partir sur le côté." },
                            { name: "Renforcement du moyen fessier en amplitude limitée", dose: "3 × 12 chaque côté", tip: "Allongé sur le côté sain, jambe du dessus légèrement en arrière de l'axe du corps. Levez-la de quelques centimètres seulement, sans monter haut : l'amplitude excessive comprime le tendon plutôt que de le renforcer." }
                        ] },
                    { label: "Contrôle moteur & charge dynamique", critere: "Vous tenez 30 secondes en appui sur la jambe concernée sans que le bassin bascule, et sans douleur.", exercises: [
                            { name: "Équilibre unipodal avec bassin stabilisé", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, veillez à ce que le bassin reste horizontal, sans s'affaisser du côté de la jambe levée." },
                            { name: "Squat unipodal partiel", dose: "3 × 8 chaque côté", tip: "Sur une jambe, appui à proximité si besoin, descendez sur une faible amplitude en gardant le genou aligné avec le pied, puis remontez." },
                            { name: "Montée de marche dynamique", dose: "4 × 10 chaque côté", tip: "Face à une marche, pied entier posé dessus. Montez en poussant uniquement sur cette jambe, sans élan de l'autre, puis redescendez en freinant la descente. Surveillez que le genou ne parte pas vers l'intérieur." },
                            { name: "Fentes latérales contrôlées", dose: "3 × 10 chaque côté", tip: "Grand pas sur le côté, genou fléchi aligné avec le pied, puis repoussez pour revenir au centre sans dépasser l'axe du corps." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous marchez longuement, montez les escaliers et reprenez votre activité sans réveil de la douleur le lendemain, et les nuits restent calmes.", exercises: [
                            { name: "Reprise progressive de la marche et des escaliers", dose: "quotidien", tip: "Augmentez progressivement la distance de marche et la fréquence des escaliers, en surveillant la douleur du lendemain plutôt que celle du moment." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Poursuivez l'abduction en charge et le step-up au moins deux fois par semaine sur le long terme : c'est ce qui protège le mieux de la récidive." },
                            { name: "Reprise des terrains variés", dose: "1 séance", tip: "Réintroduisez progressivement les terrains inégaux ou en dévers, qui sollicitent davantage la stabilisation latérale de hanche." },
                            { name: "Validation fonctionnelle", dose: "bilan", tip: "Un équilibre unipodal prolongé sans affaissement du bassin, des deux côtés, est un bon repère avant de reprendre une activité complète." }
                        ] }
                ] },
            { id: "conflit-femoro-acetabulaire", label: "Conflit fémoro-acétabulaire", groupe: "Par répétition ou surcharge", desc: "Douleur à l'aine, souvent décrite en forme de « C » sur le côté de la hanche, déclenchée par la flexion profonde, le pivot ou la position assise prolongée. Fréquent chez les jeunes sportifs pratiquant des sports de pivot ou de flexion répétée (football, danse, hockey).", context: "Il s'agit d'un contact anormal entre le fémur et le bord de la cavité de la hanche en fin d'amplitude. Point important : la forme osseuse en cause est très fréquente chez des sportifs qui n'ont aucune douleur — ce n'est donc pas l'anatomie seule qui fait le symptôme, mais la charge qui lui est appliquée. La rééducation, en renforçant les stabilisateurs profonds et en gérant les amplitudes, est recommandée avant d'envisager une chirurgie.", stages: [
                    { label: "Douleur & décharge", critere: "Les positions de flexion profonde de hanche ne déclenchent plus la douleur vive à l'aine, et vous restez assis longtemps sans gêne.", exercises: [
                            { name: "Isométrique des fléchisseurs de hanche en amplitude modérée", dose: "5 × 30 sec chaque côté", tip: "Assis, genou levé contre une résistance (votre main ou une table), sans aller vers la flexion complète qui reproduit le conflit. Contractez sans bouger la jambe." },
                            { name: "Isométrique des abducteurs et fessiers", dose: "5 × 30 sec chaque côté", tip: "Allongé sur le côté, jambe douloureuse au-dessus et tendue dans l'axe du corps. Levez-la de quelques centimètres seulement et tenez sans bouger : la contraction doit se sentir sur le côté de la hanche et dans la fesse, du côté travaillé. Le bassin ne roule pas vers l'arrière, et la cuisse ne vient jamais vers la poitrine — c'est cette position qui reproduit le conflit." },
                            { name: "Adaptation des amplitudes du quotidien", dose: "quotidien", tip: "Évitez temporairement les positions de flexion de hanche prononcée (s'asseoir très bas, croiser les jambes serré, accroupissement profond) : ce sont les amplitudes qui reproduisent le conflit osseux entre le fémur et le bassin." },
                            { name: "Mobilité douce hors zone de conflit", dose: "3 × 10", tip: "Allongé sur le dos, mobilisez la hanche dans les amplitudes qui restent confortables (rotation légère, extension douce), sans chercher la flexion maximale à ce stade." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices de fessiers sans douleur à l'aine, et vous marchez sans limitation.", exercises: [
                            { name: "Renforcement des rotateurs profonds de hanche", dose: "4 × 10 chaque côté", tip: "Assis, genoux pliés à 90°, élastique autour des chevilles. Écartez les pieds vers l'extérieur en gardant les genoux joints, contre la résistance. Ces muscles profonds stabilisent la tête fémorale dans l'articulation." },
                            { name: "Abduction de hanche en charge", dose: "4 × 10 chaque côté", tip: "Debout ou allongé sur le côté, élastique ou poids à la cheville. Mouvement lent, sans aller chercher l'amplitude maximale." },
                            { name: "Pont fessier bipodal puis unipodal", dose: "4 × 10", tip: "Allongé sur le dos, genoux pliés. Montez le bassin en serrant les fessiers, en restant dans une amplitude de hanche modérée." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds. Alignez chevilles, bassin et épaules, serrez les abdominaux sans creuser le bas du dos, et respirez normalement. Un tronc stable réduit les compensations qui viennent surcharger la hanche." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous faites un squat dans l'amplitude confortable en gardant le bassin stable, sans pincement à l'aine.", exercises: [
                            { name: "Squat en amplitude contrôlée (non maximale)", dose: "4 × 10", tip: "Descendez jusqu'à l'angle où vous ne ressentez pas le conflit à l'aine, genoux alignés avec les pieds, sans chercher à descendre plus bas pour l'instant." },
                            { name: "Fentes contrôlées en amplitude modérée", dose: "3 × 10 chaque côté", tip: "Debout, un pas en avant de taille modérée, mains sur les hanches. Descendez le genou arrière vers le sol en gardant le buste droit, puis remontez. Restez volontairement court sur l'amplitude : c'est la flexion de hanche poussée, du côté avant, qui provoque le conflit." },
                            { name: "Équilibre unipodal avec contrôle du bassin", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, veillez à ce que le bassin reste stable et horizontal, sans compensation en rotation." },
                            { name: "Rotation contrôlée de hanche en charge modérée", dose: "3 × 10 chaque côté", tip: "Debout, en appui, réalisez une légère rotation du bassin sur la jambe d'appui, amplitude progressive, en restant sous le seuil du conflit." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez votre activité sans pincement à l'aine pendant ni le lendemain. Si une position précise reste douloureuse malgré tout, elle est à réévaluer avec votre kinésithérapeute plutôt qu'à forcer.", exercises: [
                            { name: "Réintroduction progressive de la flexion profonde", dose: "chaque semaine", tip: "Augmentez très progressivement l'amplitude de flexion et de pivot travaillée, séance après séance, plutôt que de revenir directement au geste sportif complet." },
                            { name: "Gestes de pivot spécifiques à faible intensité", dose: "3 × 8", tip: "Reproduisez le geste de pivot ou de changement de direction de votre sport, à vitesse réduite, en surveillant l'apparition du conflit." },
                            { name: "Maintien du renforcement des rotateurs et abducteurs", dose: "2 × par semaine", tip: "Ce renforcement se poursuit sur le long terme : c'est ce qui permet à la hanche de mieux tolérer les amplitudes sportives extrêmes sans réveiller le conflit." },
                            { name: "Reprise sportive progressive et encadrée", dose: "selon plan", tip: "Réintégration par étapes du geste complet (pivot, flexion profonde, contact), idéalement validée avec votre kinésithérapeute avant un retour en compétition." }
                        ] }
                ] },
            { id: "pth", label: "Prothèse totale de hanche", groupe: "Après une opération", desc: "Rééducation après pose d'une prothèse de hanche, étape par étape selon le délai depuis l'opération.", surgical: true, context: "Deux choses commandent ce parcours. D'abord, les consignes de votre chirurgien priment sur tout le reste : les positions à éviter dépendent de la voie d'abord utilisée, et elles ne sont pas les mêmes d'un patient à l'autre. Gardez la fiche remise à la sortie à portée de main. Ensuite, la reprise d'appui et de marche est précoce avec une prothèse — c'est le mouvement, pas le repos, qui fait le résultat. La récupération se joue sur plusieurs mois, et le renforcement des fessiers en est le moteur : c'est lui qui fait disparaître la boiterie.", stages: [
                    { label: "Premiers jours", critere: "Vous vous levez et marchez avec votre aide de marche sans assistance, la douleur au repos est contrôlée, et vous connaissez les positions à éviter indiquées par votre chirurgien.", sub: "0 à 2 semaines", exercises: [
                            { name: "Contractions du quadriceps et des fessiers", dose: "5 × 10", tip: "Allongé, jambe tendue : contractez la cuisse comme pour écraser un coussin sous le genou, puis serrez les fessiers. Ces contractions sans mouvement relancent le muscle très tôt, sans solliciter la prothèse." },
                            { name: "Pompes de cheville", dose: "3 × 20", tip: "Montez et descendez la pointe du pied de façon rythmée, plusieurs fois par jour. La contraction du mollet agit comme une pompe et limite le risque de phlébite." },
                            { name: "Marche avec aide de marche", dose: "quotidien", tip: "Marchez avec le déambulateur ou les cannes selon la consigne du chirurgien : un peu et souvent, plutôt que longtemps et rarement. Avec une prothèse, la reprise d'appui est précoce." },
                            { name: "Respect des consignes de position", dose: "quotidien", tip: "Votre chirurgien vous a indiqué les positions à éviter selon la voie d'abord utilisée. Elles priment sur tout ce que vous pourrez lire ailleurs, y compris ici : en cas de doute, appelez son secrétariat plutôt que de deviner." }
                        ] },
                    { label: "Marche et autonomie", critere: "Vous marchez à l'intérieur sans canne ou avec une seule, sans boiter franchement, et vous montez un escalier en alternant les pieds.", sub: "2 à 6 semaines", exercises: [
                            { name: "Abduction de hanche allongé sur le côté", dose: "3 × 12", tip: "Allongé sur le côté non opéré, jambe du dessus tendue dans l'axe du corps : levez-la de quelques centimètres sans laisser le bassin basculer vers l'arrière. Le moyen fessier est le muscle qui fait disparaître la boiterie." },
                            { name: "Extension de hanche debout", dose: "3 × 12", tip: "Debout face à un plan de travail, ramenez la jambe vers l'arrière sans cambrer le bas du dos. Amplitude faible, contrôle maximal." },
                            { name: "Sevrage progressif des cannes", dose: "selon tolérance", tip: "Passez de deux cannes à une, puis à aucune, en intérieur d'abord. Gardez une canne à l'extérieur tant que la marche n'est pas stable : c'est la boiterie, pas la douleur, qui décide." },
                            { name: "Montée et descente d'escalier", dose: "quotidien", tip: "Formule à retenir : la jambe non opérée monte en premier, la jambe opérée descend en premier. Tenez la rampe tant que ce n'est pas automatique." }
                        ] },
                    { label: "Renforcement", critere: "Vous vous levez d'une chaise basse sans vous aider des bras, vous marchez 20 à 30 minutes sans boiter, et vous tenez 20 secondes en appui sur la jambe opérée sans que le bassin bascule.", sub: "6 à 12 semaines", exercises: [
                            { name: "Abduction de hanche à l'élastique", dose: "3 × 12", tip: "Debout, élastique autour des chevilles : écartez la jambe latéralement en gardant le tronc droit, sans vous pencher du côté opposé." },
                            { name: "Assis-debout répétés", dose: "3 × 12", tip: "Depuis une chaise de hauteur normale, levez-vous sans vous aider des bras et rasseyez-vous en contrôlant la descente. Baissez progressivement la hauteur du siège." },
                            { name: "Montée sur step", dose: "3 × 10", tip: "Montez sur une marche basse en poussant sur la jambe opérée, puis redescendez lentement. Augmentez la hauteur quand le mouvement est fluide." },
                            { name: "Marche progressive", dose: "20 à 30 min", tip: "Augmentez la durée avant l'allure. C'est le volume de marche régulier qui construit l'endurance de la hanche." }
                        ] },
                    { label: "Contrôle et endurance", critere: "Vous marchez une heure sans douleur ni boiterie, vous tenez 30 secondes en équilibre sur la jambe opérée, et les escaliers se font sans y penser.", sub: "3 à 6 mois", exercises: [
                            { name: "Équilibre unipodal", dose: "3 × 30 sec", tip: "Debout sur la jambe opérée, appui à portée de main. Cherchez à limiter les oscillations plutôt qu'à tenir coûte que coûte." },
                            { name: "Pas chassés et changements de direction lents", dose: "3 × 10", tip: "Déplacements latéraux contrôlés sur quelques mètres. On réintroduit les changements de direction progressivement, jamais en force." },
                            { name: "Vélo ou natation", dose: "2 à 3 × par semaine", tip: "Activités portées, idéales à ce stade : elles construisent l'endurance sans imposer d'impact à la prothèse." },
                            { name: "Maintien du renforcement des fessiers", dose: "3 × par semaine", tip: "À poursuivre bien au-delà de la disparition de la boiterie : c'est l'arrêt précoce qui la fait revenir." }
                        ] },
                    { label: "Vie courante et loisirs", critere: "Vous avez repris vos activités habituelles sans douleur ni boiterie, et validé avec votre chirurgien celles qui demandent son accord. À ce stade il n'y a plus de parcours à terminer, seulement un entretien à maintenir.", sub: "6 mois et plus", exercises: [
                            { name: "Reprise des activités de loisir", dose: "selon avis du chirurgien", tip: "Marche, vélo, natation et golf sont habituellement encouragés. Les sports d'impact répété et les sports de pivot se discutent avec votre chirurgien : ils sollicitent davantage la prothèse." },
                            { name: "Entretien du renforcement", dose: "2 × par semaine", tip: "Quelques exercices de fessiers et de cuisses, à vie. C'est le meilleur investissement pour la longévité du résultat." },
                            { name: "Surveillance du poids et de l'activité", dose: "continu", tip: "Le poids porté est la contrainte principale d'une prothèse de hanche. L'activité régulière et le maintien du poids comptent autant que les exercices." },
                            { name: "Suivi régulier de la prothèse", dose: "selon le plan du chirurgien", tip: "Une prothèse se surveille dans le temps, même sans douleur. Honorez les consultations de contrôle prévues, y compris quand tout va bien." }
                        ] }
                ] }
        ] },
    { id: "epaule", label: "Épaule", injuries: [
            { id: "coiffe", label: "Tendinopathie de la coiffe", groupe: "Par répétition ou surcharge", desc: "Douleur progressive en levant le bras ou en dormant sur l'épaule, apparue sans choc particulier, souvent gênante pour les gestes au-dessus de la tête.", context: "Le renforcement progressif de la coiffe des rotateurs donne des résultats comparables à la chirurgie dans la majorité des tendinopathies non rompues, ce qui en fait le traitement de première intention. Deux idées à corriger : le repos complet aggrave l'enraidissement, et la douleur ressentie pendant l'exercice n'est pas synonyme de dégradation tant qu'elle reste modérée et retombe dans les 24 h. L'évolution demande souvent 3 mois ou plus.", stages: [
                    { label: "Douleur & mobilité", critere: "Vous levez le bras devant vous jusqu'à l'horizontale sans douleur vive, et les nuits sont redevenues calmes.", exercises: [
                            { name: "Pendulaires de Codman", dose: "3 × 1 min", tip: "Penché en avant, appui de la main valide sur une table, bras douloureux relâché dans le vide. Laissez-le décrire de petits cercles en utilisant le mouvement du corps, sans contracter l'épaule : le but est de mobiliser sans effort actif." },
                            { name: "Mobilisation passive en élévation", dose: "3 × 10", tip: "Assis ou allongé sur le dos, tenez un bâton à deux mains, bras tendus. Utilisez le bras sain pour pousser le bras douloureux vers le haut, lentement, jusqu'à la limite confortable. Entretenir l'amplitude évite l'enraidissement, principal risque de cette phase." },
                            { name: "Étirement de la capsule postérieure", dose: "3 × 30 sec", tip: "Debout ou assis, épaule basse et relâchée. Ramenez le bras tendu horizontalement devant la poitrine et tirez-le vers vous avec l'autre avant-bras, jusqu'à sentir une tension à l'arrière de l'épaule. Gardez l'omoplate plaquée contre le thorax : si elle décolle, l'étirement se perd. La raideur postérieure est très fréquente et limite le mouvement au-dessus de la tête." },
                            { name: "Adaptation temporaire des gestes du quotidien", dose: "quotidien", tip: "Limitez temporairement les gestes répétés au-dessus de la tête et le port de charge à bout de bras. Éviter la contrainte excessive ne veut pas dire immobiliser : continuez à utiliser le bras dans les amplitudes confortables." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les rotations à l'élastique sans douleur, et vous levez le bras au-dessus de la tête sans esquive de l'épaule.", exercises: [
                            { name: "Rotation externe à l'élastique", dose: "4 × 12", tip: "Debout, coude plié à 90° et collé contre le corps, élastique en main. Écartez l'avant-bras vers l'extérieur comme pour ouvrir une porte, sans décoller le coude, puis revenez lentement. Exercice central du renforcement de la coiffe." },
                            { name: "Élévation latérale sous 90°", dose: "3 × 12", tip: "Debout, bras le long du corps, léger poids en main. Levez le bras sur le côté jusqu'à hauteur d'épaule au maximum, coude légèrement fléchi, puis redescendez lentement en contrôlant la descente." },
                            { name: "Rétraction des omoplates", dose: "3 × 15", tip: "Assis ou debout, bras le long du corps, épaules relâchées vers le bas. Rapprochez les omoplates l'une de l'autre comme pour tenir un crayon entre elles, tenez 2 secondes, puis relâchez. Les épaules ne doivent pas monter vers les oreilles. Le contrôle de l'omoplate conditionne l'espace disponible pour les tendons de la coiffe." },
                            { name: "Renforcement progressif en charge", dose: "4 × 8 (3 sec / 3 sec)", tip: "Debout, coude collé au corps et fléchi à 90°, élastique fixé à hauteur de coude du côté opposé. Tournez l'avant-bras vers l'extérieur en 3 secondes, revenez en 3 secondes. Choisissez la résistance pour que la 8e répétition soit difficile. C'est la progression de charge qui fait évoluer un tendon, pas la répétition à charge constante." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous levez et redescendez le bras lentement sans que l'omoplate décolle ni que l'épaule remonte vers l'oreille.", exercises: [
                            { name: "Stabilité en appui mural", dose: "3 × 10", tip: "Debout face à un mur, mains à plat à hauteur d'épaule. Transférez doucement votre poids d'un bras sur l'autre en gardant les omoplates stables et plaquées." },
                            { name: "Coordination épaule-omoplate chargée légère", dose: "3 × 10", tip: "Debout, un poids léger en main, bras le long du corps. Levez le bras lentement sur le côté jusqu'à hauteur d'épaule en laissant l'omoplate tourner avec le mouvement, puis redescendez encore plus lentement. Si l'épaule monte vers l'oreille, la charge est trop lourde." },
                            { name: "Proprioception sur ballon", dose: "3 × 30 sec", tip: "Debout face à un mur, main posée sur un petit ballon appuyé contre le mur, bras tendu. Faites de petits cercles avec le ballon en gardant le bras stable." },
                            { name: "Renforcement au-dessus de 90°", dose: "3 × 10", tip: "Debout, un poids léger en main. Une fois le travail sous l'horizontale bien toléré, montez le bras au-delà de la hauteur d'épaule, devant vous d'abord puis sur le côté, lentement dans les deux sens. Gardez les côtes basses plutôt que de cambrer pour aller plus haut. C'est l'amplitude à récupérer en priorité pour le quotidien." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez les gestes au-dessus de la tête — étendre du linge, ranger en hauteur, votre sport — sans douleur pendant ni la nuit suivante.", exercises: [
                            { name: "Lancers progressifs légers", dose: "3 × 10", tip: "Debout, pieds décalés, face à un mur à quelques mètres. Lancez un ballon léger sans forcer, en laissant les jambes et le tronc participer au geste. Augmentez la distance d'abord, la vitesse ensuite — jamais les deux dans la même séance." },
                            { name: "Mouvements au-dessus de la tête chargés", dose: "3 × 10", tip: "Debout, un poids léger en main. Montez le bras au-dessus de la tête comme pour ranger un objet sur une étagère haute, lentement et sur toute l'amplitude tolérée, puis redescendez en freinant. Gardez les côtes basses : cambrer le dos pour gagner de la hauteur fausse l'exercice." },
                            { name: "Geste spécifique du sport ou du travail", dose: "1 séance", tip: "Reprise encadrée et progressive du geste réel, à faible volume d'abord." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Poursuivez la rotation externe et le travail scapulaire plusieurs mois : la récidive est fréquente quand le renforcement s'arrête dès la disparition de la douleur." }
                        ] }
                ] },
            { id: "instabilite", label: "Instabilité / luxation", groupe: "Après un traumatisme", desc: "L'épaule est déjà sortie de son logement, ou vous la sentez « partir » dans certaines positions, avec une appréhension quand le bras est levé et tourné vers l'extérieur.", context: "Après une luxation, le risque de récidive dépend fortement de l'âge : il est élevé chez le sujet jeune et sportif, plus faible après 40 ans. La rééducation vise à compenser activement la stabilité passive perdue, en renforçant la coiffe et les stabilisateurs de l'omoplate. Point clé : la position combinant bras levé sur le côté et rotation vers l'extérieur est celle du risque — on l'aborde progressivement, jamais brutalement, et l'appréhension ressentie est un signal à respecter.", stages: [
                    { label: "Douleur & mobilité", critere: "Le bras bouge sans douleur dans les amplitudes autorisées, et vous respectez les limites fixées après l'épisode, notamment bras écarté et tourné vers l'arrière : c'est la position où l'épaule est le plus vulnérable.", exercises: [
                            { name: "Pendulaires de Codman", dose: "3 × 1 min", tip: "Penché en avant, bras relâché, petits cercles obtenus par le mouvement du corps. Restez dans les amplitudes basses, sans jamais aller vers la position d'armé du bras." },
                            { name: "Mobilisation douce sans amplitude extrême", dose: "3 × 10", tip: "Mobilisez l'épaule dans les amplitudes confortables, en évitant de combiner bras levé sur le côté et rotation vers l'extérieur : c'est cette combinaison précise qui expose au risque de nouvelle luxation." },
                            { name: "Étirement doux des pectoraux", dose: "3 × 20 sec", tip: "Debout dans l'encadrement d'une porte, avant-bras contre le montant, coude à hauteur d'épaule. Avancez légèrement le corps jusqu'à une tension douce à l'avant de l'épaule, sans forcer." },
                            { name: "Activation de la coiffe en position basse", dose: "5 × 30 sec", tip: "Coude collé au corps, poussez doucement l'avant-bras vers l'extérieur contre une résistance fixe, sans bouger. Réactive les stabilisateurs actifs dans une position sûre, loin de la zone à risque." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices de rotateurs et de stabilisateurs de l'omoplate sans douleur ni sensation de dérobement.", exercises: [
                            { name: "Rotation interne à l'élastique", dose: "4 × 15", tip: "Debout, coude plié à 90° collé au corps, élastique fixé sur le côté. Ramenez l'avant-bras vers le ventre contre la résistance, coude toujours collé, puis revenez lentement." },
                            { name: "Rotation externe à l'élastique", dose: "4 × 15", tip: "Debout, coude collé au corps et fléchi à 90°, élastique tenu dans la main du côté à travailler et fixé devant vous. Ouvrez l'avant-bras vers l'extérieur contre la résistance, sans décoller le coude, puis revenez lentement. Les rotateurs externes sont les stabilisateurs actifs les plus directement protecteurs contre le déplacement vers l'avant." },
                            { name: "Renforcement du deltoïde antérieur", dose: "3 × 12", tip: "Debout, léger poids en main, levez le bras tendu vers l'avant jusqu'à hauteur d'épaule au maximum, puis redescendez lentement." },
                            { name: "Gainage scapulaire", dose: "3 × 15", tip: "Debout ou en appui sur les mains, maintenez l'omoplate stable et plaquée contre le dos pendant toute la durée de l'exercice. Une omoplate mal contrôlée réduit la stabilité de l'ensemble de l'épaule." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous contrôlez le bras en position écartée sans appréhension, et l'épaule ne donne plus l'impression de vouloir partir.", exercises: [
                            { name: "Stabilité en chaîne fermée", dose: "3 × 10", tip: "Debout face à un mur, mains à plat à hauteur d'épaule, maintenez un appui stable en contrôlant tout mouvement de l'omoplate. La main fixe sur un support est une situation intrinsèquement plus sûre pour une épaule instable." },
                            { name: "Perturbations manuelles légères", dose: "3 × 10", tip: "En appui contre un mur, faites-vous appliquer de légères poussées imprévisibles sur le bras. Idéalement guidé par votre kinésithérapeute au départ." },
                            { name: "Proprioception en position progressive", dose: "3 × 20 sec", tip: "Rapprochez-vous prudemment, séance après séance, de la position à risque (bras levé sur le côté et tourné vers l'extérieur). Ne forcez jamais si une appréhension apparaît : c'est un signal à respecter, pas à dépasser." },
                            { name: "Renforcement scapulaire en charge", dose: "3 × 12", tip: "Assis ou debout, élastique fixé devant vous à hauteur de poitrine. Tirez les coudes vers l'arrière en rapprochant les omoplates, épaules basses, puis revenez en freinant le retour. Augmentez la résistance quand 12 répétitions deviennent faciles." }
                        ] },
                    { label: "Retour au sport", critere: "Vous armez le bras et lancez sans appréhension, la force est comparable des deux côtés, et la sensation d'instabilité a disparu. L'appréhension est ici le critère décisif : tant qu'elle persiste, l'épaule n'est pas prête, même si la force l'est.", exercises: [
                            { name: "Renforcement en position de risque", dose: "3 × 10", tip: "Renforcement léger dans la position bras levé et tourné vers l'extérieur, avec une charge très progressive. Objectif : que cette position redevienne à la fois forte et non appréhendée." },
                            { name: "Gestes spécifiques du sport", dose: "1 séance", tip: "Réintégration progressive du geste réel, d'abord sans opposition ni vitesse maximale." },
                            { name: "Reprise sportive encadrée", dose: "1 séance", tip: "Les sports de contact et les gestes d'armé complet se réintroduisent en dernier, idéalement après validation avec votre kinésithérapeute." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Le renforcement de la coiffe et de l'omoplate se poursuit sur le long terme : c'est la compensation active qui protège durablement une épaule dont la stabilité passive reste diminuée." }
                        ] }
                ] },
            { id: "epaule-sportif", label: "Épaule du sportif (handball)", groupe: "Par répétition ou surcharge", desc: "Douleur ou gêne à l'épaule du bras qui tire, sans choc franc — fréquente chez les lanceurs et handballeurs.", context: "L'épaule du lanceur présente des adaptations propres : une rotation externe augmentée et une rotation interne diminuée du côté dominant, ce qui est normal, mais devient un facteur de risque quand la perte d'amplitude interne dépasse le gain externe. Deux leviers ressortent des études sur les sports de lancer : le travail de la raideur postérieure et le renforcement excentrique des rotateurs externes. La mobilité du haut du dos, souvent négligée, conditionne aussi directement l'amplitude disponible à l'épaule.", stages: [
                    { label: "Mobilité & décompression", critere: "La rotation vers l'intérieur s'est améliorée du côté du lancer, et lever le bras ne provoque plus de pincement.", exercises: [
                            { name: "Étirement en sommeil (sleeper stretch)", dose: "3 × 30 sec", tip: "Allongé sur le côté de l'épaule douloureuse, bras à 90° devant vous, coude plié à 90°. Avec l'autre main, poussez doucement l'avant-bras vers le sol jusqu'à sentir un étirement à l'arrière de l'épaule. Cible la raideur postérieure très fréquente chez les lanceurs." },
                            { name: "Étirement croisé (cross-body stretch)", dose: "3 × 30 sec", tip: "Debout ou assis, ramenez le bras horizontalement devant la poitrine à l'aide de l'autre bras, jusqu'à sentir un étirement à l'arrière de l'épaule." },
                            { name: "Mobilisation thoracique associée", dose: "3 × 10", tip: "Assis, bras croisés. Tournez lentement le haut du dos d'un côté puis de l'autre : la mobilité du haut du dos influence directement celle de l'épaule chez le lanceur." },
                            { name: "Suivi de l'amplitude de rotation", dose: "chaque semaine", tip: "Comparez la rotation de vos deux épaules, bras à 90°. Une perte de rotation interne du côté dominant nettement supérieure au gain en rotation externe est le profil le plus associé aux douleurs du lanceur : c'est ce que le travail de mobilité cherche à corriger." }
                        ] },
                    { label: "Contrôle scapulaire", critere: "Vous tenez les exercices sans que l'omoplate décolle, et vous maintenez le bras à l'horizontale sans compensation.", exercises: [
                            { name: "Poinçon du serratus (serratus punch)", dose: "3 × 15", tip: "Allongé sur le dos, bras tendu vers le plafond. Poussez le poing vers le plafond en décollant l'omoplate du sol, sans plier le coude, puis relâchez." },
                            { name: "Y-T-W à plat ventre", dose: "3 × 10 par lettre", tip: "Allongé sur le ventre, front posé, bras tendus. Formez successivement un Y, un T puis un W avec les bras, en les levant légèrement et en serrant les omoplates, sans hausser les épaules." },
                            { name: "Tirage bas de l'omoplate (lower trap)", dose: "3 × 12", tip: "Élastique fixé en hauteur, tenu à deux mains. Tirez les coudes vers le bas et l'arrière, comme pour ranger les omoplates dans vos poches arrière." },
                            { name: "Contrôle de l'omoplate en élévation", dose: "3 × 10", tip: "Debout de profil devant un miroir, bras le long du corps. Levez lentement le bras devant vous jusqu'au-dessus de la tête en surveillant l'épaule : elle ne doit pas monter vers l'oreille, c'est l'omoplate qui doit tourner. Le rythme entre bras et omoplate est souvent perturbé chez le lanceur douloureux." }
                        ] },
                    { label: "Renforcement excentrique de la coiffe", critere: "Vous tenez le travail excentrique des rotateurs sans douleur pendant ni le lendemain.", exercises: [
                            { name: "Excentrique des rotateurs externes", dose: "3 × 15", tip: "Coude au corps à 90°, élastique en main, bras tourné vers l'extérieur. Résistez lentement (3-4 secondes) pendant que le bras revient vers l'intérieur : le travail en freinage est ce qui protège le plus la coiffe des rotateurs chez les lanceurs, d'après les études sur les sports de lancer." },
