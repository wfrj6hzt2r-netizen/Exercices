            { id: "fibulaires", label: "Tendinopathie des fibulaires", groupe: "Douleur du bord externe", desc: "Douleur derrière ou sous la malléole externe de la cheville, souvent après une augmentation d'activité, une entorse mal rééduquée, ou la course sur terrain en dévers.", context: "Ces tendons freinent activement la torsion du pied vers l'intérieur : ils sont donc très sollicités après une entorse, quand la cheville est moins stable, et sur les terrains en dévers. Comme pour toute tendinopathie, le repos complet n'est pas la solution : c'est le renforcement progressif, notamment excentrique, qui restaure la tolérance du tendon. Rechercher une instabilité de cheville associée fait partie du traitement, sans quoi la récidive est probable.", stages: [
                    { label: "Douleur & décharge", critere: "La douleur sur le bord externe de la cheville ne se réveille plus à la marche, et pousser le pied vers l'extérieur est possible sans douleur vive.", exercises: [
                            { name: "Isométrique des éverseurs", dose: "5 × 30 sec chaque côté", tip: "Assis, poussez le bord externe du pied vers l'extérieur contre une résistance fixe (mur, main), sans bouger la cheville. Effet antalgique utile en phase irritative." },
                            { name: "Mobilité douce de cheville", dose: "3 × 15", tip: "Assis, jambe surélevée et relâchée. Montez et descendez la pointe du pied sur toute l'amplitude disponible, puis décrivez de larges cercles dans un sens et dans l'autre, sans forcer en fin de course." },
                            { name: "Adaptation temporaire du terrain de course", dose: "quotidien", tip: "Évitez temporairement les terrains en dévers ou très irréguliers, qui sollicitent fortement les tendons fibulaires en éversion répétée." },
                            { name: "Automassage le long des fibulaires", dose: "2 × 1 min", tip: "Assis, jambe relâchée. Avec le pouce ou une balle, remontez lentement le long du bord externe de la jambe, de la cheville vers le genou, en pression modérée. Évitez d'appuyer directement sur l'os." }
                        ] },
                    { label: "Renforcement excentrique", critere: "Vous tenez le travail excentrique sans dépasser 3/10 ni réveil le lendemain.", exercises: [
                            { name: "Excentrique des éverseurs à l'élastique", dose: "3 × 15 chaque côté", tip: "Élastique fixé du côté interne, pied en éversion. Résistez lentement (3-4 secondes) pendant que le pied revient vers l'intérieur, en freinant le mouvement." },
                            { name: "Montée sur pointe genou tendu", dose: "3 × 15", tip: "Debout, appui léger des mains sur un mur, genoux tendus. Montez lentement sur la pointe des deux pieds, puis redescendez en 3 secondes. Passez sur une seule jambe quand la version à deux pieds devient facile." },
                            { name: "Renforcement en charge sur surface instable", dose: "3 × 12 chaque côté", tip: "Debout sur un coussin ou une surface souple, réalisez de petits mouvements d'éversion contrôlée du pied d'appui." },
                            { name: "Renforcement du mollet", dose: "3 × 15", tip: "Debout, appui léger sur un mur. Faites une série genoux tendus, une autre genoux légèrement fléchis : la première sollicite le muscle superficiel, la seconde le muscle profond, et les deux sont nécessaires." }
                        ] },
                    { label: "Charge dynamique", critere: "Vous sautillez et changez d'appui sans douleur sur le bord externe, et la force pour pousser le pied vers l'extérieur paraît comparable des deux côtés.", exercises: [
                            { name: "Équilibre unipodal dynamique", dose: "3 × 30 sec chaque côté", tip: "Debout sur une jambe, ajoutez un léger mouvement de bras ou de tête une fois la position stable maîtrisée." },
                            { name: "Sautillements légers bipodaux", dose: "4 × 15", tip: "Debout, poids sur l'avant-pied, chevilles toniques. Petits rebonds sur place, sans que les talons touchent le sol. La réception doit rester silencieuse tout au long de la série." },
                            { name: "Marche rapide puis trottinement sur terrain plat", dose: "10 min", tip: "Reprise progressive de l'appui répété, en restant strictement sous le seuil de douleur." },
                            { name: "Renforcement maintenu en charge", dose: "2 × par semaine", tip: "Poursuivez le travail excentrique du stade 2 en parallèle de la reprise de charge." }
                        ] },
                    { label: "Retour au sport", critere: "Vous courez sur terrain irrégulier et changez de direction sans réveil de la douleur le lendemain.", exercises: [
                            { name: "Course progressive sur terrain plat", dose: "selon plan", tip: "Alternance marche/course puis course continue, sur surface plane et stable en priorité." },
                            { name: "Réintroduction prudente des terrains en dévers", dose: "à partir de la semaine 4-5", tip: "Ce sont les surfaces les plus provocantes pour ce tendon : à réintroduire en dernier, par blocs courts." },
                            { name: "Changements de direction", dose: "4 × 15 m", tip: "Course sur une vingtaine de mètres avec un changement de direction franc au milieu. Augmentez la vitesse d'une série à l'autre, en commençant sur sol régulier." },
                            { name: "Validation fonctionnelle", dose: "bilan", tip: "Une course sur terrain irrégulier sans douleur ni sensation d'instabilité est un bon repère avant la reprise complète." }
                        ] }
                ] },
            { id: "coussinet", label: "Syndrome du coussinet adipeux", groupe: "Douleur du talon", desc: "Douleur sourde et profonde au centre du talon, pire pieds nus sur sol dur ou après une longue station debout, sans la douleur vive des premiers pas du matin.", context: "Sous votre talon se trouve un coussin de graisse compartimenté, qui amortit chaque pas. Avec les années, les impacts répétés ou une station debout prolongée, il s'amincit et perd de son élasticité : l'os appuie alors plus directement sur le sol à chaque appui. Ce n'est pas une fasciite plantaire, et c'est important : c'est la deuxième cause de douleur du talon, elle est régulièrement confondue avec la première, et le traitement n'est pas le même. Trois repères la distinguent. La douleur siège au « centre » du talon, pas sur son bord interne. Elle est pire pieds nus sur un sol dur ou après être resté longtemps debout, alors que la fasciite fait surtout mal aux premiers pas du matin puis s'atténue en marchant. Et étirer le fascia ne la soulage pas, voire l'aggrave. Ici, l'essentiel du traitement est de remettre de l'amortissement sous le talon et de renforcer ce qui absorbe le choc en amont. C'est plus lent qu'une fasciite, et la régularité compte plus que l'intensité.", stages: [
                    { label: "Décharge et amortissement", critere: "Vous marchez une demi-heure avec vos talonnettes sans que la douleur s'installe, et rester debout à faire la vaisselle ne la réveille plus.", exercises: [
                            { name: "Talonnette amortissante", dose: "en permanence", tip: "Placez une talonnette en gel ou en silicone dans vos deux chaussures, y compris à la maison. C'est la mesure qui soulage le plus vite : elle remplace temporairement l'amortissement que votre coussinet n'assure plus." },
                            { name: "Bannir les pieds nus sur sol dur", dose: "tous les jours", tip: "Carrelage, parquet, béton : mettez des chaussons amortissants dès le lever. C'est souvent la source principale de la douleur, et la plus facile à supprimer." },
                            { name: "Réduction de la station debout prolongée", dose: "cette semaine", tip: "Fractionnez : asseyez-vous quelques minutes toutes les demi-heures plutôt que de tenir une heure d'affilée. C'est la durée d'appui continue qui écrase le coussinet, plus que la distance parcourue." },
                            { name: "Mobilité douce de la cheville", dose: "3 × 15", tip: "Montez et descendez la pointe du pied, dessinez des cercles. On entretient la circulation et la mobilité sans imposer d'impact au talon." }
                        ] },
                    { label: "Renforcer ce qui amortit en amont", critere: "Vous tenez les montées sur pointe sans douleur au talon, et une journée normale ne laisse plus qu'une gêne légère le soir.", exercises: [
                            { name: "Montée sur pointe des deux pieds", dose: "3 × 15", tip: "Debout, montez sur la pointe et redescendez lentement, sans laisser le talon claquer au sol. Un mollet fort absorbe une part du choc avant qu'il n'arrive au talon." },
                            { name: "Renforcement des muscles du pied", dose: "3 × 15", tip: "Pieds nus assis, creusez la voûte en rapprochant la base des orteils du talon, sans les recroqueviller. Ces petits muscles participent à l'amortissement de chaque appui." },
                            { name: "Renforcement des fessiers et des cuisses", dose: "3 × 12", tip: "Pont fessier et assis-debout. Plus la jambe encaisse haut, moins le talon reçoit bas." },
                            { name: "Marche en terrain souple", dose: "20 min", tip: "Gazon, chemin de terre, piste. On garde l'activité en choisissant les surfaces qui rendent une partie de l'énergie au lieu de la renvoyer dans le talon." }
                        ] },
                    { label: "Reprise de la charge", critere: "Vous marchez une heure sur sol dur, chaussé, sans réveil de la douleur le lendemain, et vous avez réduit l'épaisseur de la talonnette sans que la gêne revienne.", exercises: [
                            { name: "Allongement progressif de la marche", dose: "selon tolérance", tip: "Augmentez d'environ dix minutes par semaine, sur terrain souple d'abord puis sur sol dur. Un seul changement à la fois : durée ou surface, jamais les deux." },
                            { name: "Réduction progressive de la talonnette", dose: "chaque semaine", tip: "Diminuez l'épaisseur par paliers. Si la douleur revient, restez une semaine de plus au palier précédent : le coussinet a besoin de temps pour retrouver de la tolérance." },
                            { name: "Sautillements légers", dose: "3 × 15", tip: "Petits sautillements sur avant-pied, sur surface souple. On réhabitue le talon aux impacts, très progressivement et jamais talon en premier." },
                            { name: "Maintien du renforcement", dose: "3 × par semaine", tip: "Mollet, pied, fessiers. C'est ce travail qui rend la talonnette progressivement inutile." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous avez repris vos activités habituelles, y compris pieds nus à la maison, sans réapparition de la douleur. Comptez plusieurs mois : le coussinet se répare lentement, et il vieillit avec vous.", exercises: [
                            { name: "Reprise complète des activités", dose: "selon votre plan", tip: "Station debout prolongée, marche longue, sport : réintroduisez-les une par une, en surveillant la gêne du lendemain plutôt que celle du moment." },
                            { name: "Chaussage durablement amortissant", dose: "en continu", tip: "Gardez des chaussures à semelle épaisse et souple, et remplacez-les dès qu'elles s'écrasent. Une semelle morte fait revenir la douleur plus sûrement qu'une journée de trop." },
                            { name: "Entretien du renforcement", dose: "2 × par semaine", tip: "Mollet et muscles du pied, durablement. C'est le seul amortissement que vous pouvez encore améliorer." },
                            { name: "Surveillance du poids et des surfaces", dose: "en continu", tip: "Chaque kilo se retrouve sous le talon à chaque pas, et le béton ne pardonne pas. Ce sont les deux leviers qui restent quand le coussinet est aminci." }
                        ] }
                ] }
        ] },
    { id: "cervical", label: "Rachis cervical", injuries: [
            { id: "cervicalgie", label: "Cervicalgie commune", groupe: "Douleur limitée au cou", desc: "Douleur ou raideur de la nuque apparue progressivement, sans choc, souvent liée à la posture de travail ou au stress.", context: "L'imagerie est rarement utile dans une cervicalgie commune : les anomalies visibles sur les radios ou IRM sont très fréquentes chez des personnes sans aucune douleur, et n'expliquent généralement pas les symptômes. Ce qui fonctionne, c'est l'association d'un renforcement des fléchisseurs profonds du cou et du travail des muscles de l'omoplate, poursuivi dans la durée. Rester actif et continuer à bouger la nuque donne de meilleurs résultats que le repos ou le port prolongé d'un collier.", stages: [
                    { label: "Douleur & mobilité", critere: "Vous tournez la tête des deux côtés sans blocage, et la douleur ne descend pas dans le bras.", exercises: [
                            { name: "Rotations cervicales douces", dose: "3 × 10", tip: "Assis ou debout, tournez lentement la tête d'un côté puis de l'autre sur l'amplitude confortable. Bouger tôt et régulièrement vaut mieux que d'immobiliser la nuque par crainte de la douleur." },
                            { name: "Inclinaisons latérales douces", dose: "3 × 10", tip: "Amenez doucement l'oreille vers l'épaule, sans hausser l'épaule ni forcer en fin de mouvement, puis revenez et changez de côté." },
                            { name: "Rétraction du menton", dose: "3 × 10", tip: "Assis, regard droit devant, reculez le menton horizontalement comme pour faire un double menton, sans baisser la tête, puis relâchez. Active spécifiquement les muscles profonds stabilisateurs du cou." },
                            { name: "Relâchement des trapèzes", dose: "3 × 1 min", tip: "Assis, épaules basses et relâchées. Respirez lentement en laissant consciemment se relâcher les muscles entre le cou et les épaules à chaque expiration." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices des fléchisseurs profonds sans réveil de la douleur, et une journée de travail ne raidit plus la nuque comme avant.", exercises: [
                            { name: "Isométrique fléchisseurs profonds", dose: "5 × 10 sec", tip: "Assis, tête droite, deux doigts posés sur le front. Poussez doucement le front contre les doigts comme pour rentrer le menton, sans que la tête ne bouge d'un millimètre. Maintien court volontairement : sur une nuque irritée, on réactive sans fatiguer." },
                            { name: "Renforcement extenseurs cervicaux", dose: "3 × 12", tip: "Une main à l'arrière du crâne pour créer une légère résistance. Poussez la tête vers l'arrière contre la main sur une petite amplitude, puis revenez, sans forcer ni bloquer la respiration." },
                            { name: "Renforcement scapulaire associé", dose: "3 × 15", tip: "Rapprochez les omoplates l'une de l'autre comme pour tenir un crayon entre elles, sans hausser les épaules. Le travail de l'omoplate est indissociable de celui de la nuque : les deux se renforcent ensemble." },
                            { name: "Renforcement des trapèzes inférieurs", dose: "3 × 12", tip: "Élastique fixé en hauteur, tenu à deux mains. Tirez les coudes vers le bas et l'arrière, comme pour ranger les omoplates dans vos poches arrière. Contrebalance la tendance à hausser les épaules." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous gardez la tête stable pendant les mouvements des bras, et vous conduisez en tournant la tête sans appréhension.", exercises: [
                            { name: "Repérage visuel cervical", dose: "3 × 10", tip: "Assis, tête immobile et regard droit devant. Déplacez lentement les yeux vers la droite, revenez au centre, puis vers la gauche, sans que la tête ne suive. Vérifiez l'immobilité de la tête avec une main posée dessus." },
                            { name: "Coordination oculo-céphalique", dose: "3 × 10", tip: "D'abord bougez uniquement les yeux, tête immobile ; puis à l'inverse, tournez la tête en gardant le regard fixé sur le même point. Cette dissociation est souvent perturbée dans les cervicalgies persistantes." },
                            { name: "Endurance posturale assise", dose: "3 × 1 min", tip: "Assis, dos décollé du dossier : oreilles au-dessus des épaules, épaules basses et ouvertes, menton légèrement rentré. Maintenez sans crisper, en respirant normalement." },
                            { name: "Proprioception cervicale (repositionnement)", dose: "3 × 10", tip: "Face à un point fixe sur un mur, repérez-le bien, fermez les yeux, tournez légèrement la tête puis essayez de revenir exactement face au point avant de rouvrir les yeux." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous reprenez toutes vos activités, écran compris, sans que la nuque se raidisse en fin de journée. La posture parfaite n'existe pas : c'est de varier les positions qui protège, plus que d'en tenir une bonne.", exercises: [
                            { name: "Mobilité complète en charge fonctionnelle", dose: "3 × 10", tip: "Reproduisez un mouvement utile au quotidien — regarder par-dessus l'épaule comme pour reculer en voiture, lever la tête vers une étagère — en amplitude complète et sans appréhension." },
                            { name: "Renforcement global cervico-scapulaire", dose: "3 × 15", tip: "Assis, dos droit, une main posée sur le côté ou l'arrière de la tête. Poussez la tête contre la main sans mouvement, tout en tirant simultanément les omoplates vers le bas et l'arrière. Augmentez la résistance progressivement : nuque et omoplates se renforcent ensemble, jamais isolément." },
                            { name: "Aménagement du poste de travail", dose: "quotidien", tip: "Écran à hauteur des yeux, avant-bras soutenus, et surtout des pauses régulières pour changer de position : c'est l'immobilité prolongée, plus que la posture elle-même, qui entretient les symptômes." },
                            { name: "Maintien du renforcement d'entretien", dose: "2 × par semaine", tip: "Poursuivez le travail des fléchisseurs profonds et des omoplates dans la durée : c'est ce qui réduit le mieux le risque de récidive, très fréquente dans les cervicalgies." }
                        ] }
                ] },
            { id: "whiplash", label: "Torticolis / coup du lapin", groupe: "Douleur limitée au cou", desc: "Blocage brutal de la nuque au réveil, ou douleur apparue après un choc ou un mouvement brusque.", context: "Après un traumatisme cervical, un point est bien établi : reprendre le mouvement tôt donne de meilleurs résultats que l'immobilisation ou le port prolongé d'un collier. Rassurer et remettre en mouvement fait partie du traitement, car l'appréhension et l'évitement des mouvements entretiennent la raideur. Un choc violent, une douleur intense, des troubles neurologiques ou une gêne à la déglutition justifient en revanche un avis médical avant tout exercice.", stages: [
                    { label: "Douleur & mobilité", critere: "Le blocage s'est desserré : vous tournez la tête nettement plus loin qu'au premier jour, et vous n'avez plus besoin de collier.", exercises: [
                            { name: "Mobilisation très douce", dose: "3 × 10", tip: "Tournez très doucement la tête d'un côté puis de l'autre, et inclinez l'oreille vers l'épaule, sur une amplitude volontairement réduite, bien en dessous de ce qui provoque une gêne. L'objectif est de bouger un peu et souvent, pas d'aller loin." },
                            { name: "Relâchement musculaire", dose: "3 × 1 min", tip: "Assis ou allongé confortablement, épaules basses. Respirez lentement par le nez, expirez longuement par la bouche en laissant se relâcher cou et épaules à chaque expiration." },
                            { name: "Auto-massage doux du trapèze", dose: "2 × 1 min", tip: "Avec les doigts de la main opposée, pressez doucement le muscle entre le cou et l'épaule en réalisant de petits cercles, sans chercher à appuyer fort." },
                            { name: "Reprise précoce des activités douces", dose: "quotidien", tip: "Continuez vos activités habituelles adaptées plutôt que de rester immobile. La reprise précoce du mouvement est associée à une meilleure récupération que le repos ou le collier prolongé." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices de renforcement doux sans réveil de la douleur, et les gestes du quotidien se font sans appréhension.", exercises: [
                            { name: "Isométrique léger multidirectionnel", dose: "5 × 10 sec", tip: "Assis, tête droite. Poussez très légèrement la main contre le front, puis l'arrière du crâne, puis chaque tempe, sans que la tête ne bouge. Maintien court volontairement : sur une nuque irritée, on cherche à réactiver le muscle sans le fatiguer." },
                            { name: "Renforcement progressif fléchisseurs profonds", dose: "3 × 10", tip: "Allongé sur le dos ou assis contre un dossier, menton légèrement rentré comme pour faire un double menton. Posez deux doigts sur le front et poussez la tête contre eux sans que rien ne bouge. Augmentez très progressivement l'intensité et la durée d'une séance à l'autre." },
                            { name: "Renforcement scapulaire", dose: "3 × 12", tip: "Rapprochez les omoplates l'une de l'autre sans hausser les épaules, maintenez quelques secondes puis relâchez." },
                            { name: "Renforcement des extenseurs en amplitude progressive", dose: "3 × 12", tip: "Main derrière le crâne en résistance légère, poussez la tête vers l'arrière sur une amplitude qui augmente au fil des séances, sans jamais forcer en fin de mouvement." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous tournez la tête rapidement, par exemple pour reculer en voiture, sans crainte ni douleur.", exercises: [
                            { name: "Rééducation oculo-motrice", dose: "3 × 10", tip: "Poursuite visuelle lente d'un objet qui se déplace, tête immobile. Les troubles de coordination œil-tête sont fréquents après un traumatisme cervical." },
                            { name: "Proprioception cervicale (repositionnement)", dose: "3 × 10", tip: "Face à un point fixe, repérez-le, fermez les yeux, tournez la tête, puis revenez face au point avant de rouvrir les yeux pour vérifier votre précision." },
                            { name: "Équilibre postural global", dose: "3 × 30 sec", tip: "Debout, pieds écartés largeur du bassin, près d'un appui. Maintenez l'équilibre immobile, puis en tournant légèrement la tête si c'est facile." },
                            { name: "Coordination oculo-céphalique", dose: "3 × 10", tip: "Yeux qui bougent seuls tête fixe, puis tête qui bouge regard fixe. Restaure la dissociation entre le mouvement des yeux et celui de la nuque." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous avez repris vos activités habituelles sans éviter aucun mouvement. L'évitement entretient la raideur davantage que la lésion elle-même : c'est le retour au mouvement normal qui signe la guérison.", exercises: [
                            { name: "Renforcement fonctionnel complet", dose: "3 × 12", tip: "Assis, dos droit. Enchaînez rotations, inclinaisons oreille vers l'épaule, puis flexion-extension, en opposant à chaque fois une légère résistance de la main sans empêcher le mouvement. Allez cette fois en amplitude complète : c'est la synthèse de tout ce qui a été travaillé." },
                            { name: "Endurance posturale prolongée", dose: "3 × 1 min", tip: "Oreilles au-dessus des épaules, épaules basses et ouvertes, menton légèrement rentré, maintenu plus longtemps qu'aux étapes précédentes." },
                            { name: "Reprise des activités quotidiennes et du sport", dose: "1 séance", tip: "Progressive selon la tolérance, en réintroduisant en dernier les activités avec impacts ou mouvements brusques de la tête." },
                            { name: "Réassurance et gestion de l'appréhension", dose: "quotidien", tip: "Bouger la nuque n'aggrave pas la lésion : l'évitement des mouvements par crainte est l'un des facteurs qui entretiennent le plus la raideur et la douleur dans la durée." }
                        ] }
                ] },
            { id: "ncb-c5", label: "Névralgie cervico-brachiale C5", groupe: "Douleur qui descend dans le bras", desc: "Douleur qui descend du cou vers l'épaule et la face externe du bras, sans atteindre les doigts, avec parfois une difficulté à lever le bras sur le côté.", context: "Une racine nerveuse sort de votre cou entre deux vertèbres, puis descend dans le bras. Quand elle est comprimée ou irritée à sa sortie, la douleur ne reste pas dans le cou : elle descend le long du trajet du nerf, ici l'épaule et la face externe du bras, sans descendre jusqu'aux doigts. C'est ce trajet, plus que l'intensité, qui dit quelle racine est en cause. Deux choses à savoir avant de commencer. D'abord, l'évolution est favorable dans la grande majorité des cas : environ trois patients sur quatre récupèrent sans chirurgie, et à distance neuf sur dix vont bien ou n'ont plus qu'une gêne légère. Ensuite, le repère qui compte n'est pas que la douleur diminue, mais qu'elle « remonte » : si elle quitte la main pour se limiter à l'épaule ou au cou, vous allez dans le bon sens, même si le cou est plus douloureux sur le moment. C'est ce qu'on appelle la centralisation, et c'est elle qui guide tout le parcours. Les exercices commencent par des mouvements de glissement du nerf, qui le font coulisser sans l'étirer : mesurés, ils déplacent le nerf deux fois plus qu'une mise en tension tout en lui imposant huit fois moins de contrainte. La mise en tension viendra plus tard, quand le nerf sera calmé. Le muscle à surveiller pour cette racine est le deltoïde, celui qui lève le bras sur le côté, et le nerf principalement sollicité par les exercices est l'ensemble du plexus, sans nerf isolé dominant.", stages: [
                    { label: "Calmer et faire remonter la douleur", critere: "La douleur a quitté la main ou l'avant-bras pour se limiter à l'épaule et au cou, et vous dormez la plupart des nuits. C'est cette remontée qui compte, même si le cou reste plus douloureux qu'avant.", exercises: [
                            { name: "Position de soulagement du bras", dose: "aussi souvent que nécessaire", tip: "Posez l'avant-bras sur un coussin, main plus haute que le coude, épaule légèrement relevée vers l'oreille. Certains sont soulagés main posée sur le sommet du crâne : si c'est votre cas, utilisez-la sans crainte, c'est un bon signe." },
                            { name: "Glissement du nerf, version très douce", dose: "3 × 8 lents", tip: "Assis, bras douloureux légèrement écarté du corps, coude fléchi, tête inclinée du côté opposé. Tendez lentement le coude et, dans le même temps, laissez la tête revenir vers l'épaule douloureuse ; puis repliez le coude en ramenant la tête de l'autre côté. Le cou rend au nerf ce que le coude lui prend : c'est ce va-et-vient qui le fait glisser sans jamais le tirer. Arrêtez avant toute reproduction de la douleur dans la main." },
                            { name: "Aménagement du poste et du sommeil", dose: "quotidien", tip: "Écran à hauteur des yeux, coude soutenu au bureau, oreiller qui garde la nuque dans l'axe. Évitez de dormir bras sous l'oreiller ou main sous la tête, position qui met le nerf en tension toute la nuit." },
                            { name: "Marche quotidienne", dose: "20 min", tip: "Une marche régulière, bras relâchés le long du corps. Bouger entretient la circulation autour du nerf, et l'immobilité prolongée entretient la douleur." }
                        ] },
                    { label: "Redonner du glissement au nerf", critere: "Vous faites les glissements sans réveiller de fourmillements dans la main, et vous tournez la tête des deux côtés sans que la douleur redescende dans le bras.", exercises: [
                            { name: "Glissement du nerf du bras", dose: "4 × 10, environ 6 sec par mouvement", tip: "Assis, bras le long du corps mais écarté d'une dizaine de degrés, épaule tirée vers le bas comme pour l'éloigner de l'oreille, paume tournée vers l'avant. Tendez le coude et relevez le poignet en laissant la tête s'incliner vers l'épaule douloureuse, puis repliez le coude en ramenant la tête de l'autre côté. Mouvement lent et rythmé, une minute de repos entre les séries. On cherche le va-et-vient, jamais l'étirement : mesuré, ce glissement déplace le nerf environ deux fois plus qu'une mise en tension tout en lui imposant huit fois moins de contrainte." },
                            { name: "Renforcement des fléchisseurs profonds du cou", dose: "3 × 10 tenues 5 sec", tip: "Allongé sur le dos, rentrez légèrement le menton comme pour faire un double menton, sans décoller la tête. Ces muscles profonds stabilisent votre cou et se mettent en veille dès qu'il y a douleur." },
                            { name: "Contrôle des omoplates", dose: "3 × 12", tip: "Assis ou debout, faites glisser les omoplates vers le bas et vers l'arrière, sans monter les épaules. Une omoplate qui tombe vers l'avant tire sur le trajet du nerf à chaque mouvement de bras." },
                            { name: "Mobilité douce du cou", dose: "3 × 10", tip: "Rotations et inclinaisons dans l'amplitude confortable, lentement. On entretient le mouvement sans aller chercher la position qui réveille le bras." }
                        ] },
                    { label: "Renforcer et remettre en tension", critere: "Vous tenez les exercices de renforcement sans que la douleur redescende dans le bras le lendemain, et la force du deltoïde se rapproche de celle du côté sain.", exercises: [
                            { name: "Mise en tension du nerf du bras", dose: "3 × 8 lents", tip: "Assis, bras le long du corps mais écarté d'une dizaine de degrés, épaule tirée vers le bas comme pour l'éloigner de l'oreille, paume tournée vers l'avant. Tendez le coude et relevez le poignet pendant que la tête part du côté opposé. Les deux extrémités tirent cette fois en même temps : c'est ce qui met le nerf en tension. À n'introduire que maintenant, quelques répétitions seulement, et à arrêter si des fourmillements apparaissent dans la main." },
                            { name: "Renforcement du deltoïde", dose: "3 × 12", tip: "Debout, élastique léger ou petite charge : levez le bras sur le côté jusqu'à l'horizontale, lentement, puis redescendez en contrôlant. Comparez régulièrement avec le côté sain : c'est le muscle que cette racine commande." },
                            { name: "Renforcement des stabilisateurs de l'omoplate", dose: "3 × 12", tip: "Tirage à l'élastique, coudes qui filent vers l'arrière, omoplates serrées sans monter les épaules. C'est le socle de tous les mouvements du bras." },
                            { name: "Endurance des fléchisseurs profonds", dose: "3 × 30 sec", tip: "Même rentrée de menton que précédemment, tenue plus longtemps. C'est l'endurance, plus que la force, qui protège le cou dans la journée." }
                        ] },
                    { label: "Retour aux activités", critere: "La douleur ne descend plus dans le bras, la force est comparable des deux côtés, et une journée complète de travail ne fait plus réapparaître les fourmillements dans l'épaule.", exercises: [
                            { name: "Travail au-dessus de la tête", dose: "3 × 12", tip: "Élévations progressives bras tendu, puis rangement d'objets en hauteur. C'est le geste que cette racine limite le plus, et celui qu'il faut retrouver en dernier." },
                            { name: "Retour progressif au port de charges", dose: "selon tolérance", tip: "Reprenez le port de charges en commençant léger et près du corps. Un bras tendu chargé est la position qui sollicite le plus le trajet du nerf." },
                            { name: "Entretien du glissement nerveux", dose: "2 × par semaine", tip: "Gardez quelques séries de glissement, même sans douleur, en particulier si votre travail vous impose des positions prolongées." },
                            { name: "Pauses et changements de position au travail", dose: "toutes les 30 à 45 min", tip: "Levez-vous, changez de posture, relâchez les épaules. Ce n'est pas la mauvaise position qui pose problème, c'est la position tenue trop longtemps." }
                        ] }
                ] },
            { id: "ncb-c6", label: "Névralgie cervico-brachiale C6", groupe: "Douleur qui descend dans le bras", desc: "Douleur qui descend le long de la face externe du bras et de l'avant-bras jusqu'au pouce et à l'index, souvent avec des fourmillements dans ces deux doigts.", context: "Une racine nerveuse sort de votre cou entre deux vertèbres, puis descend dans le bras. Quand elle est comprimée ou irritée à sa sortie, la douleur ne reste pas dans le cou : elle descend le long du trajet du nerf, ici la face externe du bras et de l'avant-bras, jusqu'au pouce et à l'index. C'est ce trajet, plus que l'intensité, qui dit quelle racine est en cause. Deux choses à savoir avant de commencer. D'abord, l'évolution est favorable dans la grande majorité des cas : environ trois patients sur quatre récupèrent sans chirurgie, et à distance neuf sur dix vont bien ou n'ont plus qu'une gêne légère. Ensuite, le repère qui compte n'est pas que la douleur diminue, mais qu'elle « remonte » : si elle quitte la main pour se limiter à l'épaule ou au cou, vous allez dans le bon sens, même si le cou est plus douloureux sur le moment. C'est ce qu'on appelle la centralisation, et c'est elle qui guide tout le parcours. Les exercices commencent par des mouvements de glissement du nerf, qui le font coulisser sans l'étirer : mesurés, ils déplacent le nerf deux fois plus qu'une mise en tension tout en lui imposant huit fois moins de contrainte. La mise en tension viendra plus tard, quand le nerf sera calmé. Le muscle à surveiller pour cette racine est le biceps et les muscles qui relèvent le poignet, et le nerf principalement sollicité par les exercices est le nerf médian.", stages: [
                    { label: "Calmer et faire remonter la douleur", critere: "La douleur a quitté la main ou l'avant-bras pour se limiter à l'épaule et au cou, et vous dormez la plupart des nuits. C'est cette remontée qui compte, même si le cou reste plus douloureux qu'avant.", exercises: [
                            { name: "Position de soulagement du bras", dose: "aussi souvent que nécessaire", tip: "Posez l'avant-bras sur un coussin, main plus haute que le coude, épaule légèrement relevée vers l'oreille. Certains sont soulagés main posée sur le sommet du crâne : si c'est votre cas, utilisez-la sans crainte, c'est un bon signe." },
                            { name: "Glissement du nerf, version très douce", dose: "3 × 8 lents", tip: "Assis, bras douloureux légèrement écarté du corps, coude fléchi, tête inclinée du côté opposé. Tendez lentement le coude et, dans le même temps, laissez la tête revenir vers l'épaule douloureuse ; puis repliez le coude en ramenant la tête de l'autre côté. Le cou rend au nerf ce que le coude lui prend : c'est ce va-et-vient qui le fait glisser sans jamais le tirer. Arrêtez avant toute reproduction de la douleur dans la main." },
                            { name: "Aménagement du poste et du sommeil", dose: "quotidien", tip: "Écran à hauteur des yeux, coude soutenu au bureau, oreiller qui garde la nuque dans l'axe. Évitez de dormir bras sous l'oreiller ou main sous la tête, position qui met le nerf en tension toute la nuit." },
                            { name: "Marche quotidienne", dose: "20 min", tip: "Une marche régulière, bras relâchés le long du corps. Bouger entretient la circulation autour du nerf, et l'immobilité prolongée entretient la douleur." }
                        ] },
                    { label: "Redonner du glissement au nerf", critere: "Vous faites les glissements sans réveiller de fourmillements dans la main, et vous tournez la tête des deux côtés sans que la douleur redescende dans le bras.", exercises: [
                            { name: "Glissement du nerf médian", dose: "4 × 10, environ 6 sec par mouvement", tip: "Assis, bras écarté sur le côté à hauteur d'épaule, épaule tirée vers le bas comme pour l'éloigner de l'oreille, paume tournée vers le plafond, doigts relâchés. Tendez le coude et relevez la main, doigts vers l'arrière, en inclinant la tête vers l'épaule douloureuse ; puis repliez le coude en ramenant la tête de l'autre côté. Mouvement lent et rythmé, une minute de repos entre les séries. On cherche le va-et-vient, jamais l'étirement : mesuré, ce glissement déplace le nerf environ deux fois plus qu'une mise en tension tout en lui imposant huit fois moins de contrainte." },
                            { name: "Renforcement des fléchisseurs profonds du cou", dose: "3 × 10 tenues 5 sec", tip: "Allongé sur le dos, rentrez légèrement le menton comme pour faire un double menton, sans décoller la tête. Ces muscles profonds stabilisent votre cou et se mettent en veille dès qu'il y a douleur." },
                            { name: "Contrôle des omoplates", dose: "3 × 12", tip: "Assis ou debout, faites glisser les omoplates vers le bas et vers l'arrière, sans monter les épaules. Une omoplate qui tombe vers l'avant tire sur le trajet du nerf à chaque mouvement de bras." },
                            { name: "Mobilité douce du cou", dose: "3 × 10", tip: "Rotations et inclinaisons dans l'amplitude confortable, lentement. On entretient le mouvement sans aller chercher la position qui réveille le bras." }
                        ] },
                    { label: "Renforcer et remettre en tension", critere: "Vous tenez les exercices de renforcement sans que la douleur redescende dans le bras le lendemain, et la force du biceps se rapproche de celle du côté sain.", exercises: [
                            { name: "Mise en tension du nerf médian", dose: "3 × 8 lents", tip: "Assis, bras écarté sur le côté à hauteur d'épaule, épaule tirée vers le bas comme pour l'éloigner de l'oreille, paume tournée vers le plafond, doigts relâchés. Tendez le coude et relevez la main, doigts vers l'arrière, pendant que la tête s'incline du côté opposé. Les deux extrémités tirent cette fois en même temps : c'est ce qui met le nerf en tension. À n'introduire que maintenant, quelques répétitions seulement, et à arrêter si des fourmillements apparaissent dans la main." },
                            { name: "Renforcement du biceps et des extenseurs du poignet", dose: "3 × 12", tip: "Flexion de coude avec une charge légère, puis relevé du poignet main dans le vide au bord d'une table. Ce sont les deux muscles commandés par cette racine, et les premiers à faiblir." },
                            { name: "Renforcement des stabilisateurs de l'omoplate", dose: "3 × 12", tip: "Tirage à l'élastique, coudes qui filent vers l'arrière, omoplates serrées sans monter les épaules. C'est le socle de tous les mouvements du bras." },
                            { name: "Endurance des fléchisseurs profonds", dose: "3 × 30 sec", tip: "Même rentrée de menton que précédemment, tenue plus longtemps. C'est l'endurance, plus que la force, qui protège le cou dans la journée." }
                        ] },
                    { label: "Retour aux activités", critere: "La douleur ne descend plus dans le bras, la force est comparable des deux côtés, et une journée complète de travail ne fait plus réapparaître les fourmillements dans le pouce et l'index.", exercises: [
                            { name: "Préhension et gestes fins", dose: "3 × 12", tip: "Reprenez les gestes de pince pouce-index, l'écriture, l'usage d'outils. C'est le territoire de cette racine, et la finesse du geste revient après la force." },
                            { name: "Retour progressif au port de charges", dose: "selon tolérance", tip: "Reprenez le port de charges en commençant léger et près du corps. Un bras tendu chargé est la position qui sollicite le plus le trajet du nerf." },
                            { name: "Entretien du glissement nerveux", dose: "2 × par semaine", tip: "Gardez quelques séries de glissement, même sans douleur, en particulier si votre travail vous impose des positions prolongées." },
                            { name: "Pauses et changements de position au travail", dose: "toutes les 30 à 45 min", tip: "Levez-vous, changez de posture, relâchez les épaules. Ce n'est pas la mauvaise position qui pose problème, c'est la position tenue trop longtemps." }
                        ] }
                ] },
            { id: "ncb-c7", label: "Névralgie cervico-brachiale C7", groupe: "Douleur qui descend dans le bras", desc: "Douleur qui descend derrière le bras et l'avant-bras jusqu'au majeur, souvent avec une difficulté à pousser ou à tendre le coude.", context: "Une racine nerveuse sort de votre cou entre deux vertèbres, puis descend dans le bras. Quand elle est comprimée ou irritée à sa sortie, la douleur ne reste pas dans le cou : elle descend le long du trajet du nerf, ici la face postérieure du bras et de l'avant-bras, jusqu'au majeur. C'est ce trajet, plus que l'intensité, qui dit quelle racine est en cause. Deux choses à savoir avant de commencer. D'abord, l'évolution est favorable dans la grande majorité des cas : environ trois patients sur quatre récupèrent sans chirurgie, et à distance neuf sur dix vont bien ou n'ont plus qu'une gêne légère. Ensuite, le repère qui compte n'est pas que la douleur diminue, mais qu'elle « remonte » : si elle quitte la main pour se limiter à l'épaule ou au cou, vous allez dans le bon sens, même si le cou est plus douloureux sur le moment. C'est ce qu'on appelle la centralisation, et c'est elle qui guide tout le parcours. Les exercices commencent par des mouvements de glissement du nerf, qui le font coulisser sans l'étirer : mesurés, ils déplacent le nerf deux fois plus qu'une mise en tension tout en lui imposant huit fois moins de contrainte. La mise en tension viendra plus tard, quand le nerf sera calmé. Le muscle à surveiller pour cette racine est le triceps, celui qui tend le coude, et le nerf principalement sollicité par les exercices est le nerf médian, et le nerf radial pour la face postérieure.", stages: [
                    { label: "Calmer et faire remonter la douleur", critere: "La douleur a quitté la main ou l'avant-bras pour se limiter à l'épaule et au cou, et vous dormez la plupart des nuits. C'est cette remontée qui compte, même si le cou reste plus douloureux qu'avant.", exercises: [
                            { name: "Position de soulagement du bras", dose: "aussi souvent que nécessaire", tip: "Posez l'avant-bras sur un coussin, main plus haute que le coude, épaule légèrement relevée vers l'oreille. Certains sont soulagés main posée sur le sommet du crâne : si c'est votre cas, utilisez-la sans crainte, c'est un bon signe." },
                            { name: "Glissement du nerf, version très douce", dose: "3 × 8 lents", tip: "Assis, bras douloureux légèrement écarté du corps, coude fléchi, tête inclinée du côté opposé. Tendez lentement le coude et, dans le même temps, laissez la tête revenir vers l'épaule douloureuse ; puis repliez le coude en ramenant la tête de l'autre côté. Le cou rend au nerf ce que le coude lui prend : c'est ce va-et-vient qui le fait glisser sans jamais le tirer. Arrêtez avant toute reproduction de la douleur dans la main." },
                            { name: "Aménagement du poste et du sommeil", dose: "quotidien", tip: "Écran à hauteur des yeux, coude soutenu au bureau, oreiller qui garde la nuque dans l'axe. Évitez de dormir bras sous l'oreiller ou main sous la tête, position qui met le nerf en tension toute la nuit." },
                            { name: "Marche quotidienne", dose: "20 min", tip: "Une marche régulière, bras relâchés le long du corps. Bouger entretient la circulation autour du nerf, et l'immobilité prolongée entretient la douleur." }
                        ] },

    { id: "thoracique", label: "Rachis thoracique", injuries: [
            { id: "dorsalgie", label: "Dorsalgie mécanique", desc: "Douleur entre les omoplates ou le long du haut du dos, liée à la posture prolongée ou à l'effort, soulagée par le mouvement.", context: "Le haut du dos est la zone la plus rigide de la colonne, et cette raideur se répercute directement plus haut et plus bas : une mobilité thoracique insuffisante augmente les contraintes sur la nuque et sur les épaules. C'est pourquoi le travail associe toujours mobilité en rotation et en extension, et renforcement des muscles qui tiennent les omoplates. Contrairement à une idée répandue, il n'existe pas une « bonne » posture unique à tenir : c'est l'immobilité prolongée, quelle que soit la position, qui pose problème.", stages: [
                    { label: "Douleur & mobilité", critere: "La douleur entre les omoplates ne se réveille plus au moindre mouvement, et respirer profondément est indolore.", exercises: [
                            { name: "Mobilité en rotation assise", dose: "3 × 10", tip: "Assis, bassin bien stable, bras croisés sur la poitrine. Tournez lentement le haut du dos d'un côté puis de l'autre, sans que le bassin ne suive le mouvement." },
                            { name: "Extension thoracique sur rouleau", dose: "3 × 10", tip: "Allongé sur le dos, rouleau ou serviette roulée sous les omoplates, mains derrière la nuque. Laissez le haut du dos s'ouvrir doucement en arrière par-dessus l'appui, puis revenez. Déplacez l'appui de quelques centimètres pour mobiliser segment par segment." },
                            { name: "Respiration diaphragmatique", dose: "3 × 1 min", tip: "Allongé, une main sur le ventre. Inspirez lentement en gonflant le ventre plutôt que la poitrine, puis expirez longuement. Les côtes et le haut du dos forment un ensemble : la respiration participe directement à leur mobilité." },
                            { name: "Étirement des pectoraux", dose: "3 × 30 sec", tip: "Debout dans l'encadrement d'une porte, avant-bras contre le montant, coude à hauteur d'épaule. Avancez légèrement le corps jusqu'à une tension douce à l'avant de l'épaule." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices de renforcement du haut du dos sans réveil de la douleur.", exercises: [
                            { name: "Renforcement des extenseurs du dos", dose: "3 × 12", tip: "Allongé sur le ventre, bras le long du corps. Décollez la poitrine de quelques centimètres, regard vers le sol pour ne pas casser la nuque, puis redescendez lentement. Petit mouvement, sans forcer." },
                            { name: "Rétraction des omoplates", dose: "3 × 15", tip: "Rapprochez les omoplates l'une de l'autre comme pour tenir un crayon entre elles, sans hausser les épaules. Maintenez 2-3 secondes puis relâchez." },
                            { name: "Renforcement des trapèzes inférieurs", dose: "3 × 12", tip: "Élastique fixé en hauteur, tirez les coudes vers le bas et l'arrière comme pour ranger les omoplates dans vos poches arrière. Contrebalance directement la tendance à l'enroulement des épaules." },
                            { name: "Gainage global", dose: "3 × 30 sec", tip: "À plat ventre, en appui sur les avant-bras et la pointe des pieds. Chevilles, bassin et épaules alignés, abdominaux serrés, bas du dos ni creusé ni arrondi. Respirez normalement : bloquer le souffle est une erreur fréquente." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous gardez le tronc stable pendant les mouvements des bras, et vous vous tournez sans appréhension.", exercises: [
                            { name: "Coordination mobilité thoraco-lombaire", dose: "3 × 10", tip: "Assis, bassin stable (asseyez-vous sur vos mains pour bien le sentir). Tournez uniquement le haut du dos et les épaules sans que le bassin ne suive, puis revenez et faites l'inverse." },
                            { name: "Exercices posturaux dynamiques", dose: "3 × 10", tip: "Debout, alternez volontairement entre une posture voûtée et une posture bien droite épaules ouvertes, en contrôlant la transition. Varier les positions vaut mieux que tenir une posture « parfaite » figée." },
                            { name: "Endurance posturale debout", dose: "3 × 1 min", tip: "Debout : oreilles au-dessus des épaules, épaules au-dessus des hanches, menton légèrement rentré. Maintenez sans crisper ni bloquer la respiration." },
                            { name: "Ouverture thoracique dynamique", dose: "3 × 10", tip: "Debout ou à genoux, ouvrez les bras en grand vers l'arrière à l'inspiration, refermez à l'expiration, en associant le mouvement des bras et la respiration." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous restez assis ou debout longuement sans que le haut du dos devienne douloureux, et vous portez des charges sans crainte.", exercises: [
                            { name: "Renforcement fonctionnel porté", dose: "3 × 12", tip: "Une charge légère dans chaque main (bouteilles, sacs), marchez quelques mètres dos droit et épaules stables. Augmentez le poids progressivement d'une séance à l'autre." },
                            { name: "Mobilité complète en charge", dose: "3 × 10", tip: "Debout, objet léger en main, réalisez rotations et inclinaisons du tronc en amplitude complète, lentement." },
                            { name: "Aménagement des positions de travail", dose: "quotidien", tip: "Alternez régulièrement assis et debout, et accordez-vous de courtes pauses de mobilité : c'est la durée d'immobilité qui compte davantage que la position elle-même." },
                            { name: "Maintien de la mobilité d'entretien", dose: "2 à 3 × par semaine", tip: "Poursuivez les rotations et extensions thoraciques dans la durée : la raideur du haut du dos revient vite si le travail s'arrête." }
                        ] }
                ] },
            { id: "raideur", label: "Raideur posturale", desc: "Sensation de dos raide, voûté ou « bloqué » en fin de journée, sans douleur vive particulière.", context: "Une posture voûtée n'est pas en soi une pathologie : le lien entre posture et douleur est bien plus faible qu'on ne le croit souvent. Ce qui compte, c'est de retrouver de la variété et de l'amplitude de mouvement, et d'avoir la force nécessaire pour tenir différentes positions sans fatigue. L'objectif n'est donc pas de se figer dans une posture « correcte », mais d'élargir le répertoire de positions disponibles et confortables.", stages: [
                    { label: "Mobilité", critere: "Bras levés au-dessus de la tête, vous allez plus loin qu'au début sans forcer : le haut du dos s'est assoupli.", exercises: [
                            { name: "Extension thoracique sur rouleau", dose: "3 × 10", tip: "Allongé sur le dos, rouleau sous les omoplates, mains derrière la nuque. Ouvrez le haut du dos par-dessus l'appui, en déplaçant le rouleau de quelques centimètres pour mobiliser segment par segment." },
                            { name: "Mobilité en rotation assise", dose: "3 × 10", tip: "Assis, bassin stable, tournez le haut du dos d'un côté puis de l'autre, en gagnant progressivement en amplitude plutôt qu'en forçant d'un coup." },
                            { name: "Étirement des pectoraux", dose: "3 × 30 sec", tip: "Debout, avant-bras contre un montant de porte, coude à hauteur d'épaule, avancez légèrement le corps jusqu'à une tension douce à l'avant de l'épaule." },
                            { name: "Mobilisation chat-vache", dose: "2 × 10", tip: "À quatre pattes, alternez lentement dos rond menton rentré et dos creux poitrine ouverte. Mouvement fluide, pour mobiliser toute la colonne segment par segment." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez les exercices de renforcement du haut du dos sans fatigue excessive.", exercises: [
                            { name: "Renforcement des extenseurs dorsaux", dose: "3 × 15", tip: "Allongé sur le ventre, bras tendus devant la tête. Décollez simultanément poitrine et bras de quelques centimètres, puis redescendez lentement. Sans force d'endurance, aucune posture ne peut être tenue longtemps." },
                            { name: "Renforcement rhomboïdes / trapèzes moyens", dose: "3 × 15", tip: "Bras pliés à 90°, coudes proches du corps. Tirez les omoplates vers le bas et l'arrière, comme pour les glisser dans vos poches arrière, sans hausser les épaules." },
                            { name: "Gainage postérieur", dose: "3 × 30 sec", tip: "Allongé sur le ventre, bras le long du corps. Décollez légèrement la poitrine et les jambes du sol, regard vers le sol pour ne pas casser la nuque, et tenez sans chercher à cambrer au maximum." },
                            { name: "Renforcement en tirage", dose: "3 × 12", tip: "Élastique fixé devant vous à hauteur de poitrine, tirez les coudes vers l'arrière en serrant les omoplates. La force en tirage est directement ce qui permet de tenir le haut du dos ouvert sans effort conscient." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous tenez une position redressée sans effort conscient permanent, et vos gestes en hauteur sont plus libres.", exercises: [
                            { name: "Correction posturale active", dose: "3 × 10", tip: "Devant un miroir si possible, redressez-vous : oreilles au-dessus des épaules, épaules ouvertes et basses, menton légèrement rentré. Maintenez quelques secondes en respirant normalement, sans crisper." },
                            { name: "Ouverture thoracique dynamique", dose: "3 × 10", tip: "Ouvrez les bras en grand vers l'arrière à l'inspiration, refermez à l'expiration, en associant mouvement et respiration." },
                            { name: "Endurance posturale prolongée", dose: "3 × 1 min", tip: "Assis ou debout, position maintenue plus longtemps qu'aux étapes précédentes, sans raidir le corps." },
                            { name: "Alternance de positions", dose: "quotidien", tip: "Changez volontairement de position toutes les 30 à 45 minutes dans la journée. La variété est plus protectrice que la recherche d'une posture parfaite tenue en permanence." }
                        ] },
                    { label: "Retour à l'activité", critere: "Les gains tiennent d'une semaine sur l'autre sans que vous ayez à y penser. Ici il n'y a pas de guérison à atteindre mais un entretien : les gains de souplesse se perdent en quelques semaines d'arrêt.", exercises: [
                            { name: "Intégration posturale fonctionnelle", dose: "3 × 12", tip: "Choisissez une activité du quotidien (marcher, travailler assis, se brosser les dents) et appliquez-y consciemment la posture travaillée, pendant toute la durée de l'activité." },
                            { name: "Renforcement global de la chaîne postérieure", dose: "3 × 15", tip: "Hanche en charnière : debout, jambes presque tendues, poussez les fesses vers l'arrière en penchant le buste dos neutre, puis redressez-vous en contractant fessiers et dos. Une charge légère peut être ajoutée progressivement." },
                            { name: "Reprise d'une activité physique régulière", dose: "2 à 3 × par semaine", tip: "Marche rapide, natation, renforcement : l'activité physique régulière est ce qui entretient le mieux la mobilité du dos sur le long terme, davantage que les exercices isolés." },
                            { name: "Maintien du travail de mobilité", dose: "2 à 3 × par semaine", tip: "Poursuivez rotations et extensions thoraciques dans la durée : sans entretien, la raideur revient en quelques semaines." }
                        ] }
                ] }
        ] },
    { id: "lombaire", label: "Rachis lombaire", injuries: [
            { id: "lombalgie", label: "Lombalgie commune", groupe: "Douleur limitée au dos", desc: "Douleur dans le bas du dos qui ne descend pas dans la jambe, apparue progressivement ou après un effort.", context: "C'est la forme de loin la plus fréquente, et son évolution est favorable dans la grande majorité des cas. Trois messages font consensus et changent réellement le pronostic : rester actif vaut mieux que le repos au lit, l'imagerie n'est pas utile en l'absence de signe d'alerte (les anomalies visibles sont très fréquentes chez des personnes sans douleur), et aucun exercice précis n'a démontré de supériorité sur les autres — c'est la régularité et le fait de bouger qui comptent, pas le choix parfait de l'exercice.", stages: [
                    { label: "Douleur & mobilité", critere: "Vous vous levez d'une chaise et vous vous habillez sans blocage, la douleur ne descend plus dans la jambe, et marcher vingt minutes ne l'aggrave pas.", exercises: [
                            { name: "Bascules du bassin", dose: "3 × 15", tip: "Allongé sur le dos, genoux pliés, pieds à plat. Creusez légèrement le bas du dos puis, à l'inverse, plaquez-le contre le sol. Petit mouvement de balancier, sans bouger les jambes ni lever les fesses." },
                            { name: "Mobilité lombaire douce (dos rond / dos creux)", dose: "3 × 10", tip: "À quatre pattes, alternez lentement dos rond menton rentré et dos creux poitrine ouverte, sur l'amplitude confortable." },
                            { name: "Marche courte régulière", dose: "10 min", tip: "Allure confortable, plusieurs fois par jour. Rester actif accélère la récupération : le repos au lit prolongé est aujourd'hui clairement déconseillé et retarde la guérison." },
                            { name: "Position de soulagement", dose: "3 × 2 min", tip: "Trouvez la position qui vous soulage le plus (allongé genoux fléchis sur un coussin, ou sur le côté) et utilisez-la ponctuellement en phase douloureuse, sans en faire une position de repos permanente." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez le gainage et le pont fessier sans que la douleur dépasse 3/10, et vous ne redoutez plus de vous pencher en avant pour ramasser un objet.", exercises: [
                            { name: "Gainage abdominal (planche modifiée)", dose: "3 × 20 sec", tip: "À plat ventre, en appui sur les avant-bras, coudes sous les épaules, et sur les genoux plutôt que sur les pieds pour commencer. Alignez épaules, bassin et genoux, serrez les abdominaux sans creuser ni arrondir le bas du dos, et respirez normalement. Allongez la durée d'une séance à l'autre plutôt que de chercher à tenir longtemps d'emblée." },
                            { name: "Pont fessier", dose: "3 × 12", tip: "Allongé sur le dos, genoux pliés. Levez le bassin en serrant les fessiers et en gainant les abdominaux, puis redescendez lentement." },
                            { name: "Renforcement para-vertébral léger", dose: "3 × 12", tip: "Allongé sur le ventre, front sur les mains. Décollez légèrement la poitrine de quelques centimètres, maintenez un instant, puis reposez. Petit mouvement, pas une grande cambrure." },
                            { name: "Renforcement du transverse abdominal", dose: "3 × 15", tip: "Allongé sur le dos, genoux pliés. Rentrez doucement le nombril comme pour resserrer une ceinture, sans bloquer la respiration ni serrer les fessiers, et maintenez quelques secondes." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous soulevez une charge légère du sol en gardant le contrôle et sans appréhension, et les gestes du quotidien — courses, ménage, voiture — ne réveillent plus la douleur au-delà de 3/10.", exercises: [
                            { name: "Gainage dynamique", dose: "3 × 10", tip: "En planche ou à quatre pattes, ajoutez un mouvement de bras ou de jambe en gardant le dos parfaitement stable." },
                            { name: "Stabilité lombo-pelvienne", dose: "3 × 10", tip: "Allongé sur le dos, genoux pliés. Gardez le bas du dos immobile pendant que vous glissez lentement un talon puis l'autre vers l'avant, sans que le bassin ne bouge." },
                            { name: "Squat fonctionnel contrôlé", dose: "3 × 10", tip: "Debout, pieds largeur du bassin, descendez en gardant le dos neutre, mouvement lent, puis remontez en poussant sur les jambes." },
                            { name: "Hanche en charnière", dose: "3 × 10", tip: "Debout, jambes presque tendues, poussez les fesses vers l'arrière en penchant le buste dos neutre, puis redressez-vous. Apprendre à plier depuis la hanche plutôt qu'en arrondissant le dos est la base du geste de soulevé sécurisé." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous avez repris vos activités habituelles, y compris celles que vous évitiez, et une journée chargée ne laisse qu'une fatigue passagère. À ce stade l'objectif n'est plus l'absence de douleur, mais votre capacité à traverser un épisode sans tout arrêter.", exercises: [
                            { name: "Renforcement fonctionnel progressif", dose: "3 × 12", tip: "Debout, un objet léger posé au sol devant vous. Fléchissez genoux et hanches pour descendre, dos neutre, saisissez l'objet en le gardant près du corps, puis remontez en poussant sur les jambes. Alourdissez l'objet au fil des séances." },
                            { name: "Port de charge contrôlé", dose: "3 × 10", tip: "Debout face à la charge, pieds de part et d'autre. Fléchissez hanches et genoux, saisissez-la en la gardant collée au corps, puis remontez en poussant sur les jambes. Le dos reste neutre, pas nécessairement vertical. Le dos n'est pas fragile : c'est justement la charge progressive qui le renforce." },
                            { name: "Reprise d'une activité physique régulière", dose: "2 à 3 × par semaine", tip: "Marche, natation, vélo ou renforcement : l'activité choisie importe moins que sa régularité, qui est le meilleur facteur de prévention de la récidive." },
                            { name: "Gestion des épisodes futurs", dose: "au besoin", tip: "Une récidive est fréquente et n'est pas un échec. Reprenez alors les exercices du premier stade et restez actif : c'est ce qui raccourcit le plus la durée de l'épisode." }
                        ] }
                ] },
            { id: "lombosciatique", label: "Lombosciatique", groupe: "Douleur qui descend dans la jambe", desc: "Douleur du bas du dos qui descend dans la fesse ou la jambe, parfois avec fourmillements ou engourdissement.", context: "Quand la douleur descend dans la jambe, un repère guide toute la rééducation : la centralisation. Si les exercices font remonter la douleur de la jambe vers le bas du dos, c'est un signe favorable et on poursuit dans cette direction. Si au contraire la douleur descend plus loin, on arrête ce mouvement. Une perte de force franche, un engourdissement de la région génitale ou des troubles pour uriner imposent un avis médical urgent, sans attendre.", stages: [
                    { label: "Douleur & centralisation", critere: "La douleur est remontée vers le bas du dos et ne descend plus aussi bas dans la jambe. C'est ce déplacement qu'on cherche, plus que la baisse d'intensité.", exercises: [
                            { name: "Position de soulagement", dose: "3 × 3 min", tip: "Cherchez la position qui réduit le plus la douleur descendant dans la jambe. Selon les personnes, ce sera plutôt allongé sur le ventre, plutôt genoux ramenés vers la poitrine : cette direction préférentielle guidera ensuite le choix des exercices." },
                            { name: "Mouvements répétés dans la direction qui soulage", dose: "3 × 10", tip: "Une fois la position de soulagement identifiée, répétez doucement le mouvement qui va dans ce sens. Surveillez la centralisation : la douleur doit remonter vers le dos, jamais descendre plus loin dans la jambe." },
                            { name: "Étirements du nerf sciatique (doux)", dose: "3 × 10", tip: "Allongé sur le dos, un genou plié. Remontez doucement l'autre jambe tendue vers le plafond, avec une serviette sous le pied si besoin, jusqu'à une légère tension à l'arrière de la cuisse. Arrêtez avant que la douleur de la jambe ne se réveille." },
                            { name: "Marche courte fractionnée", dose: "10 min", tip: "Plusieurs courtes sorties par jour plutôt qu'une longue, à allure confortable, en restant sous le seuil de réveil de la douleur de jambe." }
                        ] },
                    { label: "Renforcement", critere: "Vous tenez le gainage et le renforcement sans que la douleur redescende dans la jambe.", exercises: [
                            { name: "Gainage doux progressif", dose: "3 × 20 sec", tip: "Planche sur les genoux ou gainage allongé, en augmentant la durée d'une séance à l'autre selon la tolérance." },
                            { name: "Renforcement fessiers léger", dose: "3 × 12", tip: "Allongé sur le côté, jambes légèrement pliées l'une sur l'autre. Levez le genou du dessus vers le plafond en gardant les pieds joints, sans faire rouler le bassin vers l'arrière." },
                            { name: "Renforcement abdominal profond", dose: "3 × 15", tip: "Allongé sur le dos, genoux pliés. Rentrez doucement le nombril comme pour resserrer une ceinture, sans bloquer la respiration, et maintenez quelques secondes." },
                            { name: "Pont fessier", dose: "3 × 12", tip: "Allongé sur le dos, genoux pliés, pieds à plat. Serrez les fessiers, puis montez le bassin en vous arrêtant à la hauteur qui ne réveille pas la douleur descendant dans la jambe, et redescendez lentement. Ici l'amplitude compte moins que l'absence de symptôme dans la jambe." }
                        ] },
                    { label: "Contrôle moteur", critere: "Vous vous penchez et soulevez une charge légère sans appréhension ni retour des symptômes dans la jambe.", exercises: [
                            { name: "Stabilité lombo-pelvienne dynamique", dose: "3 × 10", tip: "À quatre pattes, dos plat. Tendez un bras devant vous en même temps que la jambe opposée derrière, sans que le bassin ne bascule, puis changez de côté." },
                            { name: "Squat contrôlé, hanche en charnière", dose: "3 × 10", tip: "Debout, poussez les fesses vers l'arrière comme pour vous asseoir sur une chaise derrière vous, dos neutre, genoux qui se plient légèrement. Le mouvement part de la hanche, pas du dos." },
                            { name: "Gainage multidirectionnel", dose: "3 × 10", tip: "Enchaînez gainage de face, gainage sur le côté droit, puis sur le côté gauche. À chaque variante, le dos reste neutre — ni creusé ni arrondi — et la respiration continue." },
                            { name: "Glissements du nerf sciatique", dose: "3 × 10", tip: "Assis, tendez le genou en relevant la tête, puis pliez le genou en baissant le menton, dans un mouvement alterné et fluide. On cherche un glissement du nerf, pas un étirement maintenu." }
                        ] },
                    { label: "Retour à l'activité", critere: "La douleur ne descend plus dans la jambe, vous avez repris vos activités, et une journée chargée ne laisse qu'une fatigue passagère. Une faiblesse persistante du pied ou de la jambe justifie un avis médical, pas une progression.", exercises: [
                            { name: "Renforcement fonctionnel global", dose: "3 × 12", tip: "Enchaînez sur une même séance squat, hanche en charnière et port de charge, avec une intensité qui monte de semaine en semaine. Le repère n'est pas la douleur lombaire du moment, mais la jambe : tant que rien ne redescend dedans, la progression est bonne." },
                            { name: "Port de charge progressif", dose: "3 × 10", tip: "Debout face à la charge, pieds de part et d'autre. Fléchissez hanches et genoux, saisissez la charge en la gardant collée au corps, puis remontez en poussant sur les jambes. Le dos reste neutre, pas forcément vertical." },
                            { name: "Reprise activité / sport encadrée", dose: "1 séance", tip: "Progressive, sous surveillance des symptômes irradiés plutôt que de la seule douleur lombaire." },
                            { name: "Surveillance de la centralisation", dose: "quotidien", tip: "Gardez ce repère au long cours : tant que la douleur reste centrée sur le bas du dos, la progression est bonne. Si elle recommence à descendre dans la jambe, revenez au stade précédent." }
                        ] }
                ] },
            { id: "hernie-discale", label: "Hernie discale", groupe: "Douleur qui descend dans la jambe", desc: "Douleur lombaire qui descend souvent dans la jambe, généralement soulagée en position debout ou cambrée (extension) et aggravée en position assise prolongée ou penchée en avant (flexion).", context: "Deux faits rassurants et bien établis : la majorité des hernies discales évoluent favorablement sans chirurgie, et beaucoup se résorbent spontanément avec le temps. Le repère qui guide toute la rééducation est la centralisation — une douleur de jambe qui remonte vers le bas du dos est un signe favorable. Une perte de force franche, un engourdissement de la région génitale ou des troubles pour uriner imposent en revanche un avis médical urgent.", stages: [
                    { label: "Centralisation en extension", critere: "Les symptômes remontent vers le dos et quittent la jambe pendant les exercices en extension. C'est ce déplacement vers le centre, et non la disparition de la douleur, qui autorise la suite.", exercises: [
                            { name: "Position allongée sur le ventre", dose: "3 × 5 min", tip: "Allongé sur le ventre, bras le long du corps ou sous le front, relâchez complètement. Première étape simple du protocole d'extension : elle amorce souvent, à elle seule, un début de soulagement de la douleur qui descend dans la jambe." },
                            { name: "Extension en appui sur les avant-bras (sphinx)", dose: "5 × 2 min", tip: "Allongé sur le ventre, redressez le buste en appui sur les avant-bras, coudes sous les épaules, bassin qui reste au sol. Maintenez la position en respirant normalement." },
                            { name: "Presses en extension (press-ups)", dose: "3 × 10", tip: "Allongé sur le ventre, mains à plat sous les épaules. Poussez pour redresser le buste, bras qui se tendent progressivement, bassin qui reste posé au sol, puis redescendez. Répétez en allant un peu plus loin à chaque fois si la douleur de la jambe remonte vers le dos." },
                            { name: "Suivi de la centralisation", dose: "après chaque série", tip: "Repère clé de cette approche : si la douleur qui descend dans la jambe remonte progressivement vers le bas du dos (« centralisation »), c'est un signe favorable, à poursuivre. Si elle descend au contraire plus loin dans la jambe, arrêtez l'exercice et parlez-en à votre kinésithérapeute." }
                        ] },
                    { label: "Renforcement en extension contrôlée", critere: "Vous tenez les exercices en extension contrôlée sans retour des symptômes dans la jambe.", exercises: [
                            { name: "Extension complète debout", dose: "3 × 10", tip: "Debout, mains posées dans le bas du dos, penchez-vous doucement en arrière sur une amplitude confortable, puis revenez. Permet de maintenir l'effet de soulagement obtenu au sol, en position debout du quotidien." },
                            { name: "Renforcement des extenseurs du dos", dose: "3 × 12", tip: "Allongé sur le ventre, front posé sur les mains. Décollez légèrement la poitrine du sol, quelques centimètres seulement, maintenez un instant, puis reposez-vous, sans forcer sur la nuque." },
                            { name: "Gainage en position neutre à légèrement cambrée", dose: "3 × 20 sec", tip: "Planche sur les avant-bras, genoux au sol si besoin, dos neutre à légèrement creusé — pas de dos rond ici, contrairement à d'autres formes de mal de dos." },
                            { name: "Marche courte régulière", dose: "10 min", tip: "La marche est généralement bien tolérée et même recommandée à ce stade, contrairement à un repos strict prolongé qui n'apporte pas de bénéfice démontré." }
                        ] },
                    { label: "Charge fonctionnelle sans flexion excessive", critere: "Vous soulevez une charge légère en gardant le dos neutre, sans que rien ne redescende dans la jambe.", exercises: [
                            { name: "Hanche en charnière (soulevé sécurisé)", dose: "3 × 10", tip: "Debout, jambes presque tendues, poussez les fesses vers l'arrière en penchant le buste, dos neutre, genoux qui plient légèrement, puis redressez-vous en poussant sur les jambes. Le mouvement part de la hanche, pas d'un arrondi du dos." },
                            { name: "Squat fonctionnel dos neutre", dose: "3 × 12", tip: "Debout, pieds largeur du bassin, pointes légèrement ouvertes. Descendez en poussant les fesses vers l'arrière comme pour s'asseoir, dos neutre, talons au sol, puis remontez. Descendez seulement aussi bas que le dos reste droit." },
                            { name: "Gainage dynamique", dose: "3 × 10", tip: "En planche ou à quatre pattes, ajoutez un léger mouvement de bras ou de jambe en gardant le dos stable, sans partir en flexion." },
                            { name: "Marche prolongée", dose: "20 min", tip: "Augmentez progressivement la durée, en restant attentif à la centralisation plutôt qu'à la seule intensité de la douleur." }
                        ] },
                    { label: "Retour à l'activité", critere: "Vous vous penchez et restez assis longtemps sans retour des symptômes, et vous avez repris vos activités. La flexion se réintroduit progressivement, en surveillant que rien ne redescende dans la jambe.", exercises: [
                            { name: "Réintroduction progressive de la flexion", dose: "chaque semaine", tip: "Une fois la phase centrée sur l'extension bien tolérée, une flexion mesurée et progressive (se pencher, s'asseoir longtemps) peut généralement être réintroduite sans risque, sous contrôle des symptômes." },
                            { name: "Reprise du port de charge", dose: "3 × 10", tip: "Debout face à la charge, pieds de part et d'autre, dos neutre. Reprenez la technique du stade précédent — flexion des hanches et des genoux, charge collée au corps — avec un poids un peu plus lourd chaque semaine, à condition que le lendemain reste calme." },
                            { name: "Maintien des extensions d'entretien", dose: "2 × par semaine", tip: "Continuez ponctuellement les presses en extension en prévention, notamment après une position assise prolongée, même une fois les symptômes calmés." },
                            { name: "Reprise activité / sport", dose: "1 séance", tip: "Progressive et encadrée, en gardant à l'esprit le repère de centralisation en cas de réapparition de symptômes." }
                        ] }

            { id: "stenose-spinale", label: "Sténose spinale", groupe: "Gêne à la marche", desc: "Douleur, lourdeur ou engourdissement dans les jambes à la marche ou en station debout prolongée, généralement soulagés en position assise ou penchée en avant (flexion) et aggravés en position debout cambrée (extension).", context: "Le canal où passent les nerfs se rétrécit, et c'est la position qui détermine l'espace disponible : la flexion l'ouvre, l'extension le referme. Cela explique le signe le plus caractéristique — pouvoir marcher bien plus longtemps en poussant un caddie qu'en marchant redressé. Le repère de progression le plus pertinent ici n'est pas la douleur mais le périmètre de marche, à suivre semaine après semaine.", stages: [

// --- Recherche : index unifié sur les trois parcours (zones, coureur, prévention) ---
// Beaucoup de patients arrivent avec un mot précis sur leur ordonnance, sans savoir
// dans quelle zone le chercher. L'index couvre donc les libellés, les descriptions
// symptomatiques et les appellations courantes, et il est insensible aux accents.
function normalizeSearch(str) {
    return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[''`-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

    {

        alias: "Le dos rond qui fait mal",
        desc: "Un dos qui s'arrondit en haut et qui devient douloureux en fin de journée, surtout assis en cours ou penché sur un bureau.",
        context: "Pendant la croissance, tes vertèbres grandissent en hauteur. Chez certains, l'avant de plusieurs vertèbres du haut du dos pousse un peu moins vite que l'arrière : elles prennent une forme légèrement en coin, et ton dos s'arrondit. Ça n'est pas dû à ta posture — tu ne t'es pas mal tenu, ce n'est pas de ta faute. La douleur vient surtout de la fatigue des muscles qui essaient de te redresser toute la journée. Le travail consiste à assouplir le haut du dos, muscler ce qui te redresse, et changer souvent de position. Une fois la croissance terminée, la forme reste, mais la douleur disparaît le plus souvent.",
        parent: "Le Scheuermann n'est pas un trouble postural mais une dystrophie de croissance vertébrale : le dire clairement évite la culpabilisation de l'enfant et les injonctions à « se tenir droit », inefficaces et contre-productives. La rééducation vise la souplesse en extension thoracique, le renforcement des extenseurs et la variation posturale. Le suivi de l'angulation revient au médecin, avec la question du corset dans les formes évolutives. Une douleur nocturne, une raideur matinale marquée ou des signes neurologiques sortent du cadre.",
        drapeaux: ["Une douleur qui te réveille la nuit, ou une raideur importante le matin qui dure plus d'une heure.", "Des fourmillements, une faiblesse dans les jambes, ou une gêne pour respirer."],

            { critere: "Ton dos ne te fait plus mal en fin de journée d'école, et tu peux rester assis une heure sans devoir bouger sans arrêt.", exercises: [
