# Trois passes à chaque modification : ce qui se lit dans le fichier, ce qui ne se voit qu'à
# l'écran, et l'état des contrôles eux-mêmes. La première dure quelques secondes et
# n'installe rien ; la deuxième demande un navigateur, et tourne donc à part pour que l'échec
# le plus courant remonte le plus vite. La troisième met chaque contrôle en défaut : deux
# d'entre eux avaient cessé de vérifier quoi que ce soit sans que rien ne le signale.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  statique:
    name: Contrôles statiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Le fichier et le contenu
        run: node verification/statique.mjs

  mutation:
    name: Les contrôles mordent-ils encore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Aucun navigateur ici : le banc ne relance que la suite statique, une fois par
      # contrôle, sur une copie trafiquée du fichier.
      - name: Chaque contrôle voit-il son défaut
        run: node verification/mutation.mjs

  rendu:
    name: Contrôles de rendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Aucun package.json dans le dépôt : l'application n'a pas de dépendances, seuls les
      # contrôles en ont. On les installe sans rien écrire dans le dépôt.
      - name: Outils de contrôle
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: L'écran, les deux thèmes, et le hors-ligne
        run: node verification/rendu.mjs
